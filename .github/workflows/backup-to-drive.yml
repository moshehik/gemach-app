# "גיבוי ענני לדרייב" - מריץ scripts/cloud_backup.js על שני הגמחים (הראשי + נווה יעקב,
# כל אחד עם DB נפרד - ר' scripts/lib/db-env.js) ומעלה גיבוי מלא ל-Drive, לכל ארגון
# לתיקיית root נפרדת משלו, דרך אותו גשר Apps Script משותף שכבר מריץ את print-center
# ("apps-script-send"/ArchiveBridge.js - ר' scripts/lib/driveBridge.js). ר' BACKUPS.md
# לתיעוד המלא.
#
# טריגר כפול: schedule פעם ביום (ה-script עצמו מחליט אם באמת צריך לגבות, לפי
# backup_interval_hours שכל גמח קובע ב-/admin/backups) + repository_dispatch מיידי (נורה
# מ-app/api/admin/backups/trigger/route.js כשמנהל לוחץ "גיבוי מיידי" - תמיד רץ מיידית,
# בלי קשר ללוח הזמנים). ה-schedule היה במקור כל 15 דק' (אותו דפוס כמו
# claude-fix-reports.yml) - הורד לפעם ביום ב-17.09.2026 אחרי שהתגלה שכל עוד שלב
# ההעלאה נכשל, ריצה שאף פעם לא מגיעה ל-'ok' גרמה לכל טיק (עד 96 ביום) להריץ dump מלא
# מחדש - לא בדיקה זולה בפועל. ר' "Why the schedule is once daily" ב-BACKUPS.md.
#
# דורש (מוסיף משה עצמו, לא בקוד):
# 1. secrets DATABASE_URL + DATABASE_URL_ORG2 - כבר קיימים ברפו הזה (משמשים גם את
#    claude-fix-reports.yml) ומשמשים כאן ללא שינוי, שני ה-DB-ים.
# 2. env vars GH_DISPATCH_TOKEN + GH_DISPATCH_REPO ב-Vercel (שני הפרויקטים) - כבר
#    קיימים (אותו מנגנון ששולח repository_dispatch על דיווח תקלה חדש).
# 3. secrets DRIVE_BRIDGE_URL + DRIVE_BRIDGE_SECRET - משותפים לשני הארגונים (הגשר
#    וה-ADMIN_SECRET שלו לא שייכים לאף DB ספציפי, בדיוק כמו DATABASE_URL/ORG2 למעלה).
# 4. הגדרת (רשות) שם תיקיית דרייב + backup_owner_email ב-/admin/backups לכל גמח.

name: Backup to Drive (גיבוי ענני)

on:
  schedule:
    - cron: '0 1 * * *' # פעם ביום, ~03:00-04:00 שעון ישראל תלוי שעון קיץ/חורף
  workflow_dispatch: {} # הרצה ידנית מ-Actions, לבדיקה
  repository_dispatch:
    types: [run-backup-now] # נורה מ-app/api/admin/backups/trigger/route.js

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run cloud backup (both orgs)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_ORG2: ${{ secrets.DATABASE_URL_ORG2 }}
          DRIVE_BRIDGE_URL: ${{ secrets.DRIVE_BRIDGE_URL }}
          DRIVE_BRIDGE_SECRET: ${{ secrets.DRIVE_BRIDGE_SECRET }}
        run: node scripts/cloud_backup.js
