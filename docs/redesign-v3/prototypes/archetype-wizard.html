/* toast */
#toast{position:fixed;inset-inline-end:24px;bottom:24px;z-index:120;display:flex;align-items:center;gap:14px;background:var(--navy);color:#fff;border-radius:18px;padding:14px 18px 14px 14px;box-shadow:var(--sh-lg);transform:translateX(-140%);opacity:0;transition:transform .5s cubic-bezier(.2,1.2,.3,1),opacity .3s;max-width:calc(100vw - 32px)}

#toast .tb{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
#toast.charge .tb{background:var(--gold-300);color:var(--gold-700)}
#toast.credit .tb{background:var(--sky-200);color:var(--navy-700)}
#toast.info .tb{background:var(--sky-200);color:var(--navy-700)}

/* dialog */
.scrim{position:fixed;inset:0;background:rgba(10,34,66,.55);backdrop-filter:blur(3px);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}

.methods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.methods button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:500}

/* responsive */

  .step b{font-size:15px}.step span{font-size:14px}
  .grid2{grid-template-columns:1fr}

}

/* single date-ordered timeline */
.stepper{padding:24px 16px}
.tlx{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.tx{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;position:relative;min-width:0}
.tx .dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid var(--sky-300);color:var(--navy);z-index:1}
.tx.done .dot{background:var(--navy);border-color:var(--navy);color:#fff}
.tx.cur .dot{background:var(--gbtn);border-color:#000;color:#000;box-shadow:0 0 0 6px rgba(201,162,39,.28)}
.tx .tt b{display:block;font-weight:600;font-size:15px;line-height:1.3}
.tx .tt span{display:block;font-size:14px;color:var(--ink3);line-height:1.4}
.tx.cur .tt b{color:var(--navy)}
.tx.deliv .dot{border-radius:12px;border-color:var(--gold-b);background:var(--rose-100);color:var(--navy)}
.tx.deliv.done .dot{background:var(--navy);border-color:var(--gold-b);color:#fff}
.tx.deliv.cur .dot{border-color:#000}
.tx:not(:last-child)::after{content:"";position:absolute;top:19px;inset-inline-start:calc(50% + 26px);width:calc(100% - 52px);height:3px;border-radius:3px;background:var(--sky-200)}
.tx.done:not(:last-child)::after{background:var(--navy)}
@media (max-width:640px){
  .tlx{grid-template-columns:1fr;gap:0}
  .tx{flex-direction:row;align-items:flex-start;text-align:start;gap:16px;padding-bottom:16px}
  .tx:last-child{padding-bottom:0}
  .tx:not(:last-child)::after{top:44px;bottom:-4px;height:auto;width:3px;inset-inline-start:19px}
  .tx .tt{padding-top:2px}
  .tx .tt span{display:inline}
  .tx .tt span+span::before{content:" · "}
}

/* timeline v3: delivery = same node style; gold ONLY for the "now" marker */
.tlx{padding-top:32px}
.tx .dot{position:relative}
.tx.deliv .dot,.tx.deliv.done .dot,.tx.deliv.cur .dot{border-radius:50%}
.tx.cur .dot{background:#fff;border-color:var(--gold-b);color:var(--navy);box-shadow:0 0 0 5px rgba(201,162,39,.35);animation:nowpulse 1.8s ease-in-out infinite}
@keyframes nowpulse{50%{box-shadow:0 0 0 10px rgba(201,162,39,.12)}}
.tx .ck{position:absolute;bottom:-5px;inset-inline-end:-5px;width:18px;height:18px;border-radius:50%;background:#fff;color:var(--navy);border:1.5px solid var(--navy);display:grid;place-items:center}
.tx .ck .ic{width:11px;height:11px;stroke-width:3}
.tx .now{position:absolute;top:-30px;inset-inline-end:50%;transform:translateX(-50%);background:var(--gbtn);color:#000;border:1.5px solid #000;border-radius:999px;padding:0 10px;font-weight:700;font-size:14px;line-height:24px;white-space:nowrap;z-index:2}
.tx .now i{position:absolute;bottom:-6px;inset-inline-end:50%;transform:translateX(-50%) rotate(45deg);width:9px;height:9px;background:#d1ad38;border-inline-start:1.5px solid #000;border-bottom:1.5px solid #000}
.tx .today{position:absolute;top:-32px;inset-inline-start:calc(50% + 26px + (100% - 52px)/2);transform:translateX(50%);display:flex;flex-direction:column;align-items:center;z-index:2;white-space:nowrap}
.tx .today b{background:var(--gbtn);color:#000;border:1.5px solid #000;border-radius:999px;padding:0 10px;font-size:14px;line-height:24px}
.tx .today span{position:absolute;top:60px;font-size:13px;color:var(--ink2)}

@media (max-width:640px){
  .tlx{padding-top:0}
  .tx .now{top:2px;inset-inline-end:auto;inset-inline-start:52px;transform:none}
  .tx .now i{display:none}
  .tx .tt{padding-top:2px}
  .tx.cur .tt{padding-top:30px}
  .tx.hasnow{padding-bottom:56px}
  .tx .today{top:auto;bottom:6px;inset-inline-start:0;transform:none;flex-direction:row;align-items:center;gap:8px}
  .tx .today span{position:static;font-size:14px}
  .tx .today i{display:none}
}

/* ===== motion language: ease-out + soft spring, 150-500ms ===== */
:root{--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.2,1.3,.3,1)}
.panel{animation:tabin .18s var(--ease)}
@keyframes tabin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes popin{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes tilepop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:none}}
@keyframes fadein{from{opacity:0}}
@keyframes rowin{from{opacity:0;transform:translateY(-8px) scale(.98)}}
@keyframes rowout{from{max-height:420px}to{opacity:0;transform:scale(.96);max-height:0}}
.tx.fresh .ck{animation:popin .45s var(--spring)}
.tx.fresh .ck svg{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .45s .15s var(--ease) forwards}
.tx .now{animation:fadein .4s var(--ease)}
.tx .today b{animation:popin .4s var(--spring)}
.status.pop{animation:tilepop .45s var(--spring)}
#toast.on .tb svg{stroke-dasharray:70;stroke-dashoffset:70;animation:draw .5s .2s var(--ease) forwards}
.scrim.on .dlg{animation:pop .3s var(--ease)}
.itm.enter{animation:rowin .32s var(--ease)}
.itm.leaving{animation:rowout .22s var(--ease) forwards;pointer-events:none}
.stat.fresh .chip{animation:popin .45s var(--spring)}
.stat.fresh .chip svg{stroke-dasharray:70;stroke-dashoffset:70;animation:draw .45s .15s var(--ease) forwards}
.dhero.fresh .ico{animation:popin .45s var(--spring)}
.dhero.fresh .ico svg{stroke-dasharray:70;stroke-dashoffset:70;animation:draw .5s .1s var(--ease) forwards}
@media (prefers-reduced-motion:reduce){.success .big-ck svg,#toast .tb svg,.dhero .ico svg,.stat .chip svg,.tx .ck svg{stroke-dasharray:none!important;stroke-dashoffset:0!important}}

/* one tag pattern: 32px pill, icon + short label. status = neutral/soft/navy ; attention = light pink */
.tag{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;font-size:14px;font-weight:500;line-height:1;white-space:nowrap;border:1px solid transparent}

@media (prefers-reduced-motion:reduce){.stat .tag svg{stroke-dasharray:none!important;stroke-dashoffset:0!important}}

/* ===== icon micro-animations (transform only, one easing, reduced-motion safe) ===== */
.btn .ic,.ibtn .ic,.back .ic,.cl-u .ic,.cart-t>.ic,.gl .ic,.cl-i .ic{transition:transform 220ms var(--ease);transform-origin:center}
button:active>.ic{transform:scale(.88)!important}
@keyframes icnpop{0%{transform:scale(1)}50%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes icnshake{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(12deg)}}
@keyframes icndrive{0%{transform:translateX(0)}45%{transform:translateX(5px)}100%{transform:translateX(0)}}
@keyframes cartbounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px) rotate(-8deg)}70%{transform:translateY(0) rotate(4deg)}}
[data-ico=check]:is(:hover,:focus-visible)>.ic{animation:icnpop .35s var(--spring)}
[data-ico=card]:is(:hover,:focus-visible)>.ic{transform:rotate(-12deg) translateY(-1px)}
[data-ico=print]:is(:hover,:focus-visible)>.ic{transform:translateY(-3px)}
[data-ico=plus]:is(:hover,:focus-visible)>.ic{transform:rotate(90deg)}
[data-ico=x]:is(:hover,:focus-visible)>.ic{transform:rotate(90deg)}
[data-ico=trash]:is(:hover,:focus-visible)>.ic{animation:icnshake .4s var(--ease)}
[data-ico=undo]:is(:hover,:focus-visible)>.ic{transform:rotate(-180deg)}
[data-ico=bk]:is(:hover,:focus-visible)>.ic{transform:rotate(-30deg) translateX(-2px)}
[data-ico=back]:is(:hover,:focus-visible)>.ic{transform:translateX(4px)}
[data-ico=chev]:is(:hover,:focus-visible)>.ic{transform:translateY(2px)}
[data-ico=truck]:is(:hover,:focus-visible)>.ic{animation:icndrive .4s var(--ease)}
[data-ico=pencil]:is(:hover,:focus-visible)>.ic,[data-ico=scissors]:is(:hover,:focus-visible)>.ic,[data-ico=lock]:is(:hover,:focus-visible)>.ic{transform:rotate(-14deg)}
[data-ico=swap]:is(:hover,:focus-visible)>.ic{transform:rotate(180deg)}
[data-ico=ext]:is(:hover,:focus-visible)>.ic{transform:translate(2px,-2px)}
[data-ico=mail]:is(:hover,:focus-visible)>.ic,[data-ico=bag]:is(:hover,:focus-visible)>.ic{transform:translateY(-3px)}
[data-ico=cart]:is(:hover,:focus-visible)>.ic:first-child{animation:cartbounce .5s var(--spring)}
/* rail tiles */
.gl.sig:is(:hover,:focus-visible) .ic{animation:icnpop .35s var(--spring)}
.gl.del:is(:hover,:focus-visible) .ic{animation:icndrive .4s var(--ease)}

/* ---- toast ---- */
#toast{background:linear-gradient(180deg,#12305a,#0a2242);border:1px solid rgba(255,255,255,.14);border-radius:20px;box-shadow:0 24px 60px -12px rgba(2,10,24,.6),inset 0 1px 0 rgba(255,255,255,.09);padding:16px 16px 18px 56px}

#toast .tclose{top:10px;inset-inline-end:10px;inset-inline-start:auto;width:30px;height:30px;min-height:0;padding:0;border-radius:50%;opacity:1;background:rgba(255,255,255,.14);color:#f7ecc4;border:1px solid rgba(224,197,110,.65);animation:popin .4s var(--spring);transition:background-color 150ms,color 150ms,transform 200ms var(--ease)}

#toast::after{content:"";position:absolute;inset-inline-end:18px;inset-inline-start:18px;bottom:6px;height:3px;border-radius:3px;background:linear-gradient(90deg,#c9a227,#f1dc8f);transform-origin:100% 50%;transform:scaleX(0);opacity:0;pointer-events:none}

@keyframes tdrain{from{transform:scaleX(1)}to{transform:scaleX(0)}}

#toast.out{transition:transform 260ms cubic-bezier(.4,0,1,1),opacity 260ms;transform:translateX(-110%) scale(.96);opacity:0}

  if (n === 4) return active().length ? 'מוכן לבדיקה' : '';

    return `<div class="tx ${st}${fresh ? ' fresh' : ''}" style="--fill:${done ? 1 : 0}" role="button" tabindex="${locked ? -1 : 0}" data-step="${n}" data-rich="wz|${n}" ${cur ? 'aria-current="step"' : ''} ${locked ? 'aria-disabled="true"' : ''} aria-label="שלב ${n}: ${l}${done ? ', הושלם' : ''}${locked ? `, נעול — ${lockReason(n)}` : ''}${!locked && stepValue(n) ? ` — ${esc(stepValue(n))}` : ''}">

        ${W.phoneRes.map(c => custCard(c, { pick:true, primary:W.phoneRes.length === 1 })).join('')}${W.phoneRes.length === 1 ? hokFields() : ''}

      ${fld({ id:'nc-lastName', label:'שם משפחה', val:c.lastName, err:e.lastName, attrs:'data-nc="lastName" autocomplete="off"' })}

      ${fld({ id:'nc-phone2', label:'טלפון נוסף', val:c.phone2, req:groupReq('phone2', c), type:'tel', ltr:true, err:e.phone2, attrs:'data-nc="phone2" inputmode="tel"' })}
      <div class="field${e.email ? ' bad' : ''}"><label class="lbl" for="nc-email">מייל${groupReq('email', c) || cfg.flag('require_customer_email') ? '' : optNote}</label><input class="inp" id="nc-email" type="email" dir="ltr" value="${esc(c.email)}" data-nc="email" autocomplete="off">
        ${c.email && !c.email.includes('@') ? `<div style="margin-top:8px"><button type="button" class="btn sm" data-act="gmail">${ic('mail', 'sm')}השלמה ל-<bdi dir="ltr">@gmail.com</bdi></button></div>` : ''}${e.email ? `<div class="ferr" role="alert">${ic('alert', 'sm')}${e.email}</div>` : ''}</div>

    <div class="fcol" style="margin-top:24px">${dates}<p class="wz-note">${ic('info')}בהדמיה: שדה תאריך רגיל והתאריך העברי מתחתיו. במימוש — בורר הלוח העברי הקיים.</p></div>`);
  let del = '';
  if (hasPhone || hasBranch || hasPickup || hasDel){
    const dirs = [['הלוך','הלוך','arrr'],['חזור','חזור','arrl'],['הלוך-חזור','הלוך וחזור','arrlr']];
    del = card(hasDel ? 'truck' : 'home', 'teal', hasDel ? 'משלוח וסניף' : 'סניף', `<div class="fcol">
      ${hasPhone ? sw('o-phone', 'הזמנה טלפונית', o.isPhoneOrder, 'data-o="isPhoneOrder"', 'הזמנה שהתקבלה בטלפון. מבטל את בחירת סניף הביצוע.') : ''}
      ${hasBranch ? `<div class="field"><label class="lbl" for="o-branch">באיזה סניף ההזמנה${optNote}</label><select class="inp" id="o-branch" data-o="branch" ${o.isPhoneOrder ? 'disabled' : ''}><option value="">בלי סניף</option>${branches.map(b => `<option ${o.branch === b ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select>${!branches.length ? `<div class="fhint">עוד לא הוגדרו סניפים בהגדרות.</div>` : o.isPhoneOrder ? `<div class="fhint">בהזמנה טלפונית אין סניף ביצוע.</div>` : ''}</div>` : ''}
      ${hasPickup ? `<div class="field"><label class="lbl" for="o-pick">מאיזה סניף לוקחים${optNote}</label><select class="inp" id="o-pick" data-o="pickupBranch"><option value="">בלי סניף</option>${branches.map(b => `<option ${o.pickupBranch === b ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select></div>` : ''}
      ${hasDel ? sw('o-del', 'הזמנה עם משלוח', o.isDelivery, 'data-o="isDelivery"') : ''}
      ${hasDel && o.isDelivery ? `
        <div class="field"><span class="lbl" id="dirL">כיוון</span><div class="seg" role="group" aria-labelledby="dirL">${dirs.map(([v, l, i]) => `<button type="button" class="${o.deliveryDirection === v ? 'on' : ''}" aria-pressed="${o.deliveryDirection === v}" data-dir="${v}">${ic(i, 'sm')}${l}</button>`).join('')}</div></div>

          ${de.city ? `<div class="ferr" role="alert">${ic('alert', 'sm')}${de.city}</div>` : o.deliveryCity ? `<div class="fhint">${nis(perDirPrice(o.deliveryCity))} לכל כיוון</div>` : `<div class="fhint">בלי עיר למשלוח לא נוסף חיוב משלוח</div>`}</div>
        ${cfg.flag('delivery_allow_address_override') || addrRequired() ? fld({ id:'o-addr', label:'כתובת למשלוח', val:o.deliveryAddress, req:addrRequired(), err:de.addr, hint:'רחוב ומספר, רק אם שונה מהכתובת של הלקוח', attrs:'data-o="deliveryAddress" autocomplete="off"' }) : ''}

  const altBlock = alts && m ? `<details class="coll" ${W.alt.neck || W.alt.sleeve || W.alt.length ? 'open' : ''}><summary>${ic('scissors')}תיקונים לפריט <span class="faint">(לא חובה)</span>${ic('chev', 'chev')}</summary><div class="in"><div class="fcol">
      ${sw('al-neck', 'תיקון צוואר', W.alt.neck, 'data-alt="neck"')}
      ${sw('al-sleeve', 'תיקון שרוול', W.alt.sleeve, 'data-alt="sleeve"')}
      ${fld({ id:'al-len', label:'קיצור אורך (ס״מ)', val:W.alt.length, req:false, ltr:true, attrs:'data-al="length" inputmode="numeric"' })}
      ${fld({ id:'al-rep', label:'הוראות לתופרת', val:W.alt.repairs, req:false, hint:'אם ריק — נכתב לבד לפי התיקונים שנבחרו', attrs:'data-al="repairs"' })}</div></div></details>` : '';
  const addCard = card('dress', 'rose', 'הוספת שמלה', `<div class="fcol">

      ${sizeField}${altBlock}
      <div class="wz-acts"><button type="button" class="btn primary" data-act="add" ${W.sel.size ? '' : 'disabled aria-describedby="addWhy"'}>${ic('plus', 'sm')}${W.sel.size > 1 ? `הוספת ${W.sel.size} פריטים לסל` : 'הוספה לסל'}</button>${W.sel.size ? '' : `<span class="faint" id="addWhy">בוחרים מידה אחת לפחות</span>`}</div>
      ${!isNaN(max) && max > 0 ? `<p class="wz-note">${active().length >= max ? `<span class="stx warn">${ic('bag')}בסל ${active().length} מתוך ${max} פריטים — הגעתם למקסימום</span>` : `${ic('bag')}בסל ${active().length} מתוך ${max} פריטים אפשריים`}</p>` : ''}
    </div>`, `<button type="button" class="ibtn" data-act="refreshAvail" aria-label="רענון הזמינות">${ic('refresh')}</button>`);

  }
  if (t.closest('.demo')) return demo(t);
  if (t.closest('.snav')) return;
  if (t.classList.contains('cb-o')) return cbChoose(t.dataset.cb, t.dataset.v);
  if (t.dataset.cbt){ return W.cb === t.dataset.cbt ? cbClose(true) : cbOpen(t.dataset.cbt); }
  if (t.dataset.cbclear){ W.cbQ = ''; W.cbAct = 0; const i = document.getElementById('cbq-' + W.cb); if (i){ i.value = ''; i.focus(); } cbRefresh(); return; }
  if (t.dataset.step){ const n = +t.dataset.step; if (!canNav(n) && n !== W.step) return; return goStep(n); }
  if (t.dataset.ctab){ W.custTab = t.dataset.ctab; W.cb = null; if (W.custTab === 'phone') W.phoneRes = null; renderPanel(); if (W.custTab === 'name') cbOpen('name'); else { const b = document.querySelector(`[data-ctab="${W.custTab}"]`); b && b.focus(); } return; }
  if (t.dataset.pick){ const c = [...CUSTOMERS(), ...(Array.isArray(W.phoneRes) ? W.phoneRes : [])].find(x => x.id === t.dataset.pick); return pickCustomer(c); }
  if (t.dataset.abroad != null){ const v = t.dataset.abroad === '1'; if (v === W.order.isAbroad) return; W.order.isAbroad = v; if (v && W.order.fromDate) W.order.eventDate = W.order.fromDate; W.dateErr = ''; render(); $(`[data-abroad="${t.dataset.abroad}"]`).focus(); scheduleDraft(); return; }
  if (t.dataset.dir){ W.order.deliveryDirection = t.dataset.dir; render(); recalc(); $(`[data-dir="${t.dataset.dir}"]`).focus(); return; }
  if (t.dataset.sp !== undefined){ const v = t.dataset.sp === 'null' ? null : +t.dataset.sp; await changeSpacing(v); const b = $(`[data-sp="${t.dataset.sp}"]`); b && b.focus(); return; }
  if (t.dataset.size){ W.sel.has(t.dataset.size) ? W.sel.delete(t.dataset.size) : W.sel.add(t.dataset.size); renderPanel(); $(`[data-size="${t.dataset.size}"]`).focus(); return; }
  if (t.dataset.method){ W.pay.method = t.dataset.method; renderPanel(); const b = document.querySelector(`[data-method="${CSS.escape(t.dataset.method)}"]`); b && b.focus(); return; }
  if (t.dataset.opitem){ const k = t.dataset.opitem; W.openItem[k] = !W.openItem[k]; const row = t.closest('.itm'); row.classList.toggle('open', W.openItem[k]); t.setAttribute('aria-expanded', W.openItem[k]); return; }
  if (t.dataset.rm){ const i = +t.dataset.rm, it = W.cart[i], mm = MODELS.find(x => x.id === it.modelId); const r = await ask({ title:'להוציא מהסל?', sub:`${esc(modelName(mm))}, מידה ${it.size}.`, buttons:[{ label:'הוצאה מהסל', kind:'primary', v:'y', icon:'trash' }, { label:'ביטול', kind:'ghost', v:'n', icon:'back', auto:1 }] }); if (r === 'y'){ W.cart.splice(i, 1); render(); recalc(); scheduleDraft(); toast('info', 'הוצא מהסל', `${esc(modelName(mm))} · מידה ${it.size}`); } return; }
  if (t.dataset.edit){ const i = +t.dataset.edit; const it = W.cart.splice(i, 1)[0]; W.editing = it; W.model = MODELS.find(x => x.id === it.modelId); W.sel = new Set([it.size]); W.alt = { neck:it.neck, sleeve:it.sleeve, length:it.length, repairs:it.repairs }; render(); recalc(); const b = document.querySelector('[data-act="cancelEdit"]'); b && b.focus(); return; }
  if (t.dataset.cap){ return capDlg(W.cart[+t.dataset.cap]); }
  if (t.dataset.goto){ W.fromSummary = false; return goStep(+t.dataset.goto); }
  if (t.dataset.editFromSum){ W.fromSummary = true; W.step = +t.dataset.editFromSum; render(); $('#p-step').focus(); return; }
  if (t.dataset.rmpay){ W.payments.splice(+t.dataset.rmpay, 1); W.pay.amount = remaining(); render(); return; }
  const a = t.dataset.act;
  if (a === 'next') return goStep(W.step + 1);
  if (a === 'prev') return goStep(W.step - 1);
  if (a === 'toSummary'){ W.fromSummary = false; return goStep(4); }
  if (a === 'exit') return exitFlow();
  if (a === 'cart-toggle'){ W.cartOpen = !W.cartOpen; $('#rail').classList.toggle('open', W.cartOpen); t.setAttribute('aria-expanded', W.cartOpen); return; }
  if (a === 'noneOfThese'){ W.nc = { ...blankNew(), phone1:W.phoneQ }; W.phoneRes = 'none'; W.custTab = 'new'; render(); $('#nc-firstName').focus(); return; }
  if (a === 'clearCust'){ W.customer = null; W.custApproved = false; W.custTab = 'phone'; render(); $('#ph-q') && $('#ph-q').focus(); return; }
  if (a === 'editCust') return toast('info', 'כרטיס הלקוח נפתח בלשונית חדשה', 'אחרי העדכון חוזרים לכאן ובוחרים שוב');
  if (a === 'gmail'){ W.nc.email += '@gmail.com'; renderPanel(); $('#nc-email').focus(); return; }
  if (a === 'add') return addItems();
  if (a === 'cancelEdit'){ W.cart.push(W.editing); W.editing = null; W.sel.clear(); render(); recalc(); toast('info', 'העריכה בוטלה', 'הפריט חזר לסל'); return; }
  if (a === 'refreshAvail'){ setTimeout(() => { renderPanel(); toast('info', 'הזמינות רועננה', ''); }, 500); return; }
  if (a === 'credit') return chargeFlow();
  if (a === 'save') return saveOrder();
  if (a === 'openDraft') return toast('info', `טיוטה ${W.draftId} נפתחת בלשונית חדשה`, '');
  if (a === 'restart') return restart();
});
/* combobox: click outside closes (like the sketch's cityCombo) */
document.addEventListener('click', e => { if (W.cb && !(e.target.closest && e.target.closest('.cb'))) cbClose(false); }, true);
document.addEventListener('submit', e => { e.preventDefault(); if (e.target.id === 'phoneForm') checkPhone(); if (e.target.id === 'ncForm') saveNewCustomer(); if (e.target.id === 'payForm') addPayment(); });
document.addEventListener('input', e => {
  const x = e.target;
  if (x.classList && x.classList.contains('ac')){ x.value = x.value.replace(/\D/g, '').slice(-1); const i = +x.dataset.i; if (x.value && i < 3) x.parentElement.children[i + 1].focus(); if (APPR){ APPR.ok = null; $('#appr-mgr').hidden = true; $('#appr-ok').disabled = true; $$('#dlg2 .ac.good').forEach(z => z.classList.remove('good')); } apprCheck(); return; }
  if (x.id && x.id.startsWith('cbq-')){ W.cbQ = x.value; W.cbAct = 0; if (W.cb === 'name'){ W.cbLoading = true; cbRefresh(); clearTimeout(W._nt); W._nt = setTimeout(() => { W.cbLoading = false; cbRefresh(); }, 300); } else cbRefresh(); return; }
  if (x.id === 'ph-q'){ W.phoneQ = x.value; return; }
  if (x.dataset.nc){ if (x.type === 'checkbox') return; W.nc[x.dataset.nc] = x.value; if (W.ncErr[x.dataset.nc]) delete W.ncErr[x.dataset.nc]; if (['phone2','email'].includes(x.dataset.nc)) renderKeep(); return; }
  if (x.dataset.h){ if (x.type !== 'checkbox') W.order.hok[x.dataset.h] = x.value; return; }
  if (x.dataset.al){ W.alt[x.dataset.al] = x.value; return; }
  if (x.dataset.p){ W.pay[x.dataset.p] = x.value; return; }
  if (x.dataset.o === 'notes'){ W.order.notes = x.value; scheduleDraft(); return; }
  if (x.dataset.o === 'deliveryAddress'){ W.order.deliveryAddress = x.value; renderRail(); return; }
});
document.addEventListener('change', async e => {
  const x = e.target;
  if (x.dataset.d){ if (await changeDates(x.dataset.d, x.value)){ renderKeep(); recalc(); scheduleDraft(); } return; }
  if (x.dataset.nc && x.type === 'checkbox'){ W.nc[x.dataset.nc] = x.checked; delete W.ncErr[x.dataset.nc]; renderKeep(); return; }
  if (x.dataset.h && x.type === 'checkbox'){ W.order.hok[x.dataset.h] = x.checked; return; }
  if (x.dataset.alt){ W.alt[x.dataset.alt] = x.checked; return; }
  if (x.dataset.o && x.dataset.o !== 'notes' && x.dataset.o !== 'deliveryAddress'){ const k = x.dataset.o; W.order[k] = x.type === 'checkbox' ? x.checked : x.value; if (k === 'isPhoneOrder' && x.checked) W.order.branch = ''; if (k === 'branch' && x.value){ W.order.isPhoneOrder = false; LAST_BRANCH.v = x.value; } renderKeep(); if (['isDelivery'].includes(k)) recalc(); return; }
});
document.addEventListener('keydown', e => {
  const x = e.target;
  if (e.key === 'Escape'){
    if (D2){ e.preventDefault(); e.stopImmediatePropagation(); return end2(null); }
    if (D1){ if (D1.closable){ e.preventDefault(); e.stopImmediatePropagation(); end1(null); } return; }
    if (W.cb){ e.preventDefault(); return cbClose(true); }
  }
  if (x.classList && x.classList.contains('ac') && e.key === 'Backspace' && !x.value){ const i = +x.dataset.i; if (i > 0) x.parentElement.children[i - 1].focus(); }
  if (x.id && x.id.startsWith('cbq-')){
    if (e.key === 'ArrowDown'){ e.preventDefault(); cbMove(1); } else if (e.key === 'ArrowUp'){ e.preventDefault(); cbMove(-1); }
    else if (e.key === 'Enter'){ e.preventDefault(); const it = cbItems(W.cb); if (it.length) cbChoose(W.cb, it[W.cbAct || 0].v); else if (W.cb === 'model') nbAdd('info', { title:'לא נמצא דגם', detail:`אין דגם בשם או במספר "${esc(W.cbQ)}"`, rows:[['search', 'בודקים את השם או מספר הדגם']] }); }
  }
  if (x.dataset && x.dataset.cbt && !W.cb && (e.key === 'ArrowDown' || e.key === 'ArrowUp')){ e.preventDefault(); cbOpen(x.dataset.cbt); }
  if (x.classList && x.classList.contains('tx') && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); x.click(); }
  if (x.dataset && x.dataset.nc && e.key === 'Enter' && x.type !== 'checkbox'){ e.preventDefault(); const f = [...document.querySelectorAll('#ncForm input:not([type=checkbox])')].filter(y => y.offsetParent); const i = f.indexOf(x); if (f[i + 1]) f[i + 1].focus(); else saveNewCustomer(); }
  /* focus trap for the open layer */
  if (e.key === 'Tab'){ const box = D2 ? $('#dlg2') : D1 ? $('#dlg') : null; if (box){ const f = [...box.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex="0"]')].filter(y => y.offsetParent !== null); if (f.length){ const first = f[0], last = f[f.length - 1]; if (!box.contains(document.activeElement)){ e.preventDefault(); first.focus(); } else if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); } } } }
}, true);
document.addEventListener('paste', e => { const x = e.target; if (x.classList && x.classList.contains('ac')){ e.preventDefault(); const d = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 4); const ins = [...x.parentElement.children]; d.split('').forEach((ch, k) => { if (ins[k]) ins[k].value = ch; }); (ins[Math.min(d.length, 3)] || ins[3]).focus(); apprCheck(); } });

/* ===== בקרת הדגמה ===== */
const DEMO_LBL = { fail:'כשל שרת', noappr:'אין מאשרים', dup:'הזמנה כפולה', stock:'המלאי השתנה', decline:'אשראי נדחה', warn:'שמירה עם אזהרה' };
function syncDemo(){ Object.keys(DEMO_LBL).forEach(k => { const b = document.querySelector(`.demo [data-demo="${k}"]`); if (b){ b.setAttribute('aria-pressed', DEMO[k]); b.textContent = `${DEMO[k] ? '✓ ' : ''}${DEMO_LBL[k]}`; } }); $('#dProfile').textContent = `פרופיל: ${PROFILES[cfg.profile].label} ▾`; }
function applyProfile(p){ cfg.profile = p; cfg.s = { ...PROFILES[p].s }; W.pay.method = ''; syncDemo(); }
function demo(b){
  const k = b.dataset.demo; if (!k) return;
  if (k === 'profile'){ applyProfile(PROFILE_ORDER[(PROFILE_ORDER.indexOf(cfg.profile) + 1) % PROFILE_ORDER.length]); if (W.customer && W.customer.id !== 'new') W.customer = CUSTOMERS().find(c => c.id === W.customer.id) || W.customer; render(); recalc(); toast('info', `פרופיל הגדרות: ${PROFILES[cfg.profile].label}`, PROFILES[cfg.profile].note); return; }
  if (k === 'phones') return toast('info', 'טלפונים לבדיקה (שלב 1)', '0521111111 לקוחה אחת · 0522222222 שתיים · 0523333333 חסומה · 0524444444 חסרים פרטים · אחר = לא נמצא');
  if (k === 'jump'){ W.customer = CUSTOMERS()[0]; W.order.eventDate = isoOf(addDays(TODAY, 21)); W.cart = [{ uid:UID++, modelId:'m1', size:'36', neck:false, sleeve:false, length:'', repairs:'' }, { uid:UID++, modelId:'m2', size:'38', neck:!cfg.off('enable_alterations'), sleeve:false, length:'', repairs:!cfg.off('enable_alterations') ? 'צוואר' : '' }]; W.model = MODELS[0]; W.step = 3; render(); recalc(); scheduleDraft(); return; }
  if (k === 'reset'){ applyProfile(cfg.profile); restart(); return; }
  if (k in DEMO){ DEMO[k] = !DEMO[k]; syncDemo(); }
}

applyProfile('org1'); render();
})();
