<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>לוח חודשי · אב-טיפוס A4</title>
<meta name="description" content="אב-טיפוס סטטי לאישור: ארכיטיפ לוח / ציר זמן (A4) על הלוח החודשי, בשפת סקיצה B. נתוני דמה בלבד.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS — שכבה L0 (גולמי) → L1 (סמנטי). עמודים בהירים בלבד.
   כהה קיים רק על שכבה צפה (data-v3-mode="dark").
   ========================================================= */
:root{
  --v3-navy-900:#0a2242; --v3-navy-800:#0f2c52; --v3-navy-700:#173c6b; --v3-navy-500:#2b5a94;
  --v3-sky-50:#f3f9fe; --v3-sky-100:#e4f1fb; --v3-sky-200:#cfe6f7; --v3-sky-300:#a9d2f0; --v3-sky-400:#7fb8e6;
  --v3-gold-100:#fbf1d3; --v3-gold-300:#e0c56e; --v3-gold-500:#c9a227; --v3-gold-600:#b8912f; --v3-gold-700:#9a7a1f; --v3-gold-800:#6f560f; /* REVIEW-1 M-4: טקסט זהב על רקע בהיר (AA) */
  --v3-rose-50:#fff6f2; --v3-rose-100:#ffece5; --v3-rose-200:#fdd9cc; --v3-rose-300:#fbbfa9; --v3-rose-500:#fa9e84; --v3-rose-700:#a8442a;
  --v3-plum:#a83d6c; --v3-peri:#8fa6e8;

  /* L1 */
  --v3-bg:var(--v3-sky-200); --v3-surface:#fff; --v3-surface-2:var(--v3-sky-50); --v3-surface-3:var(--v3-sky-100);
  --v3-line:var(--v3-sky-300); --v3-line-soft:var(--v3-sky-100); --v3-frame:var(--v3-navy-800); --v3-frame-soft:rgba(15,44,82,.22);
  --v3-ink:var(--v3-navy-900); --v3-ink-2:#2f4a6b; --v3-ink-3:#4d6787; --v3-ink-inverse:#fff;
  --v3-brand:var(--v3-navy-800); --v3-brand-tint:var(--v3-sky-100);
  --v3-accent:linear-gradient(135deg,#d9b84a 0%,#b8912f 100%); --v3-accent-solid:var(--v3-gold-600); --v3-accent-ink:#000;
  --v3-focus-ring:var(--v3-gold-500); --v3-link:var(--v3-navy-500);
  --v3-scrim:rgba(10,34,66,.45); --v3-scrim-strong:rgba(10,34,66,.6);
  --v3-charge-bg:var(--v3-rose-100); --v3-charge-ink:var(--v3-rose-700); --v3-charge-line:var(--v3-rose-300);
  --v3-credit-bg:var(--v3-sky-100); --v3-credit-ink:var(--v3-navy-800); --v3-credit-line:var(--v3-sky-300);
  --v3-done-bg:var(--v3-sky-100); --v3-done-ink:var(--v3-navy-800);
  --v3-pending-bg:var(--v3-rose-50); --v3-pending-line:var(--v3-rose-500);
  --v3-disabled-bg:var(--v3-sky-100); --v3-disabled-ink:var(--v3-ink-3); --v3-disabled-line:var(--v3-sky-200);
  --v3-danger-ink:var(--v3-plum);
  --v3-on-dark:#fff; --v3-on-dark-2:#c9daee; --v3-on-dark-3:#9fb6d2;
  --v3-topbar-bg:var(--v3-navy-900); --v3-tooltip-bg:var(--v3-navy-900); --v3-tooltip-ink:#fff;

  /* טיפוגרפיה */
  --v3-font:"Rubik","Heebo",system-ui,sans-serif;
  --v3-fs-cap:12px; --v3-fs-2xs:13px; --v3-fs-sm:14px; --v3-fs-base:16px; --v3-fs-md:17px; --v3-fs-lg:18px; --v3-fs-xl:20px; --v3-fs-2xl:24px; --v3-fs-h1:28px; --v3-fs-amount:34px;
  /* מרווח / רדיוס / צל */
  --v3-sp-1:4px; --v3-sp-2:8px; --v3-sp-3:12px; --v3-sp-4:16px; --v3-sp-5:24px; --v3-sp-6:32px; --v3-sp-7:40px;
  --v3-r-sm:10px; --v3-r-md:12px; --v3-r-btn:14px; --v3-r-lg:16px; --v3-r-xl:20px; --v3-r-dlg:24px; --v3-r-pill:999px;
  --v3-el-1:0 1px 2px rgba(15,44,82,.06),0 8px 24px -10px rgba(15,44,82,.22);
  --v3-el-3:0 12px 32px -10px rgba(10,34,66,.35);
  --v3-el-4:0 24px 60px -12px rgba(10,34,66,.5);
  /* z-index */
  --v3-z-sticky:10; --v3-z-rail:20; --v3-z-topbar:40; --v3-z-popover:60; --v3-z-drawer:80; --v3-z-layer:100; --v3-z-notice:300; --v3-z-toast:310; --v3-z-tip:400;
  /* תנועה */
  --v3-fast:150ms; --v3-base:220ms; --v3-med:300ms; --v3-enter:450ms;
  --v3-ease:cubic-bezier(.22,1,.36,1); --v3-spring:cubic-bezier(.2,1.3,.3,1);
  --v3-notice-ms:15000ms;
  /* מידות */
  --v3-topbar-h:64px; --v3-w-content:1240px; --v3-tap:44px; --v3-rail-w:340px;
  --v3-fs-h1-cur:var(--v3-fs-h1);
}
@media (max-width:640px){ :root{ --v3-topbar-h:58px; --v3-fs-h1-cur:23px; } }

/* =========== בסיס =========== */
*,*::before,*::after{box-sizing:border-box}
html{scrollbar-gutter:stable;background:var(--v3-bg)}
html[data-v3-lock]{overflow:hidden}
*{scrollbar-width:thin;scrollbar-color:var(--v3-line) transparent}
body{margin:0;font-family:var(--v3-font);font-size:var(--v3-fs-base);line-height:1.6;color:var(--v3-ink);background:var(--v3-bg);min-height:100dvh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--v3-link)}
bdi,.num{unicode-bidi:isolate}
.ltr{direction:ltr;text-align:end}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--v3-navy-800);outline-offset:2px;box-shadow:0 0 0 6px var(--v3-gold-300);border-radius:6px}
[hidden]{display:none!important}

/* =========== אייקונים + אנימציה =========== */
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle}
.ic.sm{width:16px;height:16px}.ic.lg{width:24px;height:24px}.ic.xl{width:32px;height:32px}.ic.xxl{width:48px;height:48px}
@keyframes ia-nudge{0%,100%{transform:none}50%{transform:translateX(-4px)}}
@keyframes ia-nudge-back{0%,100%{transform:none}50%{transform:translateX(4px)}}
@keyframes ia-spin{to{transform:rotate(-360deg)}}
@keyframes ia-pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:none}}
@keyframes ia-wig{0%,100%{transform:none}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes ia-rise{0%,100%{transform:none}50%{transform:translateY(-3px)}}
@keyframes ia-loop{to{transform:rotate(360deg)}}
@keyframes ia-draw{from{stroke-dashoffset:30}}
:is(button,a,[role=tab],summary,.tip):is(:hover,:focus-visible):not(:disabled) .ic[data-a=nudge]{animation:ia-nudge .6s var(--v3-ease)}
:is(button,a,[role=tab],summary,.tip):is(:hover,:focus-visible):not(:disabled) .ic[data-a=back]{animation:ia-nudge-back .6s var(--v3-ease)}
:is(button,a,[role=tab],summary,.tip):is(:hover,:focus-visible):not(:disabled) .ic[data-a=spin]{animation:ia-spin .6s var(--v3-ease)}
:is(button,a,[role=tab],summary,.tip):is(:hover,:focus-visible):not(:disabled) .ic[data-a=pop]{animation:ia-pop .45s var(--v3-spring)}
:is(button,a,[role=tab],summary,.tip):is(:hover,:focus-visible):not(:disabled) .ic[data-a=wig]{animation:ia-wig .5s var(--v3-ease)}
:is(button,a,[role=tab],summary,.tip):is(:hover,:focus-visible):not(:disabled) .ic[data-a=rise]{animation:ia-rise .5s var(--v3-ease)}
.ic[data-a=loop]{animation:ia-loop 1s linear infinite}
.ic.draw{stroke-dasharray:30;animation:ia-draw .5s var(--v3-ease)}
.ic.enter{animation:ia-pop .45s var(--v3-spring)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
html[data-motion=reduced] *,html[data-motion=reduced] *::before,html[data-motion=reduced] *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}

/* =========== כפתורים =========== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--v3-tap);padding:10px 18px;border-radius:var(--v3-r-btn);border:1.5px solid var(--v3-rose-500);background:var(--v3-rose-200);color:#000;font-weight:500;white-space:nowrap;transition:background-color var(--v3-fast),color var(--v3-fast),border-color var(--v3-fast),transform var(--v3-fast)}
.btn:hover{background:var(--v3-navy-800);border-color:var(--v3-navy-800);color:#fff;transform:translateY(-1px)}
.btn.primary{background:var(--v3-accent);border-color:var(--v3-gold-700);color:var(--v3-accent-ink);font-weight:600;box-shadow:0 6px 16px -8px rgba(15,44,82,.6)}
.btn.primary:hover{background:var(--v3-navy-800);color:#fff}
.btn.quiet{background:transparent;border-color:var(--v3-frame-soft)}
.btn.quiet:hover{background:var(--v3-navy-800);color:#fff}
.btn.lg{min-height:52px;padding:12px 24px;font-size:var(--v3-fs-md);border-radius:var(--v3-r-lg)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:var(--v3-fs-sm);border-radius:var(--v3-r-sm)}
.btn.block{width:100%}
.btn:disabled,.btn:disabled:hover{background:var(--v3-disabled-bg);color:var(--v3-disabled-ink);border-color:var(--v3-disabled-line);box-shadow:none;transform:none;cursor:not-allowed}
.btn.is-busy .ic{animation:ia-loop 1s linear infinite}
.ibtn{width:var(--v3-tap);height:var(--v3-tap);display:inline-grid;place-items:center;border-radius:var(--v3-r-btn);border:1.5px solid var(--v3-rose-500);background:var(--v3-rose-200);color:#000;flex:none;transition:background-color var(--v3-fast),color var(--v3-fast)}
.ibtn:hover{background:var(--v3-navy-800);color:#fff;border-color:var(--v3-navy-800)}
.ibtn.quiet{background:transparent;border-color:transparent;color:var(--v3-ink-2)}
.ibtn.quiet:hover{background:var(--v3-surface-3);color:var(--v3-ink)}
.ibtn.round{border-radius:50%;width:48px;height:48px;background:var(--v3-surface);border:1px solid var(--v3-line);box-shadow:var(--v3-el-1)}
.ibtn.round:hover{background:var(--v3-navy-800);color:#fff}
.tip{width:var(--v3-tap);height:var(--v3-tap);margin:-10px;display:inline-grid;place-items:center;border:0;background:none;color:var(--v3-ink-3);border-radius:50%;flex:none}
.tip:hover,.tip:focus-visible{color:var(--v3-navy-800)}

/* =========== סרגל עליון =========== */
.topbar{position:sticky;top:0;z-index:var(--v3-z-topbar);height:var(--v3-topbar-h);background:var(--v3-topbar-bg);color:var(--v3-on-dark);display:flex;align-items:center;gap:var(--v3-sp-3);padding:0 var(--v3-sp-5);padding-top:env(safe-area-inset-top);border-bottom:3px solid var(--v3-gold-500)}
.tb-brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;flex:none}
.tb-mark{width:40px;height:40px;border-radius:12px;background:var(--v3-accent);color:#000;display:grid;place-items:center}
.tb-name{font-weight:700;font-size:var(--v3-fs-lg)}
.tb-org{font-size:var(--v3-fs-2xs);color:var(--v3-on-dark-2);border:1px solid rgba(255,255,255,.2);border-radius:var(--v3-r-pill);padding:1px 10px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-nav{display:flex;gap:4px;flex:1;min-width:0;justify-content:center}
.tb-nav a{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:12px;color:var(--v3-on-dark-2);text-decoration:none;font-weight:500;white-space:nowrap}
.tb-nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.tb-nav a[aria-current=page]{background:rgba(255,255,255,.12);color:var(--v3-gold-300);box-shadow:inset 0 -3px 0 var(--v3-gold-500)}
.tb-act{display:flex;align-items:center;gap:6px;flex:none;margin-inline-start:auto}
.tb-ib{width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:#fff;display:grid;place-items:center;position:relative}
.tb-ib:hover{background:rgba(255,255,255,.1)}
.tb-badge{position:absolute;inset-block-start:4px;inset-inline-end:4px;min-width:18px;height:18px;border-radius:9px;background:var(--v3-rose-500);color:#000;font-size:var(--v3-fs-cap);font-weight:700;display:grid;place-items:center;padding:0 4px}
.tb-user{display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 12px;border-radius:22px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff}
.tb-av{width:32px;height:32px;border-radius:50%;background:var(--v3-accent);color:#000;display:grid;place-items:center;font-weight:700}
.tb-burger{display:none}
.drawer{position:fixed;inset-block:0;inset-inline-start:0;width:min(88vw,360px);background:var(--v3-navy-900);color:#fff;z-index:var(--v3-z-drawer);padding:var(--v3-sp-4);padding-top:calc(env(safe-area-inset-top) + 16px);display:flex;flex-direction:column;gap:6px;box-shadow:var(--v3-el-4);animation:dr-in var(--v3-med) var(--v3-ease)}
@keyframes dr-in{from{transform:translateX(100%)}}
.drawer a{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 14px;border-radius:12px;color:var(--v3-on-dark-2);text-decoration:none}
.drawer a[aria-current=page]{background:rgba(255,255,255,.1);color:var(--v3-gold-300)}
.drawer-scrim{position:fixed;inset:0;background:var(--v3-scrim);z-index:calc(var(--v3-z-drawer) - 1)}
@media (max-width:1439px){.tb-org{display:none}} /* REVIEW-1 m-3 */
@media (max-width:1023px){
  .tb-nav{display:none}
  .tb-burger{display:grid}
  .tb-uname{display:none}
}
@media (max-width:640px){
  .topbar{padding:0 var(--v3-sp-3);gap:var(--v3-sp-2)}
  .tb-org{display:none}
  .tb-name{font-size:var(--v3-fs-base)}
  .tb-user{padding:0 4px;border:0}
}

/* =========== בקרת הדגמה =========== */
.demo{max-width:var(--v3-w-content);margin:var(--v3-sp-3) auto 0;padding:0 var(--v3-sp-5)}
.demo details{background:var(--v3-surface);border:1.5px dashed var(--v3-gold-600);border-radius:var(--v3-r-lg)}
.demo summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:48px}
.demo summary::-webkit-details-marker{display:none}
.demo summary small{font-weight:400;color:var(--v3-ink-3)}
.demo summary .chev{margin-inline-start:auto;transition:transform var(--v3-base)}
.demo details[open] summary .chev{transform:rotate(180deg)}
.demo-body{padding:0 16px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:var(--v3-sp-4)}
.demo-grp{display:flex;flex-direction:column;gap:8px;min-width:0}
.demo-grp h3{margin:0;font-size:var(--v3-fs-sm);color:var(--v3-ink-3);font-weight:600}
.demo-row{display:flex;flex-wrap:wrap;gap:6px}
.demo select{min-height:40px;border:1.5px solid var(--v3-line);border-radius:var(--v3-r-sm);padding:0 10px;background:#fff;max-width:100%}
.chk{display:flex;align-items:center;gap:8px;font-size:var(--v3-fs-sm);min-height:32px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--v3-navy-800)}

/* =========== הודעות עליונות (NoticeBar) =========== */
.notice-area{position:sticky;top:var(--v3-topbar-h);z-index:var(--v3-z-notice);max-width:var(--v3-w-content);margin:0 auto;padding:0 var(--v3-sp-5)}
.notice-area:empty{display:none}
.notice{position:relative;margin-top:var(--v3-sp-2);background:var(--v3-navy-800);color:#fff;border-radius:var(--v3-r-lg);box-shadow:var(--v3-el-4);overflow:hidden;animation:nb-in var(--v3-med) var(--v3-ease)}
@keyframes nb-in{from{transform:translateY(-14px)}}
.notice.is-leaving{opacity:0;transform:translateY(-10px);transition:opacity 200ms,transform 200ms}
.nb-main{display:flex;align-items:center;gap:14px;padding:12px 16px}
.nb-ic{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--v3-sky-100);color:var(--v3-navy-800);border:2px solid var(--v3-gold-300)}
.nb-msg{flex:1;min-width:0;display:flex;flex-direction:column}
.nb-msg b{font-weight:700}
.nb-msg span{font-size:var(--v3-fs-sm);color:var(--v3-on-dark-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-acts{display:flex;gap:6px;flex:none}
.nb-acts .btn{min-height:40px;padding:6px 14px;font-size:var(--v3-fs-sm)}
.nb-x{width:40px;height:40px;border-radius:10px;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}
.nb-x:hover{background:rgba(255,255,255,.24)}
.nb-timer{height:4px;background:var(--v3-accent);transform-origin:right center;animation:nb-t var(--v3-notice-ms) linear forwards}
.notice:is(:hover,:focus-within) .nb-timer{animation-play-state:paused}
@keyframes nb-t{from{transform:scaleX(1)}to{transform:scaleX(0)}}
html[data-motion=reduced] .nb-timer{animation-duration:var(--v3-notice-ms)!important}
@media (prefers-reduced-motion:reduce){.nb-timer{animation-duration:var(--v3-notice-ms)!important}}
@media (max-width:640px){.notice-area{padding:0 var(--v3-sp-3)}.nb-acts .btn{display:none}}

/* =========== מעטפת עמוד =========== */
.page{max-width:var(--v3-w-content);margin:0 auto;padding:var(--v3-sp-5) var(--v3-sp-5) calc(var(--v3-sp-7) + 80px)}
@media (max-width:640px){.page{padding:var(--v3-sp-4) var(--v3-sp-4) calc(var(--v3-sp-7) + 96px)}}
.pagehead{display:flex;align-items:center;gap:var(--v3-sp-4);margin-bottom:var(--v3-sp-5);flex-wrap:wrap}
.ph-av{width:60px;height:60px;border-radius:18px;background:var(--v3-navy-800);color:#fff;display:grid;place-items:center;font-size:var(--v3-fs-2xl);font-weight:700;flex:none;border:2px solid var(--v3-gold-500)}
.ph-ttl{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ph-kind{font-size:var(--v3-fs-sm);color:var(--v3-ink-3);font-weight:500}
.ph-ttl h1{margin:0;font-size:var(--v3-fs-h1-cur);line-height:1.25;font-weight:700;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ph-chips{display:flex;flex-wrap:wrap;gap:6px}
.ph-tools{display:flex;gap:8px;flex:none;align-self:flex-start}
.ph-chips .chip{white-space:normal;text-align:start}
@media (max-width:640px){.ph-av{width:48px;height:48px;font-size:var(--v3-fs-lg)}.pagehead{gap:var(--v3-sp-3)}.ph-ttl{flex-basis:100%;order:0}.ph-tools{width:100%}.ph-tools .btn{flex:1}}

.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:2px 12px;border-radius:var(--v3-r-pill);font-size:var(--v3-fs-2xs);font-weight:500;background:var(--v3-surface-3);color:var(--v3-ink-2);border:1px solid var(--v3-line);white-space:nowrap;max-width:100%}
.chip .ic{width:14px;height:14px}
.chip.info{background:var(--v3-brand-tint);color:var(--v3-navy-800)}
.chip.done{background:var(--v3-navy-800);color:#fff;border-color:var(--v3-navy-800)}
.chip.gold{background:var(--v3-gold-100);color:var(--v3-gold-800);border-color:var(--v3-gold-300)}
.chip.attn{background:var(--v3-rose-100);color:var(--v3-rose-700);border-color:var(--v3-rose-300)}
.chip.pend{background:var(--v3-pending-bg);border:1.5px dashed var(--v3-pending-line);color:var(--v3-rose-700)}

/* =========== פריסת A2: תוכן + רייל =========== */
.layout{display:grid;grid-template-columns:minmax(0,1fr) var(--v3-rail-w);gap:var(--v3-sp-5);align-items:start}
@media (max-width:1023px){.layout{grid-template-columns:minmax(0,1fr)}}

/* לשוניות */
.tabs{display:flex;gap:6px;background:var(--v3-sky-100);padding:6px;border-radius:var(--v3-r-xl);overflow-x:auto;scrollbar-width:none;border:1px solid var(--v3-line);margin-bottom:var(--v3-sp-4)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:max-content;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 16px;border:0;background:transparent;border-radius:15px;font-weight:500;color:var(--v3-ink-2);white-space:nowrap;position:relative}
.tab:hover{color:var(--v3-ink);background:rgba(255,255,255,.5)}
.tab[aria-selected=true]{background:var(--v3-surface);color:var(--v3-brand);font-weight:600;box-shadow:0 2px 8px rgba(15,44,82,.14),inset 0 -3px 0 var(--v3-gold-500)}
.tab .cnt{background:var(--v3-sky-300);color:var(--v3-ink-2);border-radius:var(--v3-r-pill);min-width:24px;height:24px;padding:0 7px;font-size:var(--v3-fs-sm);display:grid;place-items:center}
.tab[aria-selected=true] .cnt{background:var(--v3-brand-tint);color:var(--v3-brand)}
.tab .pip{width:10px;height:10px;border-radius:50%;background:var(--v3-rose-500);border:1.5px solid var(--v3-rose-700)}
.tab .pend{width:12px;height:12px;border-radius:50%;background:var(--v3-rose-200);border:2px dashed var(--v3-rose-700)}
@media (max-width:1439px){.tab{padding:8px 10px;gap:6px}:root{--v3-rail-w:300px}}
@media (max-width:640px){.tab{flex:none;padding:8px 12px}}
.file-pick{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.file-pick input{position:absolute;width:1px;height:1px;opacity:0}
.file-pick input:focus-visible + label{outline:3px solid var(--v3-navy-800);outline-offset:2px}

.panel{display:flex;flex-direction:column;gap:var(--v3-sp-4)}
.panel[hidden]{display:none}
.panel{animation:fade-up var(--v3-med) var(--v3-ease)}
@keyframes fade-up{from{transform:translateY(8px)}}

/* כרטיס */
.card{background:var(--v3-surface);border:1px solid var(--v3-frame-soft);border-radius:var(--v3-r-lg);box-shadow:var(--v3-el-1);padding:var(--v3-sp-5)}
.card.strong{border:2px solid var(--v3-frame)}
@media (max-width:640px){.card{padding:var(--v3-sp-4)}}
.card-h{display:flex;align-items:center;gap:12px;margin-bottom:var(--v3-sp-4)}
.card-h .ico{width:44px;height:44px;border-radius:14px;background:var(--v3-rose-100);color:var(--v3-rose-700);display:grid;place-items:center;flex:none;border:1px solid var(--v3-rose-300)}
.card-h h2{margin:0;font-size:var(--v3-fs-lg);font-weight:600;flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-h .acts{display:flex;gap:8px;flex:none}
.card-h h2 small{font-size:var(--v3-fs-sm);color:var(--v3-ink-3);font-weight:400}

/* שורות נתון: תווית מעל, ערך מתחת */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 12px;padding:14px 0;border-top:1px solid var(--v3-line-soft)}
.row:first-child{border-top:0;padding-top:0}
.row>.ic{margin-top:4px;color:var(--v3-ink-3)}
.row .lbl{font-size:var(--v3-fs-sm);color:var(--v3-ink-3);display:flex;align-items:center;gap:6px}
.row .val{grid-column:2;font-size:var(--v3-fs-md);font-weight:500;overflow-wrap:anywhere}
.row .val.missing{color:var(--v3-gold-800);display:flex;align-items:center;gap:6px;font-weight:500;font-size:var(--v3-fs-base)}
.row .val.missing .ic{color:var(--v3-gold-600)}
.row .sub{grid-column:2;display:flex;flex-wrap:wrap;gap:6px}
.row.changed{background:var(--v3-pending-bg);border:1.5px dashed var(--v3-pending-line);border-radius:var(--v3-r-md);padding:12px;margin-block:4px}
.row.changed + .row{border-top:0}
.row .val .was{display:block;font-size:var(--v3-fs-sm);color:var(--v3-ink-3);font-weight:400;text-decoration:line-through}

/* שדות */
.form{display:flex;flex-direction:column;gap:var(--v3-sp-4)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:var(--v3-sp-4)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field .flbl{font-size:var(--v3-fs-sm);color:var(--v3-ink-2);font-weight:500;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.req{color:var(--v3-plum);font-weight:700}
.opt-note{color:var(--v3-ink-3);font-weight:400}
.input{min-height:48px;border:1.5px solid var(--v3-line);border-radius:var(--v3-r-md);padding:10px 14px;background:var(--v3-surface);font-size:var(--v3-fs-md);width:100%;transition:border-color var(--v3-fast)}
.input:hover{border-color:var(--v3-sky-400)}
.input:focus{outline:none;border-color:var(--v3-navy-800);box-shadow:0 0 0 4px var(--v3-gold-300)}
textarea.input{min-height:110px;resize:vertical;line-height:1.6}
.field.is-changed .input{border-style:dashed;border-color:var(--v3-pending-line);background:var(--v3-pending-bg)}
.field.is-err .input{border-color:var(--v3-gold-600);border-width:2px}
.ferr{color:var(--v3-plum);font-size:var(--v3-fs-sm);display:flex;align-items:center;gap:6px}
.fhint{color:var(--v3-ink-3);font-size:var(--v3-fs-sm)}
.inline-acts{display:flex;flex-wrap:wrap;gap:6px}
.switch{display:flex;align-items:center;gap:12px;min-height:48px;cursor:pointer}
.switch input{appearance:none;width:52px;height:30px;border-radius:15px;background:var(--v3-sky-300);position:relative;flex:none;border:1.5px solid var(--v3-navy-500);cursor:pointer;transition:background-color var(--v3-fast)}
.switch input::after{content:"";position:absolute;inset-block-start:3px;inset-inline-start:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform var(--v3-base) var(--v3-ease)}
.switch input:checked{background:var(--v3-navy-800)}
.switch input:checked::after{transform:translateX(-22px)}
.switch.is-changed{background:var(--v3-pending-bg);border:1.5px dashed var(--v3-pending-line);border-radius:var(--v3-r-md);padding:0 12px}

/* באנר */
.banner{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--v3-r-lg);border:2px solid var(--v3-gold-600);background:var(--v3-gold-100);flex-wrap:wrap}
.banner .b-ic{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--v3-plum);display:grid;place-items:center;border:2px solid var(--v3-gold-500);flex:none}
.banner .b-t{flex:1;min-width:180px;display:flex;flex-direction:column}
.banner .b-t b{font-size:var(--v3-fs-md)}
.banner .b-t span{color:var(--v3-ink-2);font-size:var(--v3-fs-sm);overflow-wrap:anywhere}

/* הערות אוטומטיות */
.note-line{padding:10px 0;border-top:1px solid var(--v3-line-soft);display:flex;flex-direction:column;gap:6px}
.note-line:first-child{border-top:0;padding-top:0}
.note-line .nl-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.note-line a{display:inline-flex;align-items:center;gap:4px;font-weight:500;text-decoration:none;min-height:32px}
.note-line a:hover{text-decoration:underline}

/* רשימת הזמנות (שורה מורחבת) */
.list{display:flex;flex-direction:column;gap:10px}
.item{border:1.5px solid var(--v3-line);border-radius:var(--v3-r-lg);background:var(--v3-surface);overflow:hidden}
.item.is-open{border-color:var(--v3-navy-500)}
.it-top{display:grid;grid-template-columns:44px minmax(0,1fr) auto 44px;align-items:center;gap:12px;padding:10px 12px;cursor:pointer}
.it-top:hover{background:var(--v3-surface-2)}
.it-thumb{width:44px;height:44px;border-radius:12px;background:var(--v3-sky-100);display:grid;place-items:center;color:var(--v3-navy-800)}
.it-info{display:flex;flex-direction:column;min-width:0}
.it-info a{font-weight:600;font-size:var(--v3-fs-md);text-decoration:none;color:var(--v3-ink);display:inline-flex;align-items:center;gap:6px;min-height:32px}
.it-info a:hover{color:var(--v3-link);text-decoration:underline}
.it-meta{font-size:var(--v3-fs-sm);color:var(--v3-ink-3)}
.it-chev{width:44px;height:44px;border-radius:12px;border:1px solid var(--v3-line);background:var(--v3-surface);display:grid;place-items:center}
.it-chev .ic{transition:transform var(--v3-base) var(--v3-ease)}
.item.is-open .it-chev .ic{transform:rotate(180deg)}
.it-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--v3-med) var(--v3-ease)}
.item.is-open .it-wrap{grid-template-rows:1fr}
.it-det{overflow:hidden}
.it-det-in{padding:4px 16px 16px;border-top:1px dashed var(--v3-line)}
.item:not(.is-open) .it-det{visibility:hidden}
@media (max-width:480px){.it-top{grid-template-columns:minmax(0,1fr) 44px}.it-thumb{display:none}.it-top .chip{grid-column:1;justify-self:start;grid-row:2}}
.foot{font-size:var(--v3-fs-sm);color:var(--v3-ink-3);padding-top:4px}

/* טבלה מינימלית + הרחבה */
.tbl-wrap{overflow-x:auto;border:1px solid var(--v3-line);border-radius:var(--v3-r-lg)}
table.tbl{width:100%;border-collapse:collapse;min-width:420px}
.tbl th{font-size:var(--v3-fs-sm);color:var(--v3-ink-3);font-weight:500;text-align:start;padding:10px 14px;background:var(--v3-surface-2);border-bottom:1px solid var(--v3-line)}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--v3-line-soft);font-size:var(--v3-fs-base);vertical-align:middle}
.tbl .n{text-align:end;white-space:nowrap}
.tbl th.x,.tbl td.x{width:56px;text-align:center;padding-inline:6px}
.tbl tr.exp td{background:var(--v3-surface-2);padding:6px 18px 14px}
.tbl tr.is-open>td{border-bottom-color:transparent}
.tbl .neg{color:var(--v3-credit-ink)}

/* סיכום כספי / אריחים */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:var(--v3-sp-3)}
.tile{border:1px solid var(--v3-line);border-radius:var(--v3-r-lg);padding:14px 16px;display:flex;flex-direction:column;gap:2px;background:var(--v3-surface-2);min-width:0}
.tile .t-l{font-size:var(--v3-fs-sm);color:var(--v3-ink-3);display:flex;align-items:center;gap:6px}
.tile .t-v{font-size:var(--v3-fs-2xl);font-weight:700;overflow-wrap:anywhere}
.tile.debt{background:var(--v3-charge-bg);border:2px solid var(--v3-charge-line)}
.tile.debt .t-v{color:var(--v3-charge-ink)}
.tile.credit{background:var(--v3-credit-bg);border:2px solid var(--v3-credit-line)}
.tile.even{background:var(--v3-done-bg);border:2px solid var(--v3-navy-500)}
.formula{font-size:var(--v3-fs-sm);color:var(--v3-ink-3);display:flex;align-items:center;gap:4px;margin-top:var(--v3-sp-3)}

/* פיד היסטוריה */
.hfilter{display:flex;gap:8px;flex-wrap:wrap}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;min-height:48px;border:1.5px solid var(--v3-line);border-radius:var(--v3-r-md);padding:0 12px;background:#fff}
.search:focus-within{border-color:var(--v3-navy-800);box-shadow:0 0 0 4px var(--v3-gold-300)}
.search input{border:0;outline:0;flex:1;min-width:0;font-size:var(--v3-fs-md);background:transparent}
.hday{position:sticky;top:calc(var(--v3-topbar-h) + 4px);z-index:1;background:var(--v3-surface);padding:8px 0;font-weight:600;display:flex;gap:8px;align-items:baseline;border-bottom:2px solid var(--v3-gold-500);margin-top:var(--v3-sp-4)}
.hday small{color:var(--v3-ink-3);font-weight:400}
.hent{border-bottom:1px solid var(--v3-line-soft)}
.he-top{display:grid;grid-template-columns:40px minmax(0,1fr) auto 44px;gap:12px;align-items:center;padding:10px 0;width:100%;border:0;background:none;text-align:start;cursor:pointer}
.he-top:hover{background:var(--v3-surface-2)}
.he-ic{width:40px;height:40px;border-radius:50%;background:var(--v3-sky-100);display:grid;place-items:center;color:var(--v3-navy-800);border:1.5px solid var(--v3-peri)}
.he-t{display:flex;flex-direction:column;min-width:0}
.he-t b{font-weight:500;font-size:var(--v3-fs-md);overflow-wrap:anywhere}
.he-t span{font-size:var(--v3-fs-sm);color:var(--v3-ink-3)}
.he-chev{display:grid;place-items:center;width:44px;height:44px}
.he-chev .ic{transition:transform var(--v3-base)}
.hent.is-open .he-chev .ic{transform:rotate(180deg)}
.he-det{padding-block:0 14px;padding-inline:52px 0}
.he-det .row{padding:8px 0}
.range{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.range .from{color:var(--v3-ink-3);text-decoration:line-through;font-weight:400}
.range .ic{color:var(--v3-gold-700)}
.hnote{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--v3-r-md);background:var(--v3-surface-2);border:1px dashed var(--v3-line);font-size:var(--v3-fs-sm);color:var(--v3-ink-2)}
mark{background:var(--v3-gold-100);color:inherit;border-radius:3px;padding:0 2px}

/* מצב ריק / טעינה / שגיאה */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:var(--v3-sp-7) var(--v3-sp-4);color:var(--v3-ink-2)}
.empty .e-ic{width:72px;height:72px;border-radius:50%;background:var(--v3-sky-100);display:grid;place-items:center;color:var(--v3-navy-800);border:2px solid var(--v3-gold-300)}
.empty b{font-size:var(--v3-fs-lg);color:var(--v3-ink)}
.sk{background:linear-gradient(90deg,var(--v3-sky-100) 0%,var(--v3-sky-50) 50%,var(--v3-sky-100) 100%);background-size:200% 100%;border-radius:10px;animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

/* =========== רייל (צד שמאל ב-RTL) =========== */
.rail{position:sticky;top:calc(var(--v3-topbar-h) + 16px);max-height:calc(100dvh - var(--v3-topbar-h) - 32px);overflow-y:auto;display:flex;flex-direction:column;gap:var(--v3-sp-4);background:var(--v3-navy-800);color:#fff;border-radius:var(--v3-r-xl);padding:var(--v3-sp-5);box-shadow:var(--v3-el-3);z-index:var(--v3-z-rail)}
.rail h2{margin:0;font-size:var(--v3-fs-lg);display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:3px solid var(--v3-gold-500)}
.rail h2 .cnt{margin-inline-start:auto;min-width:28px;height:28px;border-radius:14px;background:var(--v3-rose-500);color:#000;font-size:var(--v3-fs-sm);display:grid;place-items:center;padding:0 8px}
.rail h2 .cnt.zero{background:rgba(255,255,255,.15);color:#fff}
.rail .tip{color:var(--v3-on-dark-3)}
.rail .tip:hover{color:#fff}
.glance{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gl{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.gl .t-l{font-size:var(--v3-fs-2xs);color:var(--v3-on-dark-2);display:flex;align-items:center;gap:6px}
.gl .t-v{font-size:var(--v3-fs-lg);font-weight:700;overflow-wrap:anywhere}
.gl.wide{grid-column:1/-1}
.gl.debt{border:1.5px solid var(--v3-gold-300);background:rgba(224,197,110,.14)}
.gl.debt .t-v{color:var(--v3-gold-300)}
.gl.block{border:1.5px dashed var(--v3-rose-300)}
.chg-list{display:flex;flex-direction:column;gap:8px}
.chg{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border-radius:14px;background:rgba(255,255,255,.08);border:1.5px dashed var(--v3-rose-300);animation:row-in var(--v3-med) var(--v3-ease)}
@keyframes row-in{from{transform:translateX(8px)}}
.chg .c-ic{width:32px;height:32px;border-radius:10px;background:var(--v3-rose-200);color:#000;display:grid;place-items:center}
.chg .c-t{display:flex;flex-direction:column;min-width:0;font-size:var(--v3-fs-sm)}
.chg .c-t b{font-size:var(--v3-fs-base);font-weight:600}
.chg .c-t .range{color:var(--v3-on-dark-2)}
.chg .c-t .range .from{color:var(--v3-on-dark-3)}
.chg .c-t .range .ic{color:var(--v3-gold-300)}
.chg .c-t .range bdi{overflow-wrap:anywhere}
.chg.undone{border-style:solid;border-color:rgba(255,255,255,.14);background:transparent;opacity:.85}
.chg.undone .c-ic{background:rgba(255,255,255,.14);color:#fff}
.chg.undone .c-t b{text-decoration:line-through;text-decoration-color:var(--v3-on-dark-3)}
.chg .c-btn{width:44px;height:44px;border-radius:12px;border:1.5px solid rgba(255,255,255,.3);background:transparent;color:#fff;display:grid;place-items:center}
.chg .c-btn:hover{background:#fff;color:var(--v3-navy-800)}
.rail-empty{display:flex;align-items:center;gap:10px;color:var(--v3-on-dark-2);font-size:var(--v3-fs-sm);padding:6px 0}
.rail-sub{font-size:var(--v3-fs-sm);color:var(--v3-on-dark-2);margin:4px 0 0;display:flex;align-items:center;gap:6px}
.rail .btn.quiet{color:#fff;border-color:rgba(255,255,255,.35)}
.rail .btn.quiet:hover{background:#fff;color:var(--v3-navy-800)}
.rail .btn:disabled{background:rgba(255,255,255,.08);color:var(--v3-on-dark-3);border-color:rgba(255,255,255,.14)}
.rail-cta{display:flex;flex-direction:column;gap:8px;position:sticky;bottom:calc(-1 * var(--v3-sp-5));background:var(--v3-navy-800);padding:10px 0 4px;margin-bottom:-4px}
.rail-sheet-h{display:none}
.glance-inline{display:none}
/* רייל בטלפון/טאבלט = פס תחתון + גיליון תחתון */
.railbar{display:none}
@media (max-width:1023px){
  .glance-inline{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;margin-bottom:var(--v3-sp-4)}
  .glance-inline .gl{background:var(--v3-surface);border:1px solid var(--v3-line);color:var(--v3-ink)}
  .glance-inline .gl .t-l{color:var(--v3-ink-3)}
  .glance-inline .gl.debt{background:var(--v3-charge-bg);border:2px solid var(--v3-charge-line)}
  .glance-inline .gl.debt .t-v{color:var(--v3-charge-ink)}
  .glance-inline .gl.block{display:none}
  .rail{display:none}
  @media (max-width:640px){.glance-inline{grid-template-columns:1fr 1fr}.glance-inline .gl{padding:8px 12px}.glance-inline .gl .t-v{font-size:var(--v3-fs-md)}}
  .rail.as-sheet{box-shadow:0 0 0 100vmax var(--v3-scrim);display:flex;position:fixed;inset-inline:0;inset-block-end:0;top:auto;max-height:85dvh;border-radius:var(--v3-r-dlg) var(--v3-r-dlg) 0 0;z-index:calc(var(--v3-z-layer) + 1);padding-bottom:calc(var(--v3-sp-5) + env(safe-area-inset-bottom));animation:sheet-up var(--v3-med) var(--v3-ease)}
  .rail .rail-glance{display:none}
  .rail-sheet-h{display:flex;flex-direction:column;align-items:center;gap:6px}
  .rail-sheet-h .grab{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.35)}
  .railbar{display:flex;position:fixed;inset-inline:0;inset-block-end:0;z-index:var(--v3-z-sticky);background:var(--v3-navy-800);color:#fff;padding:10px var(--v3-sp-4);padding-bottom:calc(10px + env(safe-area-inset-bottom));gap:10px;align-items:center;border-top:3px solid var(--v3-gold-500)}
  .railbar .rb-open{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:48px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);border-radius:14px;color:#fff;padding:0 12px;text-align:start}

}
@keyframes sheet-up{from{transform:translateY(40px)}}

/* =========== שכבות (LayerManager) =========== */
#layer-root{position:relative;z-index:var(--v3-z-layer)}
.scrim{position:fixed;inset:0;background:var(--v3-scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade var(--v3-base)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.scrim{background:var(--v3-scrim-strong)}}
@media (prefers-reduced-transparency:reduce){.scrim{backdrop-filter:none;background:var(--v3-scrim-strong)}}
@keyframes fade{from{background:transparent}}
.scrim.is-leaving{opacity:0;transition:opacity 200ms}
.dlg{--d-bg:#fff;--d-ink:var(--v3-ink);--d-sub:var(--v3-ink-2);--d-line:var(--v3-line);--d-row:var(--v3-surface-2);--d-ic-bg:var(--v3-sky-100);--d-ic:var(--v3-navy-800);
  background:var(--d-bg);color:var(--d-ink);border-radius:var(--v3-r-dlg);box-shadow:var(--v3-el-4);width:100%;max-width:min(100vw - 32px,var(--dw,520px));max-height:90dvh;display:flex;flex-direction:column;overflow:hidden;animation:dlg-in var(--v3-base) var(--v3-ease)}
@keyframes dlg-in{from{transform:scale(.96)}}
.dlg[data-v3-mode=dark]{--d-bg:#0d2a4f;--d-ink:#fff;--d-sub:#cfe0f2;--d-line:rgba(255,255,255,.16);--d-row:rgba(169,210,240,.12);--d-ic-bg:rgba(224,197,110,.16);--d-ic:#f1dc8f;border:1px solid rgba(255,255,255,.14)}
.dlg.s{--dw:400px}.dlg.m{--dw:520px}.dlg.l{--dw:760px}
.dlg-h{padding:24px 24px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.dlg-badge{width:64px;height:64px;border-radius:50%;background:var(--d-ic-bg);color:var(--d-ic);display:grid;place-items:center;border:2px solid var(--v3-gold-500);box-shadow:0 0 0 6px color-mix(in srgb,var(--v3-gold-300) 30%,transparent)}
.dlg-h h2{margin:0;font-size:var(--v3-fs-2xl);line-height:1.3}
.dlg-h p{margin:0;color:var(--d-sub);max-width:60ch}
.dlg-b{padding:8px 24px 16px;overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0}
.dlg-f{padding:16px 24px 24px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--d-line)}
.dlg-f .btn{min-height:48px;width:100%}
.dlg.form .dlg-h{flex-direction:row;text-align:start;align-items:center;border-bottom:1px solid var(--d-line);padding-bottom:16px}
.dlg.form .dlg-h .dlg-badge{width:48px;height:48px;box-shadow:none}
.dlg.form .dlg-h h2{font-size:var(--v3-fs-xl);flex:1}
.dlg.form .dlg-h p{font-size:var(--v3-fs-sm)}
.dlg.form .dlg-b{padding-top:16px}
@media (min-width:641px){.dlg.form .dlg-f{flex-direction:row;justify-content:flex-start}.dlg.form .dlg-f .btn{width:auto;min-width:140px}}
.dlg[data-v3-mode=dark] .btn.quiet{color:#fff;border-color:rgba(255,255,255,.35)}
.dlg[data-v3-mode=dark] .btn.quiet:hover{background:#fff;color:var(--v3-navy-800)}
.dlg[data-v3-mode=dark] .input,.dlg[data-v3-mode=dark] select.input{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.25);color:#fff}
.dlg[data-v3-mode=dark] .field>label{color:var(--d-sub)}
.dlg .x-btn{width:44px;height:44px;border-radius:12px;border:0;background:var(--d-row);color:var(--d-ink);display:grid;place-items:center;flex:none}
.pin{display:flex;gap:10px;justify-content:center;direction:ltr}
.pin input{width:56px;height:64px;text-align:center;font-size:var(--v3-fs-2xl);font-weight:700;border-radius:14px;border:2px solid var(--d-line);background:var(--d-row);color:var(--d-ink)}
.pin input:focus{outline:0;border-color:var(--v3-gold-500);box-shadow:0 0 0 4px color-mix(in srgb,var(--v3-gold-300) 45%,transparent)}
.pin.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.approvers{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.appr{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 12px;border-radius:14px;border:1.5px solid var(--d-line);background:var(--d-row);color:var(--d-ink);text-align:start}
.appr[aria-checked=true]{border-color:var(--v3-gold-500);box-shadow:inset 0 0 0 1px var(--v3-gold-500)}
.appr .tb-av{width:36px;height:36px}
.appr small{display:block;color:var(--d-sub);font-size:var(--v3-fs-2xs)}
.appr-box{display:flex;flex-direction:column;gap:8px}
.approvers{max-height:min(200px,30dvh);overflow-y:auto;overscroll-behavior:contain;margin-bottom:0;padding:2px;border-radius:14px}
.dlg-b > .field + .field{margin-top:var(--v3-sp-4)}
.appr{width:100%}
.appr .ic{margin-inline-start:auto;color:var(--v3-gold-500)}
.appr[aria-selected=true]{border-color:var(--v3-gold-500);box-shadow:inset 0 0 0 1px var(--v3-gold-500)}
.appr-note{display:flex;align-items:center;gap:8px;padding:10px 12px;color:var(--d-sub);font-size:var(--v3-fs-sm)}
.pw{display:flex;gap:8px;align-items:center}
.pw .input{flex:1}
.pw.shake{animation:shake .4s}
.dlg[data-v3-mode=dark] .ibtn.quiet{color:var(--d-ink)}
.okbox .links{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.okbox .links a{display:inline-flex;align-items:center;gap:6px;min-height:32px}
.derr{color:var(--v3-rose-300);text-align:center;font-size:var(--v3-fs-sm);margin-top:10px;min-height:1.6em}
.dlg:not([data-v3-mode=dark]) .derr{color:var(--v3-plum)}
.seg{display:flex;flex-wrap:wrap;gap:6px;background:var(--v3-sky-100);padding:5px;border-radius:14px}
.seg button{flex:1;min-width:max-content;min-height:44px;border:0;border-radius:10px;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px}
.seg button[aria-checked=true]{background:#fff;font-weight:600;box-shadow:0 1px 4px rgba(15,44,82,.15)}
.okbox{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:var(--v3-sky-100);border:1.5px solid var(--v3-navy-500);margin-bottom:12px}
.errbox{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:var(--v3-gold-100);border:2px solid var(--v3-gold-600);color:var(--v3-ink);margin-bottom:12px}
@media (max-width:640px){
  .scrim.sheet{align-items:flex-end;padding:0}
  .scrim.sheet .dlg{max-width:100%;border-radius:var(--v3-r-dlg) var(--v3-r-dlg) 0 0;padding-bottom:env(safe-area-inset-bottom);animation:sheet-up var(--v3-med) var(--v3-ease)}
  .scrim.full{padding:0}
  .scrim.full .dlg{max-width:100%;max-height:100dvh;height:100dvh;border-radius:0}
  .scrim.full .dlg-f{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
}

/* =========== Toast (פינה שמאלית-תחתונה, פיזית) =========== */
.toasts{position:fixed;left:24px;bottom:24px;z-index:var(--v3-z-toast);display:flex;flex-direction:column-reverse;gap:10px;width:min(400px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:14px;background:var(--v3-navy-800);color:#fff;border-radius:18px;padding:12px 12px 12px 14px;box-shadow:var(--v3-el-4);position:relative;overflow:hidden;animation:t-in var(--v3-enter) var(--v3-spring)}
@keyframes t-in{from{transform:translateX(-110%)}}
.toast.is-leaving{opacity:0;transform:translateX(-20px);transition:opacity 200ms,transform 200ms}
.toast .t-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--v3-sky-200);color:var(--v3-navy-700);flex:none;border:2px solid var(--v3-gold-300)}
.toast.err .t-ic{background:var(--v3-gold-300);color:var(--v3-plum)}
.toast .t-t{flex:1;min-width:0;display:flex;flex-direction:column}
.toast .t-t b{font-size:var(--v3-fs-md)}
.toast .t-t small{color:var(--v3-sky-200);font-size:var(--v3-fs-sm)}
.toast .t-x{width:40px;height:40px;border-radius:10px;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;flex:none}
.toast .t-bar{position:absolute;inset-inline:0;bottom:0;height:3px;background:var(--v3-sky-300);transform-origin:left;animation:nb-t var(--t-ms,6500ms) linear forwards}
.toast:hover .t-bar,.toast:focus-within .t-bar,html[data-v3-lock] .toast .t-bar{animation-play-state:paused}
@media (max-width:1023px){.toasts{left:16px;bottom:calc(88px + env(safe-area-inset-bottom))}}
/* בזמן שכבה מודאלית: הטיימר מושהה, והערימה יורדת מתחת לרקע כדי לא לכסות כפתורים בחלונית */
html[data-v3-lock] :is(.toasts,.notice-area){z-index:calc(var(--v3-z-layer) - 1)}
html[data-v3-lock] .nb-timer{animation-play-state:paused}

/* =========== Tooltip =========== */
#tipbox{position:fixed;z-index:var(--v3-z-tip);max-width:290px;background:var(--v3-tooltip-bg);color:var(--v3-tooltip-ink);font-size:var(--v3-fs-sm);line-height:1.5;padding:8px 12px;border-radius:14px;box-shadow:var(--v3-el-3);pointer-events:none;animation:tip-in var(--v3-fast) var(--v3-ease)}
@keyframes tip-in{from{transform:translateY(4px)}}

/* תוויות ארוכות (מבחן עמידות) */
html[data-long] .tab{max-width:220px}
html[data-long] .tab .tl{overflow:hidden;text-overflow:ellipsis}


/* =========== תוספות משותפות ל-A4/A5 =========== */
:root{ --v3-z-richtip:410; --v3-w-wide:1440px; }
.dlg-h .dlg-ht{display:flex;flex-direction:column;align-items:inherit;gap:4px;min-width:0}
.dlg.form .dlg-h .dlg-ht,.dlg.viewer .dlg-h .dlg-ht,.dlg.menu .dlg-h .dlg-ht{flex:1;align-items:flex-start;text-align:start}
.dlg.viewer .dlg-h,.dlg.menu .dlg-h{flex-direction:row;text-align:start;align-items:center;border-bottom:1px solid var(--d-line);padding-bottom:16px}
.dlg.viewer .dlg-h .dlg-badge{width:48px;height:48px;box-shadow:none}
.dlg.viewer .dlg-h h2,.dlg.menu .dlg-h h2{font-size:var(--v3-fs-xl)}
.dlg.viewer .dlg-b,.dlg.menu .dlg-b{padding-top:16px}
.dlg.menu .dlg-h{justify-content:center}
.demo-hint{text-align:center;margin:0;color:inherit;opacity:.8}
/* תפריט מעוגן (popover) */
.menu{position:fixed;z-index:var(--v3-z-popover);min-width:240px;max-width:min(340px,calc(100vw - 16px));background:var(--v3-surface);border:1.5px solid var(--v3-frame);border-radius:var(--v3-r-lg);box-shadow:var(--v3-el-3);padding:6px;display:flex;flex-direction:column;gap:2px;animation:tip-in var(--v3-fast) var(--v3-ease)}
.menu-h{padding:8px 12px 10px;font-weight:600;border-bottom:2px solid var(--v3-gold-500);margin-bottom:4px;font-size:var(--v3-fs-base)}

.menu-it{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 12px;border-radius:12px;border:0;background:transparent;text-align:start;color:inherit;text-decoration:none;width:100%}
.menu-it:hover,.menu-it:focus-visible{background:var(--v3-surface-3)}
.menu-it small{display:block;font-size:var(--v3-fs-sm);color:var(--v3-ink-3)}
.menu-it[aria-current=page]{background:var(--v3-surface-3);border-inline-start:4px solid var(--v3-gold-500);font-weight:600}
.dlg .menu-list .menu-it{border:1.5px solid var(--d-line)}
/* מתג (seg) בסרגלים */
.seg.on-page{background:var(--v3-surface);border:1.5px solid var(--v3-line)}
.seg.on-page button[aria-checked=true]{background:var(--v3-navy-800);color:#fff}
/* בקרת הדגמה — כמו A2 */
.demo select{font-size:var(--v3-fs-sm)}
/* רוחב רחב לארכיטיפ לוח */
.page.wide{max-width:var(--v3-w-wide)}
/* שדה צף בתחתית (שאלת המשך) */
.pill-input{display:flex;align-items:center;gap:8px;min-height:56px;padding:6px 6px 6px 8px;border:2px solid var(--v3-frame);border-radius:var(--v3-r-pill);background:var(--v3-surface);box-shadow:var(--v3-el-3)}
.pill-input input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:var(--v3-fs-md);padding-inline:12px}
.pill-input:focus-within{box-shadow:0 0 0 4px var(--v3-gold-300),var(--v3-el-3)}


/* =========== A4 לוח / ציר זמן =========== */
.pagehead.board-head{align-items:center}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:var(--v3-sp-4)}

.search.ai .mode{color:var(--v3-gold-800)}
.search .ibtn.quiet{width:40px;height:40px}
.search .ibtn[aria-pressed=true]{background:var(--v3-gold-100);color:var(--v3-gold-800);border-color:var(--v3-gold-600)}
.tb-group{display:flex;gap:8px;flex-wrap:wrap}
.filters-on{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:var(--v3-sp-4)}
.legend{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:12px 16px;border:1px solid var(--v3-frame-soft);border-radius:var(--v3-r-lg);background:var(--v3-surface);margin-bottom:var(--v3-sp-4)}

details.legend-wrap summary{list-style:none;cursor:pointer}
details.legend-wrap summary::-webkit-details-marker{display:none}

/* קטגוריות — פס בתחילת הכרטיס + תגית (אייקון + מילה; לא צבע בלבד) */
.cat-returned{--cat:var(--v3-navy-800)} .cat-rented{--cat:var(--v3-sky-400)} .cat-repairs{--cat:var(--v3-navy-500)}
.cat-unpaid{--cat:var(--v3-rose-500)} .cat-completed{--cat:var(--v3-sky-300)} .cat-empty{--cat:var(--v3-gold-600)} .cat-other{--cat:var(--v3-line)}
.chip.rep{background:var(--v3-surface);color:var(--v3-navy-800);border:1.5px solid var(--v3-navy-500)}
.chip.paid{background:var(--v3-sky-50);color:var(--v3-navy-800);border-color:var(--v3-sky-300)}
.chip.late{background:var(--v3-surface);color:var(--v3-plum);border:1.5px solid var(--v3-plum);font-weight:600}
.chip.empty-c{background:var(--v3-gold-100);color:var(--v3-gold-800);border:1.5px dashed var(--v3-gold-600)}
.chip.today-c{background:var(--v3-accent);color:#000;border-color:var(--v3-gold-700);font-weight:600}

/* רשת החודש */
.cal-wrap{border:1.5px solid var(--v3-frame);border-radius:var(--v3-r-xl);overflow:hidden;background:var(--v3-surface);box-shadow:var(--v3-el-1)}
.cal-dow,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-dow div{padding:10px 8px;text-align:center;font-weight:600;font-size:var(--v3-fs-sm);color:var(--v3-on-dark-2);background:var(--v3-navy-800)}
.cal-dow div abbr{text-decoration:none}
.cal{gap:0;background:var(--v3-line-soft)}
.day{position:relative;min-height:150px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--v3-surface);border-top:1px solid var(--v3-line);border-inline-start:1px solid var(--v3-line);min-width:0}
.cal .day:nth-child(7n+1){border-inline-start:0}
.day.void{background:repeating-linear-gradient(135deg,var(--v3-sky-50) 0 8px,var(--v3-surface) 8px 16px)}
.day.past .d-num{color:var(--v3-ink-3)}
.day.shab{background:var(--v3-surface-2)}
.day.today{box-shadow:inset 0 0 0 3px var(--v3-gold-500);background:var(--v3-gold-100)}
.day.hl{box-shadow:inset 0 0 0 3px var(--v3-navy-500)}
.day.late{border-inline-start:4px solid var(--v3-plum)}
.d-head{display:flex;align-items:flex-start;gap:6px;min-height:32px}
.d-num{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.d-num b{font-size:var(--v3-fs-lg);font-weight:700}
.d-num small{font-size:var(--v3-fs-2xs);color:var(--v3-ink-3)}
.d-tools{margin-inline-start:auto;display:flex;align-items:center;gap:2px}
.d-tools .ibtn{width:36px;height:36px;border-radius:10px}
.d-count{font-size:var(--v3-fs-2xs);font-weight:600;color:var(--v3-ink-2);background:var(--v3-sky-100);border-radius:var(--v3-r-pill);padding:1px 8px;white-space:nowrap}
.today-pin{position:absolute;inset-block-start:-1px;inset-inline-start:50%;transform:translate(50%,-2px);background:var(--v3-accent);color:#000;border:1.5px solid #000;border-radius:0 0 10px 10px;font-size:var(--v3-fs-cap);font-weight:700;padding:0 10px;line-height:20px;z-index:1}
.today-pin::after{content:"";position:absolute;inset-inline-start:50%;inset-block-end:-10px;width:2px;height:8px;background:#000}
.late-flag{display:inline-flex;align-items:center;gap:4px;color:var(--v3-plum);font-size:var(--v3-fs-2xs);font-weight:700}
.d-tags{display:flex;flex-wrap:wrap;gap:4px}
.d-tags .chip{min-height:24px;padding:0 8px;font-size:var(--v3-fs-cap);white-space:normal}
.d-list{display:flex;flex-direction:column;gap:6px;min-width:0}
.more-btn{min-height:36px;border:1.5px dashed var(--v3-navy-500);border-radius:10px;background:var(--v3-surface);color:var(--v3-navy-800);font-weight:600;font-size:var(--v3-fs-sm);display:flex;align-items:center;justify-content:center;gap:6px}
.more-btn:hover{background:var(--v3-navy-800);color:#fff;border-style:solid}

/* כרטיס הזמנה מקופל */
.oc{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 36px;align-items:stretch;border:1px solid var(--v3-line);border-inline-start:5px solid var(--cat);border-radius:10px;background:var(--v3-surface);min-width:0;transition:border-color var(--v3-fast),transform var(--v3-fast)}
.oc:hover{border-color:var(--v3-navy-500);border-inline-start-color:var(--cat);transform:translateY(-1px)}
.oc.is-late{border:2px solid var(--v3-plum);border-inline-start:5px solid var(--cat)}
.oc.cat-empty{border-style:dashed;border-inline-start-style:solid}
.oc-main{border:0;background:transparent;text-align:start;padding:6px 8px;display:flex;flex-direction:column;gap:2px;min-width:0;min-height:44px;border-radius:10px}
.oc-name{font-weight:600;font-size:var(--v3-fs-sm);line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.oc-id{font-size:var(--v3-fs-2xs);color:var(--v3-ink-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.oc .chip{min-height:24px;padding:0 8px;font-size:var(--v3-fs-cap);align-self:flex-start;white-space:normal}
.oc-info{border:0;border-inline-start:1px solid var(--v3-line-soft);background:transparent;color:var(--v3-ink-3);display:grid;place-items:center;border-radius:10px;min-height:44px}
.oc-info:hover,.oc-info:focus-visible{background:var(--v3-surface-3);color:var(--v3-navy-800)}
/* כרטיס רחב (רשימה/חלון יום): כל נתון בשורה */
.oc.wide .oc-main{padding:10px 14px;gap:4px}
.oc.wide .oc-name{font-size:var(--v3-fs-md);-webkit-line-clamp:3}
.oc.wide .oc-id{font-size:var(--v3-fs-sm)}
.oc.wide .chip{font-size:var(--v3-fs-2xs);min-height:28px}
.oc.wide{grid-template-columns:minmax(0,1fr) 48px}

/* כרטיס פרטים בריחוף (rich tip) */
#richtip{position:fixed;z-index:var(--v3-z-richtip);width:300px;max-width:calc(100vw - 16px);background:var(--v3-surface);color:var(--v3-ink);border:1.5px solid var(--v3-frame);border-radius:var(--v3-r-lg);box-shadow:var(--v3-el-3);padding:12px 14px;pointer-events:none;animation:tip-in var(--v3-fast) var(--v3-ease)}
#richtip h3{margin:0 0 8px;font-size:var(--v3-fs-base);display:flex;align-items:center;gap:6px;padding-bottom:8px;border-bottom:2px solid var(--v3-gold-500)}
.kv{display:flex;flex-direction:column;padding:6px 0;border-top:1px solid var(--v3-line-soft)}
.kv:first-of-type{border-top:0}
.kv .l{font-size:var(--v3-fs-2xs);color:var(--v3-ink-3);display:flex;align-items:center;gap:6px}
.kv .v{font-size:var(--v3-fs-base);font-weight:500;overflow-wrap:anywhere}
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.dlg[data-v3-mode=dark] .kv{border-color:var(--d-line)}
.dlg[data-v3-mode=dark] .kv .l{color:var(--d-sub)}
.pay-full{font-weight:700} .pay-part{font-weight:700;text-decoration:underline dotted} .pay-none{font-weight:700}

/* תצוגת שבוע */
.cal.week .day{min-height:280px}
/* רשימה יומית (אג'נדה) עם סמן "היום" */
.agenda{display:flex;flex-direction:column;gap:var(--v3-sp-4)}
.ag-day{background:var(--v3-surface);border:1px solid var(--v3-frame-soft);border-radius:var(--v3-r-lg);overflow:hidden}
.ag-day.today{border:2px solid var(--v3-gold-600)}
.ag-day.late{border-inline-start:5px solid var(--v3-plum)}
.ag-h{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--v3-surface-2);border-bottom:1px solid var(--v3-line);flex-wrap:wrap}
.ag-date{display:flex;flex-direction:column;min-width:0;flex:1}
.ag-date b{font-size:var(--v3-fs-lg)}
.ag-date small{color:var(--v3-ink-3);font-size:var(--v3-fs-sm)}
.ag-list{display:flex;flex-direction:column;gap:10px;padding:12px 16px 16px}
.ag-empty{padding:12px 16px;color:var(--v3-ink-3);font-size:var(--v3-fs-sm);display:flex;align-items:center;gap:8px}
.now-line{display:flex;align-items:center;gap:10px;color:var(--v3-ink);font-weight:600}
.now-line::before,.now-line::after{content:"";flex:1;height:3px;background:var(--v3-gold-500);border-radius:2px}
.now-line b{background:var(--v3-accent);border:1.5px solid #000;border-radius:var(--v3-r-pill);padding:0 14px;line-height:28px;color:#000;display:inline-flex;align-items:center;gap:6px}
.ai-banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:var(--v3-r-lg);background:var(--v3-gold-100);border:2px solid var(--v3-gold-600);margin-bottom:var(--v3-sp-4);flex-wrap:wrap}
.ai-banner .b-t{flex:1;min-width:200px;display:flex;flex-direction:column}
.ai-banner .b-t span{font-size:var(--v3-fs-sm);color:var(--v3-ink-2)}
.state-box{background:var(--v3-surface);border:1px solid var(--v3-frame-soft);border-radius:var(--v3-r-xl)}
.sk-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:12px}
.sk-cal .sk{height:120px}

/* כרטיס השכרה */
.rr-items{display:flex;flex-direction:column;gap:10px}
.rr-it{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px;padding:12px;border:1.5px solid var(--v3-line);border-radius:var(--v3-r-lg);background:var(--v3-surface)}
.rr-it.pend{border-style:dashed;border-color:var(--v3-pending-line);background:var(--v3-pending-bg)}
.rr-it .it-thumb{grid-row:span 3}
.rr-it b{font-size:var(--v3-fs-md)}
.rr-it .meta{font-size:var(--v3-fs-sm);color:var(--v3-ink-3)}
.rr-it .acts{grid-column:2;display:flex;gap:6px;flex-wrap:wrap}
.scanbar{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;margin-bottom:var(--v3-sp-4)}
.scanbar .input{flex:1;min-width:180px;font-size:var(--v3-fs-lg);letter-spacing:.04em}

/* רספונסיבי */
@media (max-width:1439px){ .day{min-height:132px} }
@media (max-width:1023px){
  /* טאבלט וטלפון: רשת החודש = מספר היום + ספירה; הכרטיסים בחלון היום או בתצוגת רשימה */
  .cal:not(.week) .day{min-height:84px;padding:6px 4px;gap:2px;align-items:stretch}
  .cal:not(.week) .d-tools,.cal:not(.week) .d-list{display:none}
  .cal:not(.week) .d-tags .chip{display:none}
  .cal:not(.week) .d-tags .chip.hol-main{display:inline-flex;justify-content:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cal:not(.week) .day .d-head{flex-direction:column;align-items:center;gap:0}
  .cal:not(.week) .d-num{align-items:center}
  .cal:not(.week) .day-tap{display:flex}
  .cal:not(.week) .day-dot{display:inline-grid}
  .cal.week .day{min-height:200px}
  .cal.week .oc-info{display:none}
  .cal.week .oc{grid-template-columns:minmax(0,1fr)}
  .board-head .period{width:100%}
}
@media (max-width:767px){
  .cal-dow div{padding:8px 2px;font-size:var(--v3-fs-2xs)}
  .cal-dow .full{display:none}
  .cal-dow .short{display:inline}
  .cal:not(.week) .day{min-height:64px}
  .cal:not(.week) .d-tags{display:none}
  .cal .d-num b{font-size:var(--v3-fs-base)}
  .today-pin{font-size:0;padding:0;width:20px;height:6px;border-radius:0 0 6px 6px}
  .today-pin::after{display:none}
  .board-head .period{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:8px}
  .period-x{grid-column:1/-1}
  .period-x .btn{flex:1}
  .period-lbl{padding:4px 8px;text-align:center}
  .toolbar .search{max-width:none;flex-basis:100%}
  .search .mode{display:none}
  .tb-group{width:100%}
  .tb-group .btn{flex:1;padding-inline:10px}
  .toolbar .seg.on-page{width:100%;margin-inline-start:0!important}
  .cal.week{grid-template-columns:minmax(0,1fr)}
  .cal.week .day{min-height:0;border-inline-start:0}
}
.day-tap{display:none;position:absolute;inset:0;border:0;background:transparent;border-radius:0}
.day-tap:focus-visible{outline-offset:-3px}
.day-dot{display:none;place-items:center;min-width:24px;height:22px;border-radius:11px;background:var(--v3-navy-800);color:#fff;font-size:var(--v3-fs-cap);font-weight:700;margin-top:4px;align-self:center;padding:0 6px}
.day.late .day-dot{background:var(--v3-plum)}
.period-x{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.day.today{padding-top:24px}
.legend-toggle{display:none}
@media (max-width:639px){
  .legend-toggle{display:flex;width:100%;justify-content:space-between;min-height:44px;border:0;background:transparent;font-weight:600;padding:0}
  .legend.is-closed > :not(.legend-toggle){display:none}
  .legend:not(.is-closed) .legend-toggle{margin-bottom:6px}
  .legend.is-closed{padding-block:4px}
  .legend h2{display:none}
}
@media (max-width:639px){ .legend{padding:10px 12px} .legend .sep{display:none} }

.seg button[aria-selected=true]{background:#fff;font-weight:600;box-shadow:0 1px 4px rgba(15,44,82,.15)}
.gres{border:1.5px solid var(--d-line);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.gres .inline-acts{margin-top:6px}
.kv .missing{opacity:.85}
.cal-dow .short{display:none}
@media (max-width:767px){ .cal-dow .short{display:inline} }
.cal:not(.week) .day.today{padding-top:22px}

</style>

<script>
/* =========================================================
   תשתית משותפת (זהה לאב-טיפוס A2): עזרים, LayerManager מיניאטורי,
   Toast שמאל-תחתון, NoticeBar עליון עם פס זהב יורד, Tooltip יחיד.
   ========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic = (n, cls = '', anim = '') => `<svg class="ic ${cls}"${anim ? ` data-a="${anim}"` : ''} aria-hidden="true"><use href="#i-${n}"/></svg>`;
const money = n => `<bdi dir="ltr">₪${Math.round(Math.abs(n)).toLocaleString('he-IL')}</bdi>`;
const num = n => `<bdi>${Number(n).toLocaleString('he-IL')}</bdi>`;
const tip = t => `<button type="button" class="tip" data-tip="${esc(t)}" aria-label="הסבר: ${esc(t)}">${ic('info','sm')}</button>`;
const UI = { dark:true, sheetOpen:false };

/* ---------- LayerManager: שכבה תמיד מעל כל העמוד ---------- */
const layers = [];
const INERT_SEL = ['.topbar', '.demo', '#page', '#noticeArea', '#followup'];
function lockSync(){
  const locked = layers.length > 0;
  document.documentElement.toggleAttribute('data-v3-lock', locked);
  INERT_SEL.forEach(s => { const el = $(s); if (el) el.inert = locked; });
  layers.forEach((l, i) => { l.el.inert = i !== layers.length - 1; });
  closeMenu();
}
/* type: confirm | code | viewer (בלי קלט — עוקבים ערכת נושא) · form | menu (בהיר תמיד) */
function openLayer({ type, size = 'm', html, onMount, closeOnScrim = true }){
  if (layers.length >= 3) { console.warn('max 3 layers'); return null; }
  const themed = type === 'confirm' || type === 'code' || type === 'viewer';
  const mode = themed && UI.dark ? 'dark' : 'light';
  const scrim = document.createElement('div');
  scrim.className = `scrim ${type === 'form' ? 'full' : 'sheet'}`;
  scrim.style.zIndex = 100 + layers.length * 10;
  const tid = `dl-t-${Date.now()}-${layers.length}`;
  scrim.innerHTML = `<div class="dlg ${size} ${type}" data-v3-mode="${mode}" role="${type === 'confirm' ? 'alertdialog' : 'dialog'}" aria-modal="true" aria-labelledby="${tid}">${html.replace(/%TID%/g, tid)}</div>`;
  const layer = { el:scrim, trigger:document.activeElement, type, busy:false, resolve:null, onClose:null };
  const p = new Promise(r => { layer.resolve = r; });
  scrim.addEventListener('mousedown', e => { if (e.target === scrim && closeOnScrim && !layer.busy) closeLayer(layer, null); });
  $('#layer-root').appendChild(scrim); layers.push(layer); lockSync();
  if (onMount) onMount(scrim.querySelector('.dlg'), layer);
  const af = scrim.querySelector('[data-autofocus]') || scrim.querySelector('button,input,select,textarea,a[href]');
  af && af.focus();
  return { layer, done:p };
}
async function closeLayer(layer, result){
  if (layer.onClose && result === null){ const ok = await layer.onClose(); if (!ok) return; }
  const i = layers.indexOf(layer); if (i < 0) return;
  layers.splice(i, 1);
  const el = layer.el; el.classList.add('is-leaving'); setTimeout(() => el.remove(), 200);
  lockSync(); layer.resolve(result);
  if (layer.trigger && document.contains(layer.trigger)) layer.trigger.focus();
}
document.addEventListener('keydown', e => {
  const top = layers[layers.length - 1];
  if (e.key === 'Escape') {
    if (menuEl) { e.preventDefault(); closeMenu(true); return; }
    if (top && !top.busy) { e.preventDefault(); closeLayer(top, null); return; }
  }
  if (e.key === 'Tab' && top){
    const f = [...top.el.querySelectorAll('button:not(:disabled),input:not(:disabled),select,textarea,a[href],[tabindex="0"]')].filter(x => x.offsetParent !== null);
    if (!f.length) return; const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});
function dlgHead(icon, title, sub, closeLabel){
  return `<div class="dlg-h"><span class="dlg-badge">${ic(icon,'lg')}</span><div class="dlg-ht"><h2 id="%TID%">${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div>${closeLabel ? `<button type="button" class="x-btn" data-x aria-label="${esc(closeLabel)}">${ic('x')}</button>` : ''}</div>`;
}
function confirmDlg({ icon = 'alert', title, text, buttons, danger = false }){
  const html = `<div class="dlg-h"><span class="dlg-badge">${ic(icon,'lg enter')}</span><h2 id="%TID%">${title}</h2>${text ? `<p>${text}</p>` : ''}</div>
    <div class="dlg-f">${buttons.map(b => `<button type="button" class="btn ${b.kind || ''}" data-r="${esc(b.value)}" ${b.auto ? 'data-autofocus' : ''}>${b.icon ? ic(b.icon,'','pop') : ''}${b.label}</button>`).join('')}</div>`;
  const o = openLayer({ type:'confirm', size:'s', html, closeOnScrim:!danger, onMount(d, layer){ d.querySelectorAll('[data-r]').forEach(b => b.onclick = () => closeLayer(layer, b.dataset.r)); } });
  return o ? o.done : Promise.resolve(null);
}
function alertDlg(title, text, icon = 'alert'){ return confirmDlg({ icon, title, text, buttons:[{ label:'הבנתי', kind:'primary', value:'ok', auto:1 }] }); }

/* אישור מנהל = בחירת מאשר (עם חיפוש) + סיסמה מלאה — כמו customAuthPrompt היום (REVIEW-1 B-1).
   הרשימה = GET /api/employees מסונן לפי employee.approvals[key]; ברירת מחדל = המחובר אם מורשה.
   האימות = POST /api/auth/verify-pin {employeeId, pin, requiredLevel} — ללא שינוי. */
const APPROVERS = [{ id:'e1', n:'שולמית', r:'הנהלה ראשית' }, { id:'e2', n:'מרים גולד', r:'הנהלה ראשית' }, { id:'e3', n:'אסתר ברק', r:'מנהלת סניף' }];
function codeDlg(purpose, { me = 'שולמית', pool = APPROVERS, fail = () => false } = {}){
  let sel = pool.findIndex(a => a.n === me); let loaded = false;
  const html = `<div class="dlg-h"><span class="dlg-badge">${ic('lock','lg')}</span><h2 id="%TID%">אישור מנהל</h2><p>${esc(purpose)}</p></div>
    <div class="dlg-b">
      <div class="field"><label for="ap-q">מי מאשר${tip('רק מי שמורשה לאשר את הפעולה הזו מופיע ברשימה.')}</label>
        <div class="appr-box"><input class="input" id="ap-q" role="combobox" aria-expanded="true" aria-controls="ap-list" aria-autocomplete="list" autocomplete="off" placeholder="חיפוש לפי שם">
        <div class="approvers" id="ap-list" role="listbox" aria-label="מאשרים"></div></div></div>
      <div class="field"><label for="ap-pw">הסיסמה של המאשר</label>
        <div class="pw"><input class="input" id="ap-pw" type="password" autocomplete="new-password" dir="ltr" data-autofocus><button type="button" class="ibtn quiet" data-pw aria-label="הצגת הסיסמה" aria-pressed="false">${ic('eye')}</button></div></div>
      <div class="derr" role="alert"></div><p class="fhint demo-hint">בהדגמה: "0000" = סיסמה שגויה.</p></div>
    <div class="dlg-f"><button type="button" class="btn primary" data-go>${ic('check','','pop')}אישור</button><button type="button" class="btn quiet" data-cancel>ביטול</button></div>`;
  const o = openLayer({ type:'code', size:'s', html, closeOnScrim:false, onMount(d, layer){
    const q = d.querySelector('#ap-q'), list = d.querySelector('#ap-list'), pw = d.querySelector('#ap-pw'), err = d.querySelector('.derr'), go = d.querySelector('[data-go]');
    const draw = () => {
      if (!loaded){ list.innerHTML = `<div class="appr-note" role="status">${ic('loader','sm','loop')}טוענים את רשימת המאשרים…</div>`; go.disabled = true; return; }
      if (!pool.length){ list.innerHTML = `<div class="appr-note">${ic('info','sm')}אין מי שמורשה לאשר את זה. מגדירים מאשרים בעמוד ההרשאות.</div>`; go.disabled = true; q.disabled = true; return; }
      const f = q.value.trim(); const shown = pool.map((a, i) => [a, i]).filter(([a]) => !f || a.n.includes(f));
      list.innerHTML = shown.length ? shown.map(([a, i]) => `<button type="button" class="appr" role="option" aria-selected="${i === sel}" data-i="${i}" tabindex="-1"><span class="tb-av">${a.n[0]}</span><span>${a.n}${a.n === me ? ' (אני)' : ''}<small>${a.r}</small></span>${i === sel ? ic('check','sm') : ''}</button>`).join('') : `<div class="appr-note">${ic('search','sm')}אין מאשר בשם הזה</div>`;
      go.disabled = sel < 0;
      list.querySelectorAll('.appr').forEach(b => b.onclick = () => { sel = +b.dataset.i; q.value = ''; err.textContent = ''; draw(); pw.focus(); });
    };
    setTimeout(() => { loaded = true; draw(); }, 450); draw();
    q.oninput = draw;
    d.querySelector('[data-pw]').onclick = e => { const show = pw.type === 'password'; pw.type = show ? 'text' : 'password'; e.currentTarget.setAttribute('aria-pressed', show); e.currentTarget.setAttribute('aria-label', show ? 'הסתרת הסיסמה' : 'הצגת הסיסמה'); pw.focus(); };
    pw.onkeydown = e => { if (e.key === 'Enter') go.click(); };
    d.querySelector('[data-cancel]').onclick = () => closeLayer(layer, null);
    go.onclick = () => {
      const shake = m => { const g = d.querySelector('.pw'); g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake'); err.textContent = m; pw.select(); pw.focus(); };
      if (sel < 0) { err.textContent = 'צריך לבחור מי מאשר'; q.focus(); return; }
      if (!pw.value) return shake('צריך להקליד סיסמה');
      layer.busy = true; go.disabled = true; go.innerHTML = `${ic('loader','','loop')}בודקים…`;
      setTimeout(() => {
        layer.busy = false; go.disabled = false; go.innerHTML = `${ic('check','','pop')}אישור`;
        if (fail()) return shake('אין חיבור לשרת. נסו שוב.');
        if (pw.value === '0000') return shake('הסיסמה לא נכונה, או שאין הרשאה לאשר.');
        closeLayer(layer, { employeeId: pool[sel].id, approver: pool[sel].n });
      }, 450);
    };
  }});
  return o ? o.done : Promise.resolve(null);
}

/* ---------- Popover/Menu: לא מודאלי, light-dismiss; בטלפון = גיליון תחתון ---------- */
let menuEl = null, menuTrigger = null;
function openMenu(anchor, title, items){
  closeMenu();
  if (innerWidth < 640){ /* phone: הופך לגיליון תחתון (§ד.8) */
    const html = `<div class="dlg-h"><h2 id="%TID%">${title}</h2></div><div class="dlg-b"><div class="menu-list">${items.map((it, i) => `<button type="button" class="menu-it" data-mi="${i}">${ic(it.icon,'','nudge')}<span>${it.label}${it.sub ? `<small>${it.sub}</small>` : ''}</span></button>`).join('')}</div></div><div class="dlg-f"><button type="button" class="btn quiet" data-cancel>סגירה</button></div>`;
    openLayer({ type:'menu', size:'s', html, onMount(d, layer){ d.querySelectorAll('[data-mi]').forEach(b => b.onclick = () => { closeLayer(layer, 'x'); items[+b.dataset.mi].run(); }); d.querySelector('[data-cancel]').onclick = () => closeLayer(layer, null); } });
    return;
  }
  menuTrigger = anchor; anchor.setAttribute('aria-expanded', 'true');
  menuEl = document.createElement('div'); menuEl.className = 'menu'; menuEl.setAttribute('role', 'menu'); menuEl.setAttribute('aria-label', title.replace(/<[^>]+>/g, ''));
  menuEl.innerHTML = `<div class="menu-h">${title}</div>${items.map((it, i) => `<button type="button" class="menu-it" role="menuitem" data-mi="${i}" tabindex="-1">${ic(it.icon,'','nudge')}<span>${it.label}${it.sub ? `<small>${it.sub}</small>` : ''}</span></button>`).join('')}`;
  if (layers.length) menuEl.style.zIndex = 100 + layers.length * 10 + 5; /* תפריט מתוך חלונית: מעליה */
  $('#layer-root').appendChild(menuEl);
  const r = anchor.getBoundingClientRect(), m = menuEl.getBoundingClientRect();
  let top = r.bottom + 6, left = r.right - m.width; /* RTL: מיושר לתחילת העוגן (ימין) */
  if (top + m.height > innerHeight - 8) top = Math.max(8, r.top - m.height - 6);
  left = Math.max(8, Math.min(left, innerWidth - m.width - 8));
  menuEl.style.top = top + 'px'; menuEl.style.left = left + 'px';
  const btns = [...menuEl.querySelectorAll('.menu-it')];
  btns.forEach((b, i) => b.onclick = () => { closeMenu(); items[i].run(); });
  menuEl.onkeydown = e => { const i = btns.indexOf(document.activeElement);
    if (e.key === 'ArrowDown'){ e.preventDefault(); (btns[i + 1] || btns[0]).focus(); }
    if (e.key === 'ArrowUp'){ e.preventDefault(); (btns[i - 1] || btns[btns.length - 1]).focus(); }
    if (e.key === 'Home'){ e.preventDefault(); btns[0].focus(); } if (e.key === 'End'){ e.preventDefault(); btns[btns.length - 1].focus(); }
    if (e.key === 'Tab') closeMenu(); };
  btns[0] && btns[0].focus();
}
function closeMenu(refocus){
  if (!menuEl) return; menuEl.remove(); menuEl = null;
  if (menuTrigger){ menuTrigger.setAttribute('aria-expanded', 'false'); if (refocus && document.contains(menuTrigger)) menuTrigger.focus(); }
  menuTrigger = null;
}
document.addEventListener('mousedown', e => { if (menuEl && !menuEl.contains(e.target) && e.target !== menuTrigger && !menuTrigger?.contains(e.target)) closeMenu(); });
addEventListener('resize', () => closeMenu());

/* ---------- Toast (פינה שמאלית-תחתונה, פיזית) ---------- */
function toast(kind, title, text, ms = 6500){
  const box = $('#toasts'); while (box.children.length >= 3) box.firstElementChild.remove();
  const t = document.createElement('div'); t.className = `toast ${kind === 'err' ? 'err' : ''}`; if (kind === 'err') t.setAttribute('role', 'alert');
  t.style.setProperty('--t-ms', ms + 'ms');
  t.innerHTML = `<span class="t-ic">${ic(kind === 'err' ? 'alert' : kind === 'info' ? 'info' : 'check','lg enter')}</span><span class="t-t"><b>${esc(title)}</b>${text ? `<small>${esc(text)}</small>` : ''}</span><button type="button" class="t-x" aria-label="סגירת ההודעה">${ic('x','sm')}</button><span class="t-bar" aria-hidden="true"></span>`;
  const kill = () => { t.classList.add('is-leaving'); setTimeout(() => t.remove(), 200); };
  t.querySelector('.t-x').onclick = kill; t.querySelector('.t-bar').addEventListener('animationend', kill);
  box.appendChild(t);
}
/* ---------- NoticeBar עליון: פס זהב יורד ~15ש', עוצר בריחוף/מיקוד ---------- */
function notice(kind, title, text, action){
  const area = $('#noticeArea'); area.innerHTML = '';
  const n = document.createElement('div'); n.className = 'notice'; n.setAttribute('role', 'status');
  n.innerHTML = `<div class="nb-main"><span class="nb-ic">${ic(kind === 'success' ? 'check' : 'info','draw')}</span><div class="nb-msg"><b>${esc(title)}</b>${text ? `<span>${esc(text)}</span>` : ''}</div>
    <div class="nb-acts">${action ? `<button type="button" class="btn sm" data-nb-act>${ic('next','sm','nudge')}${esc(action.label)}</button>` : ''}</div>
    <button type="button" class="nb-x" aria-label="סגירת ההודעה">${ic('x','sm')}</button></div><div class="nb-timer" aria-hidden="true"></div>`;
  const kill = () => { n.classList.add('is-leaving'); setTimeout(() => n.remove(), 200); };
  n.querySelector('.nb-x').onclick = kill;
  n.querySelector('.nb-timer').addEventListener('animationend', kill);
  if (action) n.querySelector('[data-nb-act]').onclick = () => { kill(); action.run(); };

/* ---------- Tooltip יחיד: ריחוף 150ms / מיקוד / מגע ---------- */
(() => {
  const box = $('#tipbox'); let timer, cur;
  const show = el => { const txt = el.getAttribute('data-tip'); if (!txt) return; cur = el; box.textContent = txt; box.hidden = false;
    const r = el.getBoundingClientRect(), b = box.getBoundingClientRect(); let top = r.bottom + 8, left = r.left + r.width / 2 - b.width / 2;
    if (top + b.height > innerHeight - 8) top = r.top - b.height - 8; left = Math.max(8, Math.min(left, innerWidth - b.width - 8));
    box.style.top = top + 'px'; box.style.left = left + 'px'; };
  const hide = () => { clearTimeout(timer); box.hidden = true; cur = null; };
  document.addEventListener('pointerover', e => { if (e.pointerType === 'touch') return; const el = e.target.closest('[data-tip]'); if (el === cur) return; clearTimeout(timer); if (!el) return hide(); timer = setTimeout(() => show(el), 150); });
  document.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el && e.target.matches(':focus-visible')) show(el); else hide(); });
  document.addEventListener('pointerdown', e => { const el = e.target.closest('.tip'); if (e.pointerType === 'touch' && el){ cur === el ? hide() : show(el); } else if (!el) hide(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hide(); });
  addEventListener('scroll', hide, { passive:true });
})();

function rng(seed){ let s = seed % 2147483647; if (s <= 0) s += 2147483646; return () => (s = s * 16807 % 2147483647) / 2147483647; }
let ORDERS = [];
function buildOrders(){
  const r = rng(7); let id = 48100; ORDERS = [];
  DAYS.forEach((x, i) => {
    if (S.data === 'empty' && x.mi === 1) return;
    const chag = x.hol.some(h => /ראש השנה|יום כיפור|^סוכות|שמיני|ערב|צום/.test(h));
    let n = x.dow === 6 || chag ? 0 : x.dow === 5 ? (r() < .35 ? 1 : 0) : Math.floor(r() * 4.2);
    if (S.data === 'busy' && x.mi === 1 && x.d === 24) n = 14;
    if (x.mi === 1 && x.d === 13) n = Math.max(n, 2);
    for (let k = 0; k < n; k++){
      const past = i < TODAY_I, diff = TODAY_I - i;
      const nItems = r() < .06 ? 0 : 1 + Math.floor(r() * 3);
      const items = [];
      for (let j = 0; j < nItems; j++){
        let isTaken = false, isReturned = false;
        if (past){ isTaken = true; isReturned = diff > 2 ? r() > .12 : r() > .7; }
        else if (diff >= -2 && r() < .4) isTaken = true;
        items.push({ isTaken, isReturned, isDeleted: r() < .05, alt: r() < .18 });
      }
      const total = nItems ? [350, 400, 450, 600, 750, 900][Math.floor(r() * 6)] * nItems / 2 : 0;
      const paidR = r(); const paid = !total ? 0 : paidR < .3 ? 0 : paidR < .55 ? Math.round(total / 2) : total;
      const long = PROFILES[S.profile].long && k === 0 && x.d % 5 === 0;
      const fn = FN[Math.floor(r() * FN.length)], ln = LN[Math.floor(r() * LN.length)];
      ORDERS.push({ orderId: ++id, customerName: long ? LONG_NAME : `${fn} ${ln}`, customerId: r() < .95 ? 'c' + id : null,

        day:i, customSpacing: r() < .15 ? [1, 2, 3, 14][Math.floor(r() * 4)] : null, totalAmount: total, totalPaid: paid, items });
    }
  });
}

function category(o){
  const isEmpty = !o.items || o.items.length === 0;
  const hasRepairs = o.items && o.items.some(i => i.alt);
  const isUnpaid = (o.totalPaid || 0) < (o.totalAmount || 0);
  const isPaidInFull = (o.totalAmount || 0) > 0 && (o.totalPaid || 0) >= o.totalAmount;
  const v = o.items ? o.items.filter(i => !i.isDeleted) : [];
  const allReturned = v.length > 0 && v.every(i => i.isReturned);
  const someReturned = v.some(i => i.isReturned);
  const allTaken = v.length > 0 && v.every(i => i.isTaken);
  const someTaken = v.some(i => i.isTaken);
  if (isEmpty) return 'empty';
  if (allReturned) return 'returned';
  if (allTaken || someTaken || someReturned) return 'rented';
  if (cfg.flag('enable_alterations') && hasRepairs) return 'repairs';
  if (isUnpaid) return 'unpaid';
  if (isPaidInFull) return 'completed';
  return 'other';
}

function dayCell(x, i, orders, clamp){
  const past = i < TODAY_I, today = i === TODAY_I, late = orders.some(isLate);
