function grid(map){
  const week = S.view === 'week';
  let cells = [];
  if (week){ for (let i = S.weekStart; i < Math.min(DAYS.length, S.weekStart + 7); i++) cells.push(dayCell(DAYS[i], i, map[i] || [], false)); }
  else {
    const first = DAYS.findIndex(x => x.mi === S.mi), last = DAYS.map(x => x.mi).lastIndexOf(S.mi);
    for (let k = 0; k < DAYS[first].dow; k++) cells.push('<div class="day void" role="gridcell" aria-hidden="true"></div>');
    for (let i = first; i <= last; i++) cells.push(dayCell(DAYS[i], i, map[i] || [], true));
    while (cells.length % 7) cells.push('<div class="day void" role="gridcell" aria-hidden="true"></div>');
  }
  const rows = []; for (let k = 0; k < cells.length; k += 7) rows.push(`<div role="row" style="display:contents">${cells.slice(k, k + 7).join('')}</div>`);
  return `<div class="cal-wrap"><div class="cal-dow" role="presentation">${DOW.map((d, k) => `<div><span class="full">${d}</span><span class="short" aria-hidden="true">${['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'][k]}</span></div>`).join('')}</div>
    <div class="cal ${week ? 'week' : ''}" role="grid" aria-label="${week ? 'שבוע' : 'חודש'} — הזמנות לפי יום">${rows.join('')}</div></div>`;
}
function agenda(map){
  const days = DAYS.map((x, i) => [x, i]).filter(([x, i]) => x.mi === S.mi && ((map[i] || []).length || i === TODAY_I));
  if (!days.length) return '';
  let out = '', nowPlaced = false;
  days.forEach(([x, i]) => {
    if (!nowPlaced && i >= TODAY_I && DAYS[TODAY_I].mi === S.mi){ out += `<div class="now-line" role="separator" aria-label="היום, ${hebLabel(DAYS[TODAY_I])}"><b>${ic('today','sm')}היום</b></div>`; nowPlaced = true; }
    const os = map[i] || [], late = os.some(isLate), print = cfg.flag('enable_batch_print_prep') && os.length;
    out += `<section class="ag-day ${i === TODAY_I ? 'today' : ''} ${late ? 'late' : ''}" aria-label="${DOW[x.dow]} ${hebLabel(x)}">
      <div class="ag-h"><div class="ag-date"><b>יום ${DOW[x.dow]}, ${GEM[x.d - 1]} ${MONTHS[x.mi].name}</b><small><bdi dir="ltr">${fmtGFull(x.g)}</bdi>${x.par ? ` · פרשת ${x.par}` : ''}</small></div>
        ${x.hol.map(h => `<span class="chip">${h}</span>`).join('')}
        ${late ? `<span class="chip late">${ic('late')}יש איחור</span>` : ''}
        ${os.length ? `<span class="d-count"><bdi>${os.length}</bdi> הזמנות</span>` : ''}
        ${print ? `<button type="button" class="ibtn quiet" data-printday="${i}" aria-label="הדפסת ההזמנות של היום" data-tip="הדפסת ההזמנות של היום">${ic('printer','sm','pop')}</button>` : ''}
        ${os.length > 2 ? `<button type="button" class="ibtn quiet" data-day="${i}" aria-label="פתיחת היום בחלון עם סינון" data-tip="חלון היום, עם סינון">${ic('expand','sm','pop')}</button>` : ''}</div>
      ${os.length ? `<div class="ag-list">${os.map(o => orderCard(o, true)).join('')}</div>` : `<div class="ag-empty">${ic('info','sm')}אין הזמנות היום.</div>`}</section>`;
  });
  if (!nowPlaced && DAYS[TODAY_I].mi === S.mi) out += `<div class="now-line" role="separator"><b>${ic('today','sm')}היום</b></div>`;
  return `<div class="agenda">${out}</div>`;
}

      d.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; d.querySelectorAll('[data-tab]').forEach(x => x.setAttribute('aria-selected', x === b)); drawF(d); });
      const sw = d.querySelector('#advAi'); if (sw) sw.onchange = () => { S.advAi = sw.checked; };
      d.querySelectorAll('[data-x]').forEach(b => b.onclick = () => closeLayer(layer, null));
      d.querySelector('[data-clear]').onclick = () => { Object.keys(S.adv).forEach(k => S.adv[k] = ''); drawF(d); render(); d.querySelector('#advLive').textContent = 'הלוח לא מסונן'; };
      d.querySelector('[data-apply]').onclick = () => { closeLayer(layer, 'x'); if (S.advAi && advCount()) runAi('הזמנות לפי השדות שמולאו'); };
    } });
}

/* ---------- חיפוש חכם (BD-32..34) ---------- */
function runAi(text){
  const f = $('#sForm'); const btn = f && f.querySelector('[type=submit]'); if (btn){ btn.disabled = true; btn.innerHTML = `${ic('loader','sm','loop')}מחפשים…`; }
  setTimeout(() => {
    if (serverFails()){ render(); alertDlg('החיפוש החכם לא הצליח', 'אין חיבור לשרת. נסו שוב בעוד רגע.', 'cloud-off'); return; }
    S.aiMode = true; S.aiText = text; render();
  }, 900);
}
function statsDlg(){
  openLayer({ type:'form', size:'m', html:`${dlgHead('chart', 'שאלות סטטיסטיקה', 'שאלה בשפה חופשית על ההזמנות.', 'סגירה')}
    <div class="dlg-b"><div class="hnote">${ic('info')}<span>זו חלונית שיחה משותפת (רכיב נפרד, מחוץ לתחום אב-הטיפוס). ${S.aiMode ? 'השאלה תתייחס גם לחיפוש החכם האחרון.' : ''}</span></div>
    <div class="field" style="margin-top:var(--v3-sp-4)"><label for="stQ">השאלה</label><textarea class="input" id="stQ" rows="3" placeholder="למשל: כמה הזמנות היו בתשרי?" data-autofocus></textarea></div><div id="stA"></div></div>
    <div class="dlg-f"><button type="button" class="btn primary" data-ask>${ic('send','','nudge')}שליחה</button><button type="button" class="btn quiet" data-x>סגירה</button></div>`,
    onMount(d, layer){ d.querySelectorAll('[data-x]').forEach(b => b.onclick = () => closeLayer(layer, null));
      d.querySelector('[data-ask]').onclick = () => { const v = d.querySelector('#stQ').value.trim(); if (!v){ d.querySelector('#stA').innerHTML = `<p class="ferr" role="alert">${ic('alert','sm')}צריך לכתוב שאלה</p>`; return; }
        d.querySelector('#stA').innerHTML = `<div class="appr-note" role="status">${ic('loader','sm','loop')}מחשבים…</div>`;
        setTimeout(() => { d.querySelector('#stA').innerHTML = serverFails() ? `<div class="errbox" role="alert">${ic('alert','lg')}<span>אין חיבור לשרת.</span></div>` : `<div class="okbox">${ic('chart','lg')}<span>בהדגמה: כאן תופיע התשובה, ולפעמים גם טבלה.</span></div>`; }, 800); }; } });
}
function jumpDlg(){
  openLayer({ type:'form', size:'s', html:`${dlgHead('cal', 'קפיצה לתאריך', 'בחירת יום עברי.', 'סגירה')}
    <div class="dlg-b"><div class="form-grid"><div class="field"><label for="jD">יום</label><select class="input" id="jD" data-autofocus>${GEM.map((g, k) => `<option value="${k + 1}">${g}</option>`).join('')}</select></div>
    <div class="field"><label for="jM">חודש</label><select class="input" id="jM">${MONTHS.map((m, k) => `<option value="${k}" ${k === S.mi ? 'selected' : ''}>${m.name} ${m.year}</option>`).join('')}</select></div></div>
    <p class="fhint">במימוש: בורר התאריך העברי המשותף.</p></div>
    <div class="dlg-f"><button type="button" class="btn primary" data-go>${ic('next','','nudge')}מעבר לתאריך</button><button type="button" class="btn quiet" data-x>ביטול</button></div>`,
    onMount(d, layer){ d.querySelectorAll('[data-x]').forEach(b => b.onclick = () => closeLayer(layer, null));
      d.querySelector('[data-go]').onclick = () => { const mi = +d.querySelector('#jM').value, dd = Math.min(+d.querySelector('#jD').value, MONTHS[mi].days); const i = DAYS.findIndex(x => x.mi === mi && x.d === dd);
        S.mi = mi; S.weekStart = weekStartOf(i); S.hl = i; closeLayer(layer, 'x'); render(); }; } });
}
function printWizard(){
  openLayer({ type:'form', size:'m', html:`${dlgHead('printer', 'הדפסת הזמנות להכנה', 'אשף ההדפסה המשותף (ארכיטיפ A3) — כאן בקיצור.', 'סגירה')}
    <div class="dlg-b"><div class="field"><span class="flbl" id="pwL">אילו הזמנות</span><div class="seg" role="radiogroup" aria-labelledby="pwL">
      <button type="button" role="radio" aria-checked="true" data-pm="prep">${ic('clock','sm')}להכנה היום</button><button type="button" role="radio" aria-checked="false" data-pm="event">${ic('cal','sm')}לפי תאריך אירוע</button></div></div>
    <p class="fhint" id="pwH" style="margin-top:var(--v3-sp-3)">הזמנות שצריך להכין היום (3 ימי עבודה לפני האירוע, בלי שישי, שבת וחגים).</p></div>
    <div class="dlg-f"><button type="button" class="btn primary" data-go>${ic('printer','','pop')}הדפסה</button><button type="button" class="btn quiet" data-x>ביטול</button></div>`,
    onMount(d, layer){ d.querySelectorAll('[data-x]').forEach(b => b.onclick = () => closeLayer(layer, null));
      d.querySelectorAll('[data-pm]').forEach(b => b.onclick = () => { d.querySelectorAll('[data-pm]').forEach(x => x.setAttribute('aria-checked', x === b)); d.querySelector('#pwH').textContent = b.dataset.pm === 'prep' ? 'הזמנות שצריך להכין היום (3 ימי עבודה לפני האירוע, בלי שישי, שבת וחגים).' : 'בוחרים תאריך אירוע אחד או טווח.'; });
      d.querySelector('[data-go]').onclick = () => { closeLayer(layer, 'x'); if (serverFails()) toast('err', 'ההדפסה לא הוכנה', 'אין חיבור לשרת'); else toast('ok', 'נמצאו 6 הזמנות להדפסה', 'נפתחת לשונית הדפסה'); }; } });
}

/* ---------- כרטיס השכרה (בקיצור; BD-50..59) ---------- */
function rentalDlg(o){
  const DRESS = ['שמלת ערב "ורד"', 'שמלת כלה "אלמוג"', 'שמלת שושבינה "טל"', 'שמלת ילדה "פנינה"'];
  const items = o.items.filter(i => !i.isDeleted).map((it, k) => ({ ...it, name: DRESS[k % 4], size: [36, 38, 40, 42][k % 4], barcode: it.isTaken ? String(10240 + k) + String([36, 38, 40, 42][k % 4]) + '07' : '', pending:false, bad:false }));
  const status = () => { const all = items.length; if (!all) return 'מחוק'; const r = items.filter(i => i.isReturned).length, t = items.filter(i => i.isTaken).length;
    if (r === all) return 'הוחזר'; if (r) return 'הוחזר חלקי'; if (t === all) return 'הושכר'; if (t) return 'הושכר חלקי'; return o.day < TODAY_I ? 'עבר' : 'בקרוב'; };
  const itStatus = i => i.isReturned ? (i.bad ? 'הוחזר — לא תקין' : 'הוחזר') : i.isTaken ? 'מושכר' : i.pending ? 'נסרק — ממתין לאישור' : 'ממתין';
  const pendingN = () => items.filter(i => i.pending).length;
  const draw = d => {
    d.querySelector('#rrSt').innerHTML = `<span class="chip ${/הוחזר/.test(status()) ? 'done' : /הושכר/.test(status()) ? 'info' : 'gold'}">${status()}</span>`;
    d.querySelector('#rrList').innerHTML = items.length ? items.map((i, k) => `<div class="rr-it ${i.pending ? 'pend' : ''}"><span class="it-thumb">${ic('dress')}</span><b>${i.name}</b>
      <span class="meta">מידה <bdi>${i.size}</bdi>${i.barcode ? ` · ברקוד <bdi dir="ltr">${i.barcode}</bdi>` : ''}</span>
      ${cfg.flag('enable_alterations') && i.alt ? `<span class="meta">${ic('scissors','sm')}תיקון: קיצור אורך</span>` : ''}
      <span class="acts"><span class="chip ${i.isReturned ? 'done' : i.isTaken ? 'info' : i.pending ? 'pend' : ''}">${itStatus(i)}</span>
      ${i.isReturned ? `<button type="button" class="btn sm quiet" data-undo-ret="${k}">${ic('undo','sm')}ביטול ההחזרה</button>` : i.isTaken ? `<button type="button" class="btn sm quiet" data-undo-rent="${k}">${ic('undo','sm')}ביטול ההשכרה</button>` : ''}
      <button type="button" class="ibtn quiet" data-hist="${k}" aria-label="היסטוריית הפריט" data-tip="היסטוריית הפריט">${ic('history','sm')}</button></span></div>`).join('') : `<div class="empty">${ic('bag','lg')}<b>אין פריטים בהזמנה</b></div>`;
    const c = d.querySelector('[data-confirm]'); c.disabled = !pendingN(); c.innerHTML = `${ic('check','','pop')}אישור ההשכרה${pendingN() ? ` (<bdi>${pendingN()}</bdi>)` : ''}`;
    d.querySelector('[data-discard]').hidden = !pendingN();
  };
  const html = `${dlgHead('box', `כרטיס השכרה · הזמנה <bdi>#${o.orderId}</bdi>`, `${esc(o.customerName)} · אירוע ${hebLabel(DAYS[o.day])}`, 'סגירה')}
    <div class="dlg-b"><div class="field"><span class="flbl">מצב ההזמנה</span><span id="rrSt"></span></div>
    <form class="scanbar" id="rrScan" style="margin-top:var(--v3-sp-4)"><label class="sr-only" for="rrB">ברקוד</label><input class="input" id="rrB" dir="ltr" inputmode="numeric" autocomplete="off" placeholder="סריקת ברקוד" data-autofocus>
      <button type="submit" class="btn primary">${ic('scan','','pop')}סריקה</button></form>
    <p class="fhint">ברקוד של פריט שבחוץ = החזרה. אחר = מסירה. בהדגמה: ברקוד שמתחיל ב-8 = פריט ממחסן (אישור מנהל); 9999 = בחוץ בהזמנה אחרת.</p>
    <div class="errbox" id="rrErr" role="alert" hidden></div>
    <div class="rr-items" id="rrList"></div></div>
    <div class="dlg-f"><button type="button" class="btn primary" data-confirm>אישור ההשכרה</button><button type="button" class="btn" data-discard>${ic('x','sm')}ביטול הסריקות</button><button type="button" class="btn quiet" data-x>סגירה</button></div>`;
  openLayer({ type:'form', size:'l', html, closeOnScrim:false, onMount(d, layer){
    draw(d); const err = m => { const e = d.querySelector('#rrErr'); e.hidden = !m; e.innerHTML = m ? `${ic('alert','lg')}<span>${m}</span>` : ''; };
    layer.onClose = async () => { if (!pendingN()) return true;
      const r = await confirmDlg({ icon:'alert', title:'יש סריקות שלא אושרו', text:`${pendingN()} פריטים נסרקו אבל ההשכרה לא אושרה.`, buttons:[{ label:'אישור ההשכרה וסגירה', kind:'primary', value:'c', auto:1, icon:'check' }, { label:'ביטול הסריקות וסגירה', value:'d' }, { label:'להישאר', kind:'quiet', value:'s' }] });
      if (r === 'c'){ items.forEach(i => { if (i.pending){ i.pending = false; i.isTaken = true; } }); toast('ok', 'ההשכרה אושרה'); return true; }
      if (r === 'd'){ items.forEach(i => { if (i.pending){ i.pending = false; i.barcode = ''; } }); return true; } return false; };
    d.querySelectorAll('[data-x]').forEach(b => b.onclick = () => closeLayer(layer, null));
    d.querySelector('#rrScan').onsubmit = async e => { e.preventDefault(); const inp = d.querySelector('#rrB'); const b = inp.value.replace(/\s/g, ''); err('');
      if (!b){ err('צריך לסרוק או להקליד ברקוד.'); inp.focus(); return; }
      if (serverFails()){ err('אין חיבור לשרת. הסריקה לא נשמרה.'); return; }
      const out = items.find(i => i.isTaken && !i.isReturned && i.barcode === b);
      if (out){ if (TODAY_I - o.day >= 7){ const r = await confirmDlg({ icon:'late', title:'ההחזרה מאחרת', text:'הפריט חוזר אחרי המועד. לסמן אותו "לא תקין"?', buttons:[{ label:'לסמן לא תקין', kind:'primary', value:'bad' }, { label:'להחזיר כרגיל', value:'ok', auto:1 }, { label:'ביטול', kind:'quiet', value:null }] }); if (!r) return; out.bad = r === 'bad'; }
        out.isReturned = true; inp.value = ''; draw(d); toast('ok', 'הפריט הוחזר', out.name); render(); return; }
      if (b === '9999'){ const r = await confirmDlg({ icon:'alert', title:'השמלה עדיין בחוץ', text:'הפריט רשום כמושכר בהזמנה אחרת. להחזיר אותו שם קודם?', buttons:[{ label:'החזרה בהזמנה האחרת', kind:'primary', value:'y' }, { label:'ביטול', kind:'quiet', value:'n', auto:1 }] }); if (r !== 'y') return; }
      if (b[0] === '8'){ const ok = await codeDlg('הפריט נמצא במחסן. צריך אישור מנהל כדי למסור אותו.', { fail:serverFails }); if (!ok) return; }
      const free = items.find(i => !i.isTaken && !i.pending);
      if (!free){ err('הפריט לא קיים בהזמנה הזו (הדגם או המידה לא מתאימים).'); inp.select(); return; }
      free.pending = true; free.barcode = b; inp.value = ''; draw(d); inp.focus(); };
    d.querySelector('[data-confirm]').onclick = async () => {
      const left = items.filter(i => !i.isTaken && !i.pending).length;
      if (left && (await confirmDlg({ icon:'alert', title:'לא כל הפריטים נסרקו', text:`${left} פריטים עוד לא נסרקו. לאשר רק את מה שנסרק?`, buttons:[{ label:'אישור מה שנסרק', kind:'primary', value:'y' }, { label:'ביטול', kind:'quiet', value:'n', auto:1 }] })) !== 'y') return;
      items.forEach(i => { if (i.pending){ i.pending = false; i.isTaken = true; } }); o.items.forEach((it, k) => { if (items[k]) Object.assign(it, { isTaken:items[k].isTaken, isReturned:items[k].isReturned }); });
      draw(d); render(); toast('ok', 'ההשכרה אושרה', 'הלוח עודכן'); };
    d.querySelector('[data-discard]').onclick = () => { items.forEach(i => { if (i.pending){ i.pending = false; i.barcode = ''; } }); draw(d); };
    d.querySelector('#rrList').onclick = async e => { const t = e.target.closest('button'); if (!t) return;
      if (t.dataset.undoRet){ items[+t.dataset.undoRet].isReturned = false; draw(d); toast('info', 'ההחזרה בוטלה'); }
      if (t.dataset.undoRent){ const r = await confirmDlg({ icon:'undo', title:'לבטל את ההשכרה?', text:'הפריט יחזור למצב "ממתין" והברקוד יימחק מההזמנה.', buttons:[{ label:'ביטול ההשכרה', kind:'primary', value:'y' }, { label:'להשאיר', kind:'quiet', value:'n', auto:1 }] }); if (r === 'y'){ const i = items[+t.dataset.undoRent]; i.isTaken = false; i.barcode = ''; draw(d); } }
      if (t.dataset.hist) openLayer({ type:'viewer', size:'s', html:`${dlgHead('history', 'היסטוריית הפריט', items[+t.dataset.hist].name, 'סגירה')}<div class="dlg-b"><div class="hnote">${ic('info')}<span>רשימת פעולות על הפריט (מסירה, החזרה, ביטולים). פירוט מלא — בחוזה כרטיס ההשכרה.</span></div></div><div class="dlg-f"><button type="button" class="btn quiet" data-x>סגירה</button></div>`, onMount(dd, l){ dd.querySelectorAll('[data-x]').forEach(b => b.onclick = () => closeLayer(l, null)); } });
    };
  } });
}

/* ---------- האזנה ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('button,a'); if (!b) return;
  if (b.dataset.order){ const o = findOrder(b.dataset.order); orderMenu(o, b); return; }
  if (b.dataset.info){ detailsDlg(findOrder(b.dataset.info)); return; }
  if (b.closest('#layer-root') || b.closest('.demo')) return;
  if (b.dataset.view){ S.view = b.dataset.view; if (S.view === 'week' && DAYS[S.weekStart].mi !== S.mi) S.weekStart = weekStartOf(DAYS.findIndex(x => x.mi === S.mi)); render(); return; }
  if (b.dataset.day){ dayDlg(+b.dataset.day); return; }
  if (b.dataset.printday){ printDay(+b.dataset.printday); return; }
  const a = b.dataset.act; if (!a) return;
  if (a === 'prev' || a === 'next'){ const dlt = a === 'next' ? 1 : -1; S.hl = -1;
    if (S.view === 'week'){ const n = S.weekStart + 7 * dlt; if (n < 0 || n >= DAYS.length){ toast('info', 'אין נתוני דמה לתקופה הזו', '', 2600); return; } S.weekStart = n; S.mi = DAYS[n].mi; }
    else { const n = S.mi + dlt; if (n < 0 || n >= MONTHS.length){ toast('info', 'אין נתוני דמה לחודש הזה', 'בהדגמה יש 3 חודשים', 2600); return; } S.mi = n; }
    render(); $(`[data-act=${a}]`)?.focus(); }
  if (a === 'today'){ S.mi = DAYS[TODAY_I].mi; S.weekStart = weekStartOf(TODAY_I); S.hl = -1; render();
    if (S.view === 'list') document.querySelector('.now-line')?.scrollIntoView({ block:'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
  if (a === 'legend'){ S.legendOpen = !S.legendOpen; render(); $('[data-act=legend]').focus(); }
  if (a === 'jump') jumpDlg();
  if (a === 'print') printWizard();
  if (a === 'global') globalDlg();
  if (a === 'adv') advDlg();
  if (a === 'stats') statsDlg();
  if (a === 'toggleAi'){ const cur = $('#sq').value; if (S.ai) S.draft = cur; else S.aiText = cur; S.ai = !S.ai; /* המעבר שומר את הטקסט (BD-32) */ render(); $('#sq').focus(); }
  if (a === 'clearSearch'){ S.search = ''; S.draft = null; S.aiText = ''; S.aiMode = false; render(); $('#sq')?.focus(); }
  if (a === 'clearAll'){ S.search = ''; Object.keys(S.adv).forEach(k => S.adv[k] = ''); render(); }
  if (a === 'retry'){ S.load = 'loading'; $('#dLoad').value = 'loading'; render(); setTimeout(() => { S.load = 'ok'; $('#dLoad').value = 'ok'; render(); }, 900); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'sForm') return; e.preventDefault(); const v = $('#sq').value.trim();
  if (S.ai){ if (!v) return; runAi(v); } else { S.search = v; S.draft = null; S.aiMode = false; render(); $('#sq').focus(); }
});

/* ---------- בקרת הדגמה ---------- */
function applyProfile(){ const p = PROFILES[$('#dProfile').value]; S.profile = $('#dProfile').value; cfg.s = { ...p.s };
  $('#dAlt').checked = cfg.flag('enable_alterations'); $('#dSpacing').checked = cfg.flag('hide_custom_spacing'); $('#dPrint').checked = cfg.flag('enable_batch_print_prep'); }
$('#dProfile').onchange = () => { applyProfile(); buildOrders(); render(); };
$('#dAlt').onchange = e => { cfg.s.enable_alterations = String(e.target.checked); render(); };
$('#dSpacing').onchange = e => { cfg.s.hide_custom_spacing = String(e.target.checked); render(); };
$('#dPrint').onchange = e => { cfg.s.enable_batch_print_prep = String(e.target.checked); render(); };
$('#dHideTaken').onchange = e => { S.hideTaken = e.target.checked; render(); };
$('#dAi').onchange = e => { S.aiAvail = e.target.checked; if (!S.aiAvail){ S.ai = false; S.aiMode = false; } render(); };
$('#dData').onchange = e => { S.data = e.target.value; buildOrders(); if (S.data === 'busy'){ S.mi = 1; } render(); };
$('#dLoad').onchange = e => { S.load = e.target.value; render(); };
$('#dMotion').onchange = e => { if (e.target.checked) document.documentElement.setAttribute('data-motion', 'reduced'); else document.documentElement.removeAttribute('data-motion'); };
$('#dTheme').onclick = e => { UI.dark = !UI.dark; e.currentTarget.setAttribute('aria-pressed', UI.dark); e.currentTarget.textContent = `חלוניות אישור/קוד/צפייה: ${UI.dark ? 'כהה' : 'בהיר'}`; toast('info', `חלוניות אישור, קוד וצפייה: ${UI.dark ? 'כהות' : 'בהירות'}`, 'חלון הזנת מידע נשאר בהיר תמיד', 2600); };
document.querySelectorAll('[data-demo]').forEach(b => b.onclick = () => {
  if (b.dataset.demo === 'code') codeDlg('דוגמה: מסירת פריט ממחסן.', { fail:serverFails });
  if (b.dataset.demo === 'toast') toast('ok', 'ההשכרה אושרה', 'הלוח עודכן');
  if (b.dataset.demo === 'notice') notice('success', 'ההזמנה נשמרה', 'חזרתם ללוח; הפס הזהוב יורד במשך 15 שניות', { label:'פתיחת ההזמנה', run(){ toast('info', 'נפתחת ההזמנה', 'בהדגמה: אין מעבר', 2600); } });
});
bindBurger(NAV, 'לוח');
applyProfile(); buildOrders(); render();
