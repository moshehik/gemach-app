<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הפרופיל שלי · אב-טיפוס A7</title>
<meta name="description" content="אב-טיפוס סטטי לאישור: ארכיטיפ טופס/הגדרות (A7) על עמוד הפרופיל, בשפת סקיצה B. נתוני דמה בלבד, בלי API.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* TOKENS — אותם שמות וערכים כמו A2/A6. עמודים בהירים בלבד; כהה רק על שכבה צפה. */
:root{
  --v3-navy-900:#0a2242; --v3-navy-800:#0f2c52; --v3-navy-700:#173c6b; --v3-navy-500:#2b5a94;
  --v3-sky-50:#f3f9fe; --v3-sky-100:#e4f1fb; --v3-sky-200:#cfe6f7; --v3-sky-300:#a9d2f0; --v3-sky-400:#7fb8e6;
  --v3-gold-100:#fbf1d3; --v3-gold-300:#e0c56e; --v3-gold-500:#c9a227; --v3-gold-600:#b8912f; --v3-gold-700:#9a7a1f; --v3-gold-800:#6f560f;
  --v3-rose-50:#fff6f2; --v3-rose-100:#ffece5; --v3-rose-200:#fdd9cc; --v3-rose-300:#fbbfa9; --v3-rose-500:#fa9e84; --v3-rose-700:#a8442a;
  --v3-plum:#a83d6c; --v3-peri:#8fa6e8;
  --v3-bg:var(--v3-sky-200); --v3-surface:#fff; --v3-surface-2:var(--v3-sky-50); --v3-surface-3:var(--v3-sky-100);
  --v3-line:var(--v3-sky-300); --v3-line-soft:var(--v3-sky-100); --v3-frame:var(--v3-navy-800); --v3-frame-soft:rgba(15,44,82,.22);
  --v3-ink:var(--v3-navy-900); --v3-ink-2:#2f4a6b; --v3-ink-3:#4d6787;
  --v3-brand:var(--v3-navy-800); --v3-brand-tint:var(--v3-sky-100);
  --v3-accent:linear-gradient(135deg,#d9b84a 0%,#b8912f 100%); --v3-accent-ink:#000; --v3-link:var(--v3-navy-500);
  --v3-scrim:rgba(10,34,66,.45); --v3-scrim-strong:rgba(10,34,66,.6);
  --v3-pending-bg:var(--v3-rose-50); --v3-pending-line:var(--v3-rose-500);
  --v3-disabled-bg:var(--v3-sky-100); --v3-disabled-ink:var(--v3-ink-3); --v3-disabled-line:var(--v3-sky-200);
  --v3-on-dark:#fff; --v3-on-dark-2:#c9daee; --v3-on-dark-3:#9fb6d2;
  --v3-topbar-bg:var(--v3-navy-900); --v3-tooltip-bg:var(--v3-navy-900);
  --v3-font:"Rubik","Heebo",system-ui,sans-serif;
  --v3-fs-cap:12px; --v3-fs-2xs:13px; --v3-fs-sm:14px; --v3-fs-base:16px; --v3-fs-md:17px; --v3-fs-lg:18px; --v3-fs-xl:20px; --v3-fs-2xl:24px; --v3-fs-h1:28px;
  --v3-sp-1:4px; --v3-sp-2:8px; --v3-sp-3:12px; --v3-sp-4:16px; --v3-sp-5:24px; --v3-sp-6:32px; --v3-sp-7:40px;
  --v3-r-sm:10px; --v3-r-md:12px; --v3-r-btn:14px; --v3-r-lg:16px; --v3-r-xl:20px; --v3-r-dlg:24px; --v3-r-pill:999px;
  --v3-el-1:0 1px 2px rgba(15,44,82,.06),0 8px 24px -10px rgba(15,44,82,.22);
  --v3-el-3:0 12px 32px -10px rgba(10,34,66,.35); --v3-el-4:0 24px 60px -12px rgba(10,34,66,.5);
  --v3-z-sticky:10; --v3-z-topbar:40; --v3-z-drawer:80; --v3-z-layer:100; --v3-z-notice:300; --v3-z-toast:310; --v3-z-tip:400; --v3-z-dev:500;
  --v3-fast:150ms; --v3-base:220ms; --v3-med:300ms; --v3-enter:450ms;
  --v3-ease:cubic-bezier(.22,1,.36,1); --v3-spring:cubic-bezier(.2,1.3,.3,1);
  --v3-notice-ms:15000ms;
  --v3-topbar-h:64px; --v3-w-content:1240px; --v3-w-read:720px; --v3-tap:44px; --v3-tap-dlg:48px;
  --v3-fs-h1-cur:var(--v3-fs-h1);
}
@media (max-width:640px){ :root{ --v3-topbar-h:58px; --v3-fs-h1-cur:23px; } }

*,*::before,*::after{box-sizing:border-box}
html{scrollbar-gutter:stable;background:var(--v3-bg)}
html[data-v3-lock]{overflow:hidden}
*{scrollbar-width:thin;scrollbar-color:var(--v3-line) transparent}
body{margin:0;font-family:var(--v3-font);font-size:var(--v3-fs-base);line-height:1.6;color:var(--v3-ink);background:var(--v3-bg);min-height:100dvh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
bdi{unicode-bidi:isolate}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--v3-navy-800);outline-offset:2px;box-shadow:0 0 0 6px var(--v3-gold-300);border-radius:6px}
[hidden]{display:none!important}

.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle}
.ic.sm{width:16px;height:16px}.ic.lg{width:24px;height:24px}.ic.xl{width:32px;height:32px}.ic.xxl{width:48px;height:48px}
@keyframes ia-nudge{0%,100%{transform:none}50%{transform:translateX(-4px)}}
@keyframes ia-nudge-back{0%,100%{transform:none}50%{transform:translateX(4px)}}
@keyframes ia-spin{to{transform:rotate(-360deg)}}
@keyframes ia-pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:none}}
@keyframes ia-wig{0%,100%{transform:none}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes ia-rise{0%,100%{transform:none}50%{transform:translateY(-3px)}}
@keyframes ia-loop{to{transform:rotate(360deg)}}
@keyframes ia-draw{from{stroke-dashoffset:30}}
:is(button,a,label,summary):is(:hover,:focus-visible,:focus-within):not(:disabled) .ic[data-a=nudge]{animation:ia-nudge .6s var(--v3-ease)}
:is(button,a,label,summary):is(:hover,:focus-visible):not(:disabled) .ic[data-a=back]{animation:ia-nudge-back .6s var(--v3-ease)}
:is(button,a,label,summary):is(:hover,:focus-visible):not(:disabled) .ic[data-a=spin]{animation:ia-spin .6s var(--v3-ease)}
:is(button,a,label,summary):is(:hover,:focus-visible,:focus-within):not(:disabled) .ic[data-a=pop]{animation:ia-pop .45s var(--v3-spring)}
:is(button,a,label,summary):is(:hover,:focus-visible):not(:disabled) .ic[data-a=wig]{animation:ia-wig .5s var(--v3-ease)}
:is(button,a,label,summary):is(:hover,:focus-visible,:focus-within):not(:disabled) .ic[data-a=rise]{animation:ia-rise .5s var(--v3-ease)}
.ic[data-a=loop]{animation:ia-loop 1s linear infinite}
.ic.draw{stroke-dasharray:30;animation:ia-draw .5s var(--v3-ease)}
.ic.enter{animation:ia-pop .45s var(--v3-spring)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
html[data-motion=reduced] *,html[data-motion=reduced] *::before,html[data-motion=reduced] *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--v3-tap);padding:10px 18px;border-radius:var(--v3-r-btn);border:1.5px solid var(--v3-rose-500);background:var(--v3-rose-200);color:#000;font-weight:500;white-space:nowrap;transition:background-color var(--v3-fast),color var(--v3-fast),border-color var(--v3-fast),transform var(--v3-fast)}
.btn:hover{background:var(--v3-navy-800);border-color:var(--v3-navy-800);color:#fff;transform:translateY(-1px)}
.btn.primary{background:var(--v3-accent);border-color:var(--v3-gold-700);color:var(--v3-accent-ink);font-weight:600;box-shadow:0 6px 16px -8px rgba(15,44,82,.6)}
.btn.primary:hover{background:var(--v3-navy-800);color:#fff}
.btn.quiet{background:transparent;border-color:var(--v3-frame-soft)}
.btn.quiet:hover{background:var(--v3-navy-800);color:#fff}
.btn.lg{min-height:52px;padding:12px 24px;font-size:var(--v3-fs-md);border-radius:var(--v3-r-lg)}
.btn.sm{min-height:44px;padding:6px 12px;font-size:var(--v3-fs-sm);border-radius:var(--v3-r-sm)}
.btn:disabled,.btn:disabled:hover{background:var(--v3-disabled-bg);color:var(--v3-disabled-ink);border-color:var(--v3-disabled-line);box-shadow:none;transform:none;cursor:not-allowed}
.ibtn{width:var(--v3-tap);height:var(--v3-tap);display:inline-grid;place-items:center;border-radius:var(--v3-r-btn);border:1.5px solid var(--v3-rose-500);background:var(--v3-rose-200);color:#000;flex:none;transition:background-color var(--v3-fast),color var(--v3-fast)}
.ibtn:hover{background:var(--v3-navy-800);color:#fff;border-color:var(--v3-navy-800)}
.ibtn.quiet{background:transparent;border-color:transparent;color:var(--v3-ink-2)}
.ibtn.quiet:hover{background:var(--v3-surface-3);color:var(--v3-ink)}
.ibtn.round{border-radius:50%;width:48px;height:48px;background:var(--v3-surface);border:1px solid var(--v3-line);box-shadow:var(--v3-el-1)}
.ibtn.round:hover{background:var(--v3-navy-800);color:#fff}
.tip{width:var(--v3-tap);height:var(--v3-tap);margin:-10px;display:inline-grid;place-items:center;border:0;background:none;color:var(--v3-ink-3);border-radius:50%;flex:none}
.tip:hover,.tip:focus-visible{color:var(--v3-navy-800)}

/* סרגל עליון */
.topbar{position:sticky;top:0;z-index:var(--v3-z-topbar);height:var(--v3-topbar-h);background:var(--v3-topbar-bg);color:var(--v3-on-dark);display:flex;align-items:center;gap:var(--v3-sp-3);padding:0 var(--v3-sp-5);padding-top:env(safe-area-inset-top);border-bottom:3px solid var(--v3-gold-500)}
.tb-brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;flex:none;min-height:44px}
.tb-mark{width:40px;height:40px;border-radius:12px;background:var(--v3-accent);color:#000;display:grid;place-items:center}
.tb-name{font-weight:700;font-size:var(--v3-fs-lg)}
.tb-nav{display:flex;gap:4px;flex:1;min-width:0;justify-content:center}
.tb-nav a{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:12px;color:var(--v3-on-dark-2);text-decoration:none;font-weight:500;white-space:nowrap}
.tb-nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.tb-act{display:flex;align-items:center;gap:6px;flex:none;margin-inline-start:auto}
.tb-user{display:flex;align-items:center;gap:8px;height:44px;min-width:44px;justify-content:center;padding:0 6px 0 12px;border-radius:22px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;max-width:240px}
.tb-user .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-av{width:32px;height:32px;border-radius:50%;background:var(--v3-accent);color:#000;display:grid;place-items:center;font-weight:700;flex:none;overflow:hidden}
.tb-av img{width:100%;height:100%;object-fit:cover}
.tb-ib{width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:#fff;display:none;place-items:center}
@media (max-width:1023px){.tb-nav{display:none}.tb-ib{display:grid}.tb-user .n{display:none}}
@media (max-width:640px){.topbar{padding:0 var(--v3-sp-3)}.tb-name{font-size:var(--v3-fs-base)}.tb-user{padding:0 4px;border:0;background:transparent}}
.drawer{position:fixed;inset-block:0;inset-inline-start:0;width:min(88vw,360px);background:var(--v3-navy-900);color:#fff;z-index:var(--v3-z-drawer);padding:var(--v3-sp-4);display:flex;flex-direction:column;gap:6px;box-shadow:var(--v3-el-4);animation:dr-in var(--v3-med) var(--v3-ease)}
@keyframes dr-in{from{transform:translateX(100%)}}
.drawer a{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 14px;border-radius:12px;color:var(--v3-on-dark-2);text-decoration:none}
.drawer-scrim{position:fixed;inset:0;background:var(--v3-scrim);z-index:calc(var(--v3-z-drawer) - 1)}

/* NoticeBar עליון */
.notice-area{position:sticky;top:var(--v3-topbar-h);z-index:var(--v3-z-notice);max-width:var(--v3-w-content);margin:0 auto;padding:0 var(--v3-sp-5)}
.notice-area:empty{display:none}
.notice{position:relative;margin-top:var(--v3-sp-2);background:var(--v3-navy-800);color:#fff;border-radius:var(--v3-r-lg);box-shadow:var(--v3-el-4);overflow:hidden;animation:nb-in var(--v3-med) var(--v3-ease)}
@keyframes nb-in{from{transform:translateY(-14px)}}
.notice.is-leaving{opacity:0;transform:translateY(-10px);transition:opacity 200ms,transform 200ms}
.nb-main{display:flex;align-items:center;gap:14px;padding:12px 16px}
.nb-ic{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--v3-sky-100);color:var(--v3-navy-800);border:2px solid var(--v3-gold-300)}
.nb-msg{flex:1;min-width:0;display:flex;flex-direction:column}
.nb-msg b{font-weight:700}
.nb-msg span{font-size:var(--v3-fs-sm);color:var(--v3-on-dark-2);overflow-wrap:anywhere}
.nb-x{width:44px;height:44px;border-radius:10px;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;flex:none}
.nb-x:hover{background:rgba(255,255,255,.24)}
.nb-timer{height:4px;background:var(--v3-accent);transform-origin:right center;animation:nb-t var(--v3-notice-ms) linear forwards}
.notice:is(:hover,:focus-within) .nb-timer{animation-play-state:paused}
@keyframes nb-t{from{transform:scaleX(1)}to{transform:scaleX(0)}}
html[data-motion=reduced] .nb-timer{animation-duration:var(--v3-notice-ms)!important}
@media (prefers-reduced-motion:reduce){.nb-timer{animation-duration:var(--v3-notice-ms)!important}}
@media (max-width:640px){.notice-area{padding:0 var(--v3-sp-3)}}

/* מעטפת A7: עמודה אחת ברוחב קריאה; ב-≥1024 תוכן עניינים צדדי */
.page{max-width:var(--v3-w-content);margin:0 auto;padding:var(--v3-sp-5) var(--v3-sp-5) calc(var(--v3-sp-7) + 96px)}
@media (max-width:640px){.page{padding:var(--v3-sp-4) var(--v3-sp-4) calc(var(--v3-sp-7) + 120px)}}
.a7{display:grid;grid-template-columns:minmax(0,var(--v3-w-read));justify-content:center;gap:var(--v3-sp-6)}
@media (min-width:1024px){.a7{grid-template-columns:220px minmax(0,var(--v3-w-read))}}
.toc{display:none}
@media (min-width:1024px){.toc{display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(var(--v3-topbar-h) + 24px);align-self:start}}
.toc h2{margin:0 0 6px;font-size:var(--v3-fs-sm);color:var(--v3-ink-3);font-weight:500}
.toc a{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:12px;color:var(--v3-ink-2);text-decoration:none;font-weight:500}
.toc a:hover{background:var(--v3-surface);color:var(--v3-ink)}
.toc a .pd{width:10px;height:10px;border-radius:50%;border:2px dashed var(--v3-rose-700);background:var(--v3-rose-200);margin-inline-start:auto}
.col{display:flex;flex-direction:column;gap:var(--v3-sp-5);min-width:0}

.pagehead{display:flex;align-items:flex-start;gap:var(--v3-sp-4)}
.ph-ttl{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.ph-ttl h1{margin:0;font-size:var(--v3-fs-h1-cur);line-height:1.25;font-weight:700;display:flex;align-items:center;gap:8px}
.ph-ttl p{margin:0;color:var(--v3-ink-2)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:2px 12px;border-radius:var(--v3-r-pill);font-size:var(--v3-fs-2xs);font-weight:500;background:var(--v3-surface-3);color:var(--v3-ink-2);border:1px solid var(--v3-line);max-width:100%;align-self:flex-start}
.chip .ic{width:14px;height:14px}
.chip.info{background:var(--v3-brand-tint);color:var(--v3-navy-800)}
.chip .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.pend{background:var(--v3-pending-bg);border:1.5px dashed var(--v3-pending-line);color:var(--v3-rose-700)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.how div{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--v3-r-lg);background:var(--v3-surface-2);border:1px solid var(--v3-line);font-size:var(--v3-fs-sm);color:var(--v3-ink-2)}
.how b{display:block;color:var(--v3-ink);font-size:var(--v3-fs-base)}

.card{background:var(--v3-surface);border:1px solid var(--v3-frame-soft);border-radius:var(--v3-r-lg);box-shadow:var(--v3-el-1);padding:var(--v3-sp-5);scroll-margin-top:calc(var(--v3-topbar-h) + 16px)}
@media (max-width:640px){.card{padding:var(--v3-sp-4)}}
.card-h{display:flex;align-items:center;gap:12px;margin-bottom:var(--v3-sp-4)}
.card-h .ico{width:44px;height:44px;border-radius:14px;background:var(--v3-rose-100);color:var(--v3-rose-700);display:grid;place-items:center;flex:none;border:1px solid var(--v3-rose-300)}
.card-h h2{margin:0;font-size:var(--v3-fs-lg);font-weight:600;flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card.has-change{border:1.5px dashed var(--v3-pending-line)}

.form{display:flex;flex-direction:column;gap:var(--v3-sp-4)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.flbl{font-size:var(--v3-fs-sm);color:var(--v3-ink-2);font-weight:500;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.input{min-height:48px;border:1.5px solid var(--v3-line);border-radius:var(--v3-r-md);padding:10px 14px;background:var(--v3-surface);font-size:var(--v3-fs-md);width:100%;transition:border-color var(--v3-fast)}
.input:hover{border-color:var(--v3-sky-400)}
.input:focus{outline:none;border-color:var(--v3-navy-800);box-shadow:0 0 0 4px var(--v3-gold-300)}
.field.is-changed .input{border-style:dashed;border-color:var(--v3-pending-line);background:var(--v3-pending-bg)}
.field.is-err .input{border-color:var(--v3-gold-600);border-width:2px}
.ferr{color:var(--v3-plum);font-size:var(--v3-fs-sm);display:flex;align-items:center;gap:6px}
.fhint{color:var(--v3-ink-3);font-size:var(--v3-fs-sm)}
.was{font-size:var(--v3-fs-sm);color:var(--v3-ink-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.was s{overflow-wrap:anywhere}
.ro{display:grid;grid-template-columns:28px minmax(0,1fr);gap:2px 12px;padding:12px 14px;border-radius:var(--v3-r-md);background:var(--v3-surface-2);border:1px solid var(--v3-line-soft)}
.ro>.ic{margin-top:3px;color:var(--v3-ink-3)}
.ro .l{font-size:var(--v3-fs-sm);color:var(--v3-ink-3);display:flex;align-items:center;gap:4px}
.ro .v{grid-column:2;font-size:var(--v3-fs-md);font-weight:500}
.pw{display:flex;gap:8px;align-items:center}
.pw .input{flex:1;min-width:0}
.pw.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.switch{display:flex;align-items:center;gap:12px;min-height:48px;cursor:pointer;border-radius:var(--v3-r-md);padding:0 12px;margin-inline:-12px}
.switch input{appearance:none;width:52px;height:30px;border-radius:15px;background:var(--v3-sky-300);position:relative;flex:none;border:1.5px solid var(--v3-navy-500);cursor:pointer;transition:background-color var(--v3-fast)}

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic = (n, cls = '', anim = '') => `<svg class="ic ${cls}"${anim ? ` data-a="${anim}"` : ''} aria-hidden="true"><use href="#i-${n}"/></svg>`;
const tip = t => `<button type="button" class="tip" data-tip="${esc(t)}" aria-label="הסבר: ${esc(t)}">${ic('info','sm')}</button>`;

/* ===== שכבות ===== */
const layers = [];
function lockSync(){ document.documentElement.toggleAttribute('data-v3-lock', layers.length > 0); ['.topbar','#demo','#page','#savebar','#noticeArea'].forEach(s => { const el = $(s); if (el) el.inert = layers.length > 0; }); layers.forEach((l, i) => { l.el.inert = i !== layers.length - 1; }); }
function confirmDlg({ icon = 'alert', title, text, buttons, danger = false }){
  const scrim = document.createElement('div'); scrim.className = 'scrim sheet'; scrim.style.zIndex = 100 + layers.length * 10;
  scrim.innerHTML = `<div class="dlg" data-v3-mode="${S.dark ? 'dark' : 'light'}" role="${danger ? 'alertdialog' : 'dialog'}" aria-modal="true" aria-labelledby="dt${layers.length}" aria-describedby="dd${layers.length}"><div class="dlg-h"><span class="dlg-badge">${ic(icon,'lg enter')}</span><h2 id="dt${layers.length}">${esc(title)}</h2>${text ? `<p id="dd${layers.length}">${esc(text)}</p>` : ''}</div>
    <div class="dlg-f">${buttons.map(b => `<button type="button" class="btn ${b.kind || ''}" data-r="${b.value}" ${b.auto ? 'data-autofocus' : ''}>${b.icon ? ic(b.icon,'',b.anim || 'pop') : ''}${esc(b.label)}</button>`).join('')}</div></div>`;
  const layer = { el:scrim, trigger:document.activeElement }; let res; const p = new Promise(r => res = r);
  const close = v => { const i = layers.indexOf(layer); if (i < 0) return; layers.splice(i, 1); scrim.classList.add('is-leaving'); setTimeout(() => scrim.remove(), 200); lockSync(); res(v); if (layer.trigger && document.contains(layer.trigger)) layer.trigger.focus(); };
  layer.close = close;
  scrim.addEventListener('mousedown', e => { if (e.target === scrim && !danger) close(null); });
  scrim.querySelectorAll('[data-r]').forEach(b => b.onclick = () => close(b.dataset.r));
  $('#layer-root').appendChild(scrim); layers.push(layer); lockSync();
  (scrim.querySelector('[data-autofocus]') || scrim.querySelector('button')).focus();
  return p;
}
document.addEventListener('keydown', e => {
  const top = layers[layers.length - 1];
  if (e.key === 'Escape' && top){ e.preventDefault(); top.close(null); return; }
  if (e.key === 'Tab' && top){ const f = [...top.el.querySelectorAll('button:not(:disabled)')]; if (!f.length) return; const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); } }
});

/* ===== Toast + NoticeBar ===== */
function toast(kind, title, text, ms = 6500, action){
  const box = $('#toasts'); while (box.children.length >= 3) box.firstElementChild.remove();
  const t = document.createElement('div'); t.className = `toast ${kind === 'err' ? 'err' : ''}`; if (kind === 'err') t.setAttribute('role', 'alert');
  t.style.setProperty('--t-ms', ms + 'ms');
  t.innerHTML = `<span class="t-ic">${ic(kind === 'err' ? 'alert' : kind === 'info' ? 'info' : 'check','lg enter')}</span><span class="t-t"><b>${esc(title)}</b>${text ? `<small>${esc(text)}</small>` : ''}</span>${action ? `<button type="button" class="btn sm" data-ta>${ic('refresh','sm','spin')}${esc(action.label)}</button>` : ''}<button type="button" class="t-x" aria-label="סגירת ההודעה">${ic('x','sm')}</button><span class="t-bar" aria-hidden="true"></span>`;
  const kill = () => { t.classList.add('is-leaving'); setTimeout(() => t.remove(), 200); };
  t.querySelector('.t-x').onclick = kill; t.querySelector('.t-bar').addEventListener('animationend', kill);
  if (action) t.querySelector('[data-ta]').onclick = () => { kill(); action.run(); };
  box.appendChild(t);
}
function notice(title, text){
  const area = $('#noticeArea'); area.innerHTML = '';
  const n = document.createElement('div'); n.className = 'notice'; n.setAttribute('role', 'status');
  n.innerHTML = `<div class="nb-main"><span class="nb-ic">${ic('check','draw')}</span><div class="nb-msg"><b>${esc(title)}</b>${text ? `<span>${esc(text)}</span>` : ''}</div><button type="button" class="nb-x" aria-label="סגירת ההודעה">${ic('x','sm')}</button></div><div class="nb-timer" aria-hidden="true"></div>`;
  const kill = () => { n.classList.add('is-leaving'); setTimeout(() => n.remove(), 200); };
  n.querySelector('.nb-x').onclick = kill; n.querySelector('.nb-timer').addEventListener('animationend', kill);
  area.appendChild(n);
}

/* ===== פעולות ===== */
function validate(){ /* רק מה שהדפדפן כבר אוכף היום (FM-23): מבנה מייל של type=email. אין שדות חובה (FM-21). */
  const e = {}; const probe = $('#emailProbe'); probe.value = S.cur.email || '';
  if (S.cur.email && probe.validity.typeMismatch) e.email = 'כתובת המייל לא תקינה. בדקו שיש בה @ ושם אתר.';
  return e;
}
async function save(){
  S.errors = validate();
  if (Object.keys(S.errors).length){ render(); const k = Object.keys(S.errors)[0]; $('#f-' + k).focus(); toast('err', 'אי אפשר לשמור עדיין', 'יש שדה אחד לתיקון', 6500); return false; }
  S.saving = true; renderSavebar(changed()); await sleep(800); S.saving = false;
  const fm = failMode();
  if (fm){ renderSavebar(changed()); /* המימוש: 401/403 = "צריך להתחבר"; שגיאה אחרת מהשרת = "השמירה לא הצליחה"; חריגה (fetch נכשל) = "אין חיבור" */
    if (fm === 'session') toast('err', 'צריך להתחבר מחדש', 'החיבור שלך הסתיים. השינויים עדיין כאן. מתחברים ושומרים שוב.', 6500, { label:'התחברות', run:() => toast('info', 'נפתח חלון הכניסה', 'בהדגמה נשארים כאן', 2600) });
    else if (fm === 'network') toast('err', 'אין חיבור לשרת', 'השינויים שלך עדיין כאן. בודקים את החיבור ומנסים שוב.', 6500, { label:'לנסות שוב', run:save });
    else toast('err', 'השמירה לא הצליחה', 'תקלה בשרת. השינויים שלך עדיין כאן.', 6500, { label:'לנסות שוב', run:save });
    return false; }
  const n = changed().length; S.orig = JSON.parse(JSON.stringify(S.cur)); render();
  notice('הפרטים נשמרו', n ? `${n === 1 ? 'עודכן פרט אחד' : `עודכנו ${n} פרטים`}. השם והתמונה בסרגל העליון התעדכנו.` : 'הפרטים נשלחו לשמירה.');
  return true;
}
async function discard(){
  const r = await confirmDlg({ icon:'undo', title:'לבטל את כל השינויים?', text:'הפרטים יחזרו למה שנשמר קודם.', danger:true, buttons:[{ label:'להשאיר את השינויים', kind:'primary', value:'n', auto:1 }, { label:'ביטול השינויים', kind:'quiet', value:'y', icon:'undo', anim:'back' }] });
  if (r === 'y'){ S.cur = JSON.parse(JSON.stringify(S.orig)); S.errors = {}; render(); toast('info', 'השינויים בוטלו', '', 2600); }
}
async function goBack(){
  if (!changed().length) return toast('info', 'חוזרים לעמוד הקודם', 'בהדגמה נשארים כאן', 2600);
  const r = await confirmDlg({ icon:'alert', title:'יש שינויים שלא נשמרו', text:'מה לעשות איתם לפני שיוצאים?', buttons:[{ label:'שמירה ויציאה', kind:'primary', value:'save', icon:'check', auto:1 }, { label:'יציאה בלי לשמור', value:'drop', icon:'x' }, { label:'להישאר כאן', kind:'quiet', value:'stay' }] });
  if (r === 'save'){ if (await save()) toast('info', 'חוזרים לעמוד הקודם', 'בהדגמה נשארים כאן', 2600); }
  else if (r === 'drop'){ S.cur = JSON.parse(JSON.stringify(S.orig)); render(); toast('info', 'יצאת בלי לשמור', 'בהדגמה נשארים כאן', 2600); }
}
async function changePassword(){
  const old = S.pwv.old, neu = S.pwv.neu; const reset = $('#dReset').checked;
  const fail = (m, id) => { S.pwErr = m; render(); const g = $('#' + id).closest('.pw'); g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake'); $('#' + id).focus(); };
  if (!neu) return fail('צריך להקליד סיסמה חדשה', 'pw-new');
  if (neu.length < 4) return fail('הסיסמה החדשה קצרה מדי. צריך לפחות 4 תווים.', 'pw-new');
  S.pwErr = ''; S.pwBusy = true; const keep = [old, neu]; render(); $('#pw-old').value = keep[0]; $('#pw-new').value = keep[1];
  await sleep(700); S.pwBusy = false;
  const fm = failMode(); const back = (m, id) => { S.pwErr = m; render(); $('#pw-old').value = keep[0]; $('#pw-new').value = keep[1]; if (id) $('#' + id).focus(); };
  if (fm === 'session') return back('צריך להתחבר מחדש כדי להחליף סיסמה.');
  if (fm === 'network') return back('אין חיבור לשרת. הסיסמה לא הוחלפה.');
  if (fm === 'server') return back('תקלה בשרת. הסיסמה לא הוחלפה.');
  /* תשובת השרת (400): הסיסמה הנוכחית נדרשת אלא אם לעובד יש mustResetPassword — הדף לא יודע זאת מראש */
  if (!old && !reset) return back('צריך להקליד את הסיסמה הנוכחית.', 'pw-old');
  if (old && old === '0000'){ S.pwErr = 'הסיסמה הנוכחית לא נכונה.'; render(); $('#pw-old').value = keep[0]; $('#pw-new').value = keep[1]; $('#pw-old').focus(); return; }
  S.pwOpen = false; S.pwShow = { old:false, neu:false }; S.pwv = { old:'', neu:'' }; render();
  toast('ok', 'הסיסמה הוחלפה', 'גם הקוד הקצר לשעון הנוכחות התעדכן.');
}

/* ===== האזנה ===== */
document.addEventListener('click', e => {
  const t = e.target.closest('button,a'); if (!t || t.closest('#demo')) return;
  if (t.matches('.toc a')){ e.preventDefault(); const s = $(t.getAttribute('href')); s.scrollIntoView({ behavior: document.documentElement.dataset.motion ? 'auto' : 'smooth' }); const f = s.querySelector('input,button'); f && setTimeout(() => f.focus({ preventScroll:true }), 300); return; }
  if (t.matches('a[href="#"]')) e.preventDefault();
  if (t.dataset.pwshow){ const k = t.dataset.pwshow; const vals = [$('#pw-old').value, $('#pw-new').value]; S.pwShow[k] = !S.pwShow[k]; render(); $('#pw-old').value = vals[0]; $('#pw-new').value = vals[1]; $(k === 'old' ? '#pw-old' : '#pw-new').focus(); return; }
  const a = t.dataset.act;
  if (a === 'save') return save();
  if (a === 'discard') return discard();
  if (a === 'back') return goBack();
  if (a === 'pwOpen'){ S.pwOpen = !S.pwOpen; S.pwErr = ''; render(); if (S.pwOpen) setTimeout(() => $('#pw-old').focus(), 50); return; }
  if (a === 'pwCancel'){ S.pwOpen = false; S.pwErr = ''; S.pwv = { old:'', neu:'' }; render(); $('[data-act=pwOpen]').focus(); return; }
  if (a === 'pwGo') return changePassword();
  if (a === 'imgRm'){ S.cur.profileImage = ''; render(); $('label[for=avIn]').focus(); return; }
  if (a === 'retry'){ S.load = 'loading'; render(); setTimeout(() => { $('#dLoad').value = 'ok'; load(); }, 800); return; }
  if (a === 'toLogin'){ toast('info', 'עוברים למסך הכניסה', 'בהדגמה נשארים כאן', 2600); return; }
});
document.addEventListener('input', e => {
  if (e.target.id === 'pw-old' || e.target.id === 'pw-new'){ S.pwv[e.target.id === 'pw-old' ? 'old' : 'neu'] = e.target.value; return; }
  const k = e.target.dataset && e.target.dataset.f; if (!k) return;
  S.cur[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; if (S.errors[k]) delete S.errors[k];
  refreshKeep();
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.f && e.target.type !== 'checkbox'){ e.preventDefault(); save(); } }); /* FM-25: Enter בשדה = שמירה */
document.addEventListener('change', e => {
  if (e.target.id !== 'avIn') return; const f = e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onloadend = () => { S.cur.profileImage = r.result; render(); $('label[for=avIn]').focus(); }; r.readAsDataURL(f);
});

/* Tooltip יחיד */
(() => {
  const box = $('#tipbox'); let timer, cur;
  const show = el => { const txt = el.getAttribute('data-tip'); if (!txt) return; cur = el; box.textContent = txt; box.hidden = false;
    const r = el.getBoundingClientRect(), b = box.getBoundingClientRect(); let top = r.bottom + 8, left = r.left + r.width / 2 - b.width / 2;
    if (top + b.height > innerHeight - 8) top = r.top - b.height - 8; left = Math.max(8, Math.min(left, innerWidth - b.width - 8));
    box.style.top = top + 'px'; box.style.left = left + 'px'; };
  const hide = () => { clearTimeout(timer); box.hidden = true; cur = null; };
  document.addEventListener('pointerover', e => { if (e.pointerType === 'touch') return; const el = e.target.closest('[data-tip]'); if (el === cur) return; clearTimeout(timer); if (!el) return hide(); timer = setTimeout(() => show(el), 150); });
  document.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el && e.target.matches(':focus-visible')) show(el); else hide(); });
  document.addEventListener('pointerdown', e => { const el = e.target.closest('.tip'); if (e.pointerType === 'touch' && el){ cur === el ? hide() : show(el); } else if (!el) hide(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hide(); });
  addEventListener('scroll', hide, { passive:true });
})();

/* מגירת ניווט (<1024) */
$('#burger').onclick = () => {
  const s = document.createElement('div'); s.className = 'drawer-scrim'; const d = document.createElement('nav'); d.className = 'drawer'; d.setAttribute('aria-label', 'תפריט ראשי');
  d.innerHTML = [['home','בית'],['bag','הזמנות'],['users','לקוחות'],['dress','שמלות']].map(([i, l]) => `<a href="#">${ic(i)}${l}</a>`).join('');
  const close = () => { d.remove(); s.remove(); $('#burger').setAttribute('aria-expanded', false); document.documentElement.removeAttribute('data-v3-lock'); $('#burger').focus(); };
  s.onclick = close; d.addEventListener('keydown', e => { if (e.key === 'Escape') close(); }); d.querySelectorAll('a').forEach(a => a.onclick = ev => { ev.preventDefault(); close(); });
  document.body.append(s, d); $('#burger').setAttribute('aria-expanded', true); document.documentElement.setAttribute('data-v3-lock', ''); d.querySelector('a').focus();
};

/* בקרת הדגמה */
function load(){
  const k = $('#dLoad').value; cfg.s = { ...PROFILES[$('#dProfile').value].s }; if (!$('#dImg').checked) cfg.s.show_employee_profile_image = 'false';
  S.errors = {}; S.pwOpen = false; S.pwErr = '';
  if (k !== 'ok'){ S.load = k; S.orig = S.cur = null; render(); return; }
  S.load = 'ok'; S.orig = makeProfile($('#dData').value, !!PROFILES[$('#dProfile').value].long); S.cur = JSON.parse(JSON.stringify(S.orig)); render();
}
$('#dProfile').onchange = () => { $('#dImg').checked = PROFILES[$('#dProfile').value].s.show_employee_profile_image !== 'false'; load(); };
$('#dImg').onchange = () => { if (!$('#dImg').checked) cfg.s.show_employee_profile_image = 'false'; else delete cfg.s.show_employee_profile_image; if (S.cur) render(); };
$('#dData').onchange = load; $('#dLoad').onchange = load;

$('#dMotion').onchange = e => { if (e.target.checked) document.documentElement.setAttribute('data-motion', 'reduced'); else document.documentElement.removeAttribute('data-motion'); };
$('#dTheme').onclick = e => { S.dark = !S.dark; e.currentTarget.setAttribute('aria-pressed', S.dark); e.currentTarget.textContent = `חלוניות אישור: ${S.dark ? 'כהה' : 'בהיר'}`; };
load();
</script>
