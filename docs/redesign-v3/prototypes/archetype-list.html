  openLayer({ type:'form', size:'m', html, closeOnScrim:false, onMount(d, layer){
    const inp = d.querySelector('#exRows'), h = d.querySelector('#exRowsH');
    const upd = () => { rows = parseInt(inp.value, 10) || 0; h.innerHTML = rows > max && !approved ? `${ic('lock','sm')} מעל ${num(max)} שורות — יידרש אישור בסיסמה` : approved ? `${ic('check','sm')} אושר` : `עד ${num(max)} שורות בלי אישור`; };
    upd(); inp.oninput = upd;
    d.querySelectorAll('[data-x]').forEach(b => b.onclick = () => closeLayer(layer, null));
    d.querySelectorAll('[data-et]').forEach(b => b.onclick = () => { tabE = b.dataset.et; d.querySelectorAll('[data-et]').forEach(x => { x.setAttribute('aria-selected', x === b); x.tabIndex = x === b ? 0 : -1; }); d.querySelector('#ep-r').hidden = tabE !== 'regular'; d.querySelector('#ep-a').hidden = tabE !== 'ai'; });
    d.querySelectorAll('[data-ex]').forEach(b => b.onclick = async () => {
      if (b.dataset.ex.endsWith('_ai') && !d.querySelector('#exAi').value.trim()){ d.querySelector('#exAi').focus(); return toast('info', 'צריך לכתוב איך לסדר את הדוח', '', 2600); }
      if (rows < 1) { inp.focus(); return; }
      if (rows > max && !approved){ const ok = await codeDlg({ title:'אישור ייצוא גדול', purpose:`ייצוא של ${rows.toLocaleString('he-IL')} שורות (מעל ${max}).`, withPicker:false }); if (!ok) return; approved = true; upd(); }
      b.disabled = true; b.innerHTML = `${ic('loader','','loop')}מכינים…`;
      setTimeout(() => { closeLayer(layer, 'ok'); if (serverFails()) return toast('err', 'הייצוא נכשל', 'השרת לא ענה. נסו שוב.'); toast('ok', b.dataset.ex.startsWith('pdf') ? 'חלון ההדפסה נפתח' : 'הקובץ ירד', `${Math.min(rows, query().total).toLocaleString('he-IL')} שורות`); }, 800);
    });
  }});
}

/* ===== אשף הדפסת דוחות (טופס אחד — STEPPER-PATTERNS #9: לא סטפר) ===== */
function printDlg(){
  const prep = cfg.flag('enable_batch_print_prep');
  const types = [['alterations_pending','תיקונים שעוד לא בוצעו','clock'],['alterations_all','כל התיקונים','check'],['orders_no_alterations','הזמנות בלי תיקונים','file'],['orders_all','כל ההזמנות','file'],['labels','תוויות לתופרות','tag'], ...(prep ? [['order_prep_by_date','פירוט הזמנות להכנה — דף לכל הזמנה','printer']] : [])];
  let type = prep ? 'order_prep_by_date' : 'alterations_pending';
  const modes = () => type === 'order_prep_by_date' ? [['prep_today','הכנות להיום'],['single','תאריך אחר'],['custom','טווח תאריכים']] : [['current','מה שמוצג עכשיו ברשימה'],['today','אירועים של היום'],['custom','טווח תאריכים']];
  let mode = modes()[0][0];
  const html = `<div class="dlg-h"><span class="dlg-badge">${ic('printer','lg')}</span><div style="flex:1;min-width:0"><h2 id="%TID%">הדפסת דוח</h2><p>בוחרים סוג דוח ותאריכים, ומקבלים קובץ להדפסה.</p></div><button type="button" class="x-btn" data-x aria-label="סגירה">${ic('x')}</button></div>
    <div class="dlg-b"><div class="form"><fieldset style="border:0;padding:0;margin:0"><legend class="flbl" style="margin-bottom:8px">איזה דוח?</legend><div class="radios" id="ptypes"></div></fieldset>
      <fieldset style="border:0;padding:0;margin:0"><legend class="flbl" style="margin-bottom:8px" id="pmodeL">אילו תאריכים?</legend><div class="radios" id="pmodes"></div></fieldset><div id="pdates"></div></div></div>
    <div class="dlg-f"><button type="button" class="btn primary" data-go>${ic('printer','','rise')}יצירת הדוח</button><button type="button" class="btn quiet" data-x>ביטול</button></div>`;
  openLayer({ type:'form', size:'m', html, closeOnScrim:false, onMount(d, layer){
    const draw = () => {
      d.querySelector('#ptypes').innerHTML = types.map(([v, l, i]) => `<label class="radio"><input type="radio" name="pt" value="${v}" ${v === type ? 'checked' : ''}>${ic(i)}<span>${l}</span></label>`).join('');
      d.querySelector('#pmodeL').textContent = type === 'order_prep_by_date' ? 'לפי איזה תאריך?' : 'אילו תאריכים?';
      d.querySelector('#pmodes').innerHTML = modes().map(([v, l]) => `<label class="radio"><input type="radio" name="pm" value="${v}" ${v === mode ? 'checked' : ''}><span>${l}${v === 'current' ? `<small>לפי החיפוש והסינון (עד 2,000 הזמנות)</small>` : ''}</span></label>`).join('');
      d.querySelector('#pdates').innerHTML = mode === 'custom' ? `<div class="form-grid"><div class="field"><label for="pF">מתאריך</label><input class="input" type="date" id="pF"></div><div class="field"><label for="pT">עד תאריך</label><input class="input" type="date" id="pT"></div></div>` : mode === 'single' ? `<div class="field"><label for="pS">תאריך</label><input class="input" type="date" id="pS"></div>` : '';
      d.querySelectorAll('[name=pt]').forEach(r => r.onchange = () => { type = r.value; mode = modes()[0][0]; draw(); d.querySelector(`[name=pt][value="${type}"]`).focus(); });
      d.querySelectorAll('[name=pm]').forEach(r => r.onchange = () => { mode = r.value; draw(); d.querySelector(`[name=pm][value="${mode}"]`).focus(); });
    };
    draw();
    d.querySelectorAll('[data-x]').forEach(b => b.onclick = () => closeLayer(layer, null));
    d.querySelector('[data-go]').onclick = () => {
      const need = mode === 'custom' ? ['#pF','#pT'] : mode === 'single' ? ['#pS'] : [];
      const miss = need.find(s => !d.querySelector(s).value); if (miss){ const f = d.querySelector(miss).closest('.field'); f.classList.add('is-err'); if (!f.querySelector('.ferr')) f.insertAdjacentHTML('beforeend', `<span class="ferr" role="alert">${ic('alert','sm')}צריך לבחור תאריך</span>`); d.querySelector(miss).focus(); return; }
      closeLayer(layer, 'ok'); serverFails() ? toast('err', 'הדוח לא נוצר', 'השרת לא ענה. נסו שוב.') : toast('ok', 'הדוח מוכן להדפסה', types.find(t => t[0] === type)[1]);
    };
  }});
}

/* ===== האזנה ===== */
document.addEventListener('click', e => {
  const t = e.target.closest('button,a,tr.orow'); if (!t) return;
  if (t.matches('tr.orow')){ if (e.target.closest('button,a,input')) return; return openOrder(t.dataset.row); } /* לחיצה על שורה = פתיחה (LI-40) */
  if (t.dataset.tab){ const k = t.dataset.tab; if (k === 'all'){ S.search = ''; $('#q').value = ''; S.adv = defaultAdv(); } S.tab = k; S.ai = null; S.page = 1; S.open.clear(); renderList(); $(`[data-tab="${k}"]`).focus(); return; }
  if (t.dataset.sort){ const k = t.dataset.sort; if (S.sort === k) S.order = S.order === 'asc' ? 'desc' : 'asc'; else { S.sort = k; S.order = 'asc'; } renderList(); $(`[data-sort="${k}"]`) && $(`[data-sort="${k}"]`).focus(); return; }
  if (t.dataset.exp){ e.stopPropagation(); const id = +t.dataset.exp; S.open.has(id) ? S.open.delete(id) : S.open.add(id); renderList(); const again = innerWidth <= 640 ? document.querySelector(`.clist [data-exp="${id}"]`) : document.querySelector(`.olist [data-exp="${id}"]`); again && again.focus(); return; }
  if (t.dataset.more){ e.stopPropagation(); return menuFor(t, byId(t.dataset.more)); }
  if (t.dataset.open){ return openOrder(t.dataset.open); }
  if (t.dataset.rental){ return rental(byId(t.dataset.rental)); }
  if (t.dataset.del){ return del(byId(t.dataset.del)); }
  if (t.dataset.page){ return goPage(+t.dataset.page); }
  if (t.dataset.unpill){ const k = t.dataset.unpill; if (k === 'search'){ S.search = ''; $('#q').value = ''; } else if (k === 'dates'){ S.adv.eventDateFrom = S.adv.eventDateTo = null; } else if (k === 'rentalStatus') S.adv.rentalStatus = []; else S.adv[k] = ''; S.page = 1; renderList(); ($('#pills .px') || $('#q')).focus(); return; }
  const a = t.dataset.act;
  if (a === 'adv') return advDlg();
  if (a === 'export') return exportDlg();
  if (a === 'print') return printDlg();
  if (a === 'capacity') return toast('info', 'חיפוש תפוסה', 'בחירת דגם, מידה ותאריך — חלון נפרד, מחוץ לאב-טיפוס הזה', 4000);
  if (a === 'new') return toast('info', 'עוברים להזמנה חדשה', 'ראו archetype-wizard.html', 3000);
  if (a === 'retry'){ S.load = 'loading'; renderList(); setTimeout(() => { S.load = 'ok'; $('#dLoad').value = 'ok'; renderList(); }, 900); return; }
  if (a === 'clearAll'){ S.search = ''; $('#q').value = ''; S.adv = Object.assign(defaultAdv(), { eventDateFrom:null }); S.ai = null; S.page = 1; renderList(); $('#q').focus(); return; }
  if (a === 'exitAi'){ S.ai = null; renderList(); $('#q').focus(); return; }
  if (a === 'flip'){ S.order = S.order === 'asc' ? 'desc' : 'asc'; renderList(); $('[data-act=flip]').focus(); return; }
});
$('#statsBtn').onclick = () => toast('info', 'שאלות סטטיסטיקה', 'חלון השאלות הוא רכיב נפרד, מחוץ לאב-טיפוס הזה', 4000);
document.addEventListener('change', e => { if (e.target.id === 'sortSel'){ S.sort = e.target.value; S.order = S.sort === 'eventDate' ? 'asc' : S.order; renderList(); $('#sortSel').focus(); } });
document.addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('[data-pagein]') && e.key === 'Enter'){ const v = parseInt(e.target.value, 10); const { pages } = query(); if (v >= 1 && v <= pages) goPage(v); else { e.target.value = S.page; toast('info', `אפשר עמוד 1 עד ${pages}`, '', 2600); } }
  if (e.target.matches && e.target.matches('.statseg button') && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')){ e.preventDefault(); const all = $$('.statseg button'); const i = all.indexOf(e.target); (all[(i + (e.key === 'ArrowLeft' ? 1 : -1) + all.length) % all.length]).focus(); } /* RTL: שמאלה = הבא */
});
$('#searchForm').onsubmit = e => { e.preventDefault(); S.search = $('#q').value.trim(); S.ai = null; S.page = 1; S.open.clear(); renderList(); };
$('#q').oninput = () => { $('#qClear').hidden = !$('#q').value; };
$('#qClear').onclick = () => { $('#q').value = ''; S.search = ''; S.ai = null; S.page = 1; renderList(); $('#q').focus(); };

/* ===== בקרת הדגמה ===== */
function applyProfile(){ cfg.profile = $('#dProfile').value; cfg.s = { ...PROFILES[cfg.profile].s }; $('#dProfileNote').textContent = PROFILES[cfg.profile].note; renderTopbar('הזמנות', PROFILES[cfg.profile].orgName); S.long = !!PROFILES[cfg.profile].long; }
function loadData(){ S.all = makeOrders(S.data, S.long); S.open.clear(); S.page = 1; }
$('#dProfile').onchange = () => { applyProfile(); if (S.tab === 'drafts' && cfg.flag('draft_orders_show_as_deleted')) S.tab = 'soon'; loadData(); renderList(); };
$('#dData').onchange = e => { S.data = e.target.value; loadData(); renderList(); };
$('#dLoad').onchange = e => { S.load = e.target.value; renderList(); };
$('#dDrafts').onchange = () => renderList();
$('#dMotion').onchange = e => { if (e.target.checked) document.documentElement.setAttribute('data-motion', 'reduced'); else document.documentElement.removeAttribute('data-motion'); };
$('#dTheme').onclick = e => { UI.dark = !UI.dark; e.currentTarget.setAttribute('aria-pressed', UI.dark); e.currentTarget.textContent = `חלוניות אישור/קוד: ${UI.dark ? 'כהה' : 'בהיר'}`; toast('info', `חלוניות אישור וקוד: ${UI.dark ? 'כהות' : 'בהירות'}`, 'חלונות הזנת מידע נשארים בהירים תמיד', 2600); };
$$('[data-demo]').forEach(b => b.onclick = () => {
  if (b.dataset.demo === 'notice') notice('success', 'הזמנה 53581 נשמרה', 'ההזמנה נוספה לרשימה. הפס הזהוב יורד במשך 15 שניות; ריחוף עוצר אותו', { label:'פתיחת ההזמנה', run(){ openOrder(53581); } });
  if (b.dataset.demo === 'toast') toast('ok', 'דוגמה להודעה', 'נסגרת לבד אחרי כמה שניות; ריחוף עוצר את הטיימר');
});
applyProfile(); loadData(); renderList();

</script>
