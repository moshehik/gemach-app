<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כרטיס הזמנה – סקיצה B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* === 3 families: NAVY (blue) / SKY (light blue) / GOLD === */
  --navy-900:#0a2242; --navy:#0f2c52; --navy-700:#173c6b; --navy-500:#2b5a94;
  --sky-50:#f3f9fe; --sky-100:#e4f1fb; --sky-200:#cfe6f7; --sky-300:#a9d2f0; --sky-400:#7fb8e6;
  --gold-50:#fbf6e3; --gold-100:#f4e8c1; --gold-300:#e0c56e; --gold:#c9a227; --gold-b:#b8912f; --gold-d:#9a7a1f; --gold-700:#6f5710;
  --rose-50:#fff5f9; --rose-100:#fde6ef; --rose-200:#fbcfe0; --rose-300:#f4a6c0; --rose-500:#d9739c; --rose-700:#a83d6c;
  --gbtn:linear-gradient(135deg,#d9b84a 0%,#b8912f 100%);
  --gbtn-d:#9a7a1f;
  /* semantic aliases (mapped ONLY to the 3 families) */
  --bg:var(--sky-200); --surface:#fff; --surface2:var(--sky-50); --line:var(--sky-300); --line2:var(--sky-100);
  --ink:var(--navy-900); --ink2:#2f4a6b; --ink3:#4d6787;
  --brand:var(--navy); --brand-d:var(--navy-900); --brand-t:var(--sky-100);
  --gold-t:var(--gold-100);
  --green:var(--navy); --green-t:var(--sky-200);
  --blue:var(--navy-500); --blue-t:var(--sky-100);
  --amber:var(--rose-700); --amber-t:var(--rose-100);
  --red:var(--gold-700); --red-t:var(--gold-100);
  --teal:var(--navy-500); --teal-t:var(--sky-200);
  --plum:var(--rose-700); --plum-t:var(--rose-100);
  --navy2:var(--navy-700);
  --r:16px; --r-sm:12px;
  --sh:0 1px 2px rgba(15,44,82,.06),0 8px 24px -10px rgba(15,44,82,.22);
  --sh-lg:0 20px 60px -15px rgba(10,34,66,.5);
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Rubik','Heebo',system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 500px at 85% -10%,var(--sky-50) 0,transparent 60%),radial-gradient(900px 500px at 0% 0%,var(--sky-200) 0,transparent 55%);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
bdi,.num{unicode-bidi:isolate}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}.ic.lg{width:24px;height:24px}

/* demo strip */
.demo{background:var(--navy);color:var(--gold-100);font-size:14px;padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.demo b{color:var(--gold-300);font-weight:600;margin-inline-end:4px}
.demo button{background:var(--navy-700);border:1px solid var(--navy-700);color:#fff;border-radius:999px;padding:5px 14px;font-size:14px}
.demo button:hover{background:var(--navy-700)}

.app{max-width:1240px;margin:0 auto;padding:20px 20px 60px}

/* top bar */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.back{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;box-shadow:var(--sh);flex:none}
.back:hover{background:var(--brand-t);color:var(--brand)}
.ttl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex:1;min-width:0}
.ttl h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.3px}
.ttl h1 small{font-weight:500;color:var(--ink3);font-size:18px;margin-inline-end:6px}
.tools{display:flex;gap:8px;align-items:center;position:relative}
.ibtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink2);position:relative}
.ibtn:hover{background:var(--surface2);color:var(--ink)}
.ibtn.danger:hover{background:var(--red-t);color:var(--red);border-color:var(--gold-d)}
.menu{position:absolute;top:52px;inset-inline-end:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-lg);padding:6px;min-width:230px;z-index:30;display:none}
.menu.open{display:block}
.menu button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;padding:10px 12px;border-radius:10px;text-align:start}
.menu button:hover{background:var(--surface2)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:14px;font-weight:500;line-height:1.5;white-space:nowrap;border:1px solid transparent}
.chip.amber{background:var(--amber-t);color:var(--amber)}
.chip.blue{background:var(--blue-t);color:var(--blue)}
.chip.green{background:var(--green-t);color:var(--green)}
.chip.red{background:var(--red-t);color:var(--red)}
.chip.rose{background:var(--brand-t);color:var(--brand)}
.chip.gold{background:var(--gold-t);color:var(--gold)}
.chip.teal{background:var(--teal-t);color:var(--teal)}
.chip.gray{background:var(--sky-100);color:var(--ink2)}
.chip.btnlike{cursor:pointer}
.chip .ic{width:15px;height:15px}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}

/* stepper */
.stepper{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px 28px 16px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);position:relative}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;text-align:center}
.step .c{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--sky-200);color:var(--ink3);font-weight:600;z-index:1;transition:.3s;border:3px solid var(--surface)}
.step.done .c{background:var(--green);color:#fff}
.step.cur .c{background:var(--brand);color:#fff;box-shadow:0 0 0 6px var(--brand-t)}
.step b{font-size:16px;font-weight:600}
.step span{font-size:14px;color:var(--ink3)}
.step.cur b{color:var(--brand)}
.step:not(:last-child)::after{content:"";position:absolute;top:18px;inset-inline-start:calc(50% + 28px);width:calc(100% - 56px);height:4px;border-radius:4px;background:var(--sky-200)}
.step.done:not(:last-child)::after{background:var(--green)}
.step.linkcur:not(:last-child)::after{background:linear-gradient(to left,var(--brand) 0,var(--brand) 40%,var(--sky-200) 40%)}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:24px;margin-top:22px;align-items:start}
.rail{position:sticky;top:16px;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 32px);overflow-y:auto;scrollbar-width:none;padding:2px}
.rail::-webkit-scrollbar{display:none}
.main{min-width:0}

/* tabs */
.tabs{display:flex;gap:6px;background:var(--sky-200);padding:6px;border-radius:20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:max-content;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border:0;background:transparent;border-radius:15px;font-weight:500;color:var(--ink2);white-space:nowrap;transition:.2s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--surface);color:var(--brand);box-shadow:0 2px 8px rgba(15,44,82,.12);font-weight:600}
.tab .cnt{background:var(--sky-300);color:var(--ink2);border-radius:999px;min-width:22px;height:22px;padding:0 7px;font-size:14px;display:grid;place-items:center}
.tab.on .cnt{background:var(--brand-t);color:var(--brand)}
.tab .pip{width:9px;height:9px;border-radius:50%;background:var(--teal)}
.tab.tdel.on{color:var(--teal)}
.panel{display:none;margin-top:18px;flex-direction:column;gap:18px;animation:fade .25s ease}
.panel.on{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:22px}
.card-h{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.card-h .ico{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none}
.card-h h2{margin:0;font-size:19px;font-weight:600;flex:1;display:flex;align-items:center;gap:8px}
.ico.rose{background:var(--brand-t);color:var(--brand)}
.ico.gold{background:var(--gold-t);color:var(--gold)}
.ico.teal{background:var(--teal-t);color:var(--teal)}
.ico.green{background:var(--green-t);color:var(--green)}
.ico.plum{background:var(--plum-t);color:var(--plum)}
.ico.blue{background:var(--blue-t);color:var(--blue)}
.ico.gray{background:var(--sky-100);color:var(--ink2)}
.card.tint-info{background:var(--sky-50);border-color:var(--sky-200)}
.row{display:flex;align-items:center;gap:10px}
.spread{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}
.big{font-size:22px;font-weight:600}
.sm{font-size:14px}

.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.kv{grid-template-columns:1fr}}
.kv .f>div{min-width:0}
.kv .f .chip{margin-top:4px}
.kv .f{background:var(--surface2);border-radius:var(--r-sm);padding:12px 14px;display:flex;gap:10px;align-items:center;min-width:0}
.kv .f .ic{color:var(--ink3)}
.kv .f small{display:block;color:var(--ink3);font-size:14px;line-height:1.2}
.kv .f b{font-weight:500;overflow-wrap:anywhere}

.tip{width:24px;height:24px;border-radius:50%;border:0;background:transparent;color:var(--ink3);display:inline-grid;place-items:center;padding:0;flex:none}
.tip:hover,.tip:focus-visible{color:var(--brand);background:var(--brand-t);outline:0}
#tt{position:fixed;z-index:200;background:var(--navy);color:#fff;font-size:14px;line-height:1.45;padding:9px 13px;border-radius:12px;max-width:290px;box-shadow:var(--sh-lg);pointer-events:none;opacity:0;transform:translateY(4px);transition:.15s}
#tt.on{opacity:1;transform:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:11px 18px;font-weight:500;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 6px 16px -6px rgba(154,122,31,.55)}
.btn.primary:hover{background:var(--brand-d)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--surface2)}
.btn.lg{padding:14px 22px;font-size:17px;font-weight:600;border-radius:16px}
.btn.block{width:100%}
.btn.sm{padding:7px 13px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.danger{color:var(--red)}
.btn.danger:hover{background:var(--red-t)}

.inp{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;outline:0;transition:.15s}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-t)}
textarea.inp{resize:vertical;min-height:110px;line-height:1.6}
label.lbl{display:flex;align-items:center;gap:6px;font-weight:500;margin-bottom:7px}
.field{display:flex;flex-direction:column;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.seg{display:flex;background:var(--sky-200);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:9px 10px;display:flex;gap:7px;align-items:center;justify-content:center;color:var(--ink2);font-weight:500;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--brand);box-shadow:0 1px 5px rgba(15,44,82,.15);font-weight:600}
.seg.teal button.on{color:var(--teal)}

.sw{position:relative;display:inline-block;width:54px;height:30px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:2}
.sw i{position:absolute;inset:0;background:var(--sky-300);border-radius:999px;transition:.2s}
.sw i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;background:#fff;border-radius:50%;box-shadow:0 1px 4px rgba(10,34,66,.3);transition:.2s}
.sw input:checked + i{background:var(--teal)}
.sw input:checked + i::after{inset-inline-start:27px}
.sw input:focus-visible + i{box-shadow:0 0 0 4px var(--teal-t)}
.sw.rose input:checked + i{background:var(--brand)}
.trow{display:flex;align-items:center;gap:12px}
.trow b{font-weight:600}

/* collapsible */
.coll{border:1px dashed var(--sky-300);border-radius:var(--r);background:transparent}
.coll>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:16px 20px;font-weight:600;color:var(--ink2)}
.coll>summary::-webkit-details-marker{display:none}
.coll>summary .chev{margin-inline-start:auto;transition:.25s}
.coll[open]>summary .chev{transform:rotate(180deg)}
.coll[open]{background:var(--surface);border-style:solid;border-color:var(--line)}
.coll .in{padding:4px 20px 20px;display:flex;flex-direction:column;gap:16px}

/* items */
.scan{display:flex;gap:10px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:6px 8px 6px 14px;box-shadow:var(--sh)}
.scan input{border:0;outline:0;background:transparent;flex:1;padding:10px 4px;min-width:0}
.scan:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-t)}
.scan .ic{color:var(--brand)}
.itm{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.itm.pending{border:2px dashed var(--sky-400);background:var(--sky-50)}
.itm .top{display:flex;align-items:center;gap:16px;padding:16px 18px}
.thumb{width:64px;height:78px;border-radius:14px;flex:none;display:grid;place-items:center;color:#fff}
.itm .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.itm .model{font-size:20px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.itm .model .sz{font-size:14px;font-weight:500;background:var(--sky-200);border-radius:8px;padding:1px 10px}
.itm .price{font-size:20px;font-weight:600;min-width:74px;text-align:end}
.itm .acts{display:flex;gap:6px;align-items:center}
.itm .det{border-top:1px solid var(--line2);background:var(--surface2);padding:16px 20px;display:none;gap:12px;flex-direction:column}
.itm.open .det{display:flex}
.itm .chevb{transition:.25s}
.itm.open .chevb{transform:rotate(180deg)}
.det .dts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.det .dts small{display:block;color:var(--ink3);font-size:14px}
.addpanel{border:2px dashed var(--brand);background:var(--gold-50);border-radius:var(--r);padding:20px;display:none;flex-direction:column;gap:16px}
.addpanel.open{display:flex}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.sizes button{width:52px;height:46px;border-radius:13px;border:1.5px solid var(--line);background:var(--surface);font-weight:500}
.sizes button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.empty{text-align:center;color:var(--ink3);padding:26px}

/* delivery */
.dhero{display:flex;align-items:center;gap:16px;padding:20px 22px;border-radius:var(--r);background:linear-gradient(135deg,var(--teal-t),var(--sky-50));border:1px solid var(--sky-300)}
.dhero .ico{width:56px;height:56px;border-radius:18px;background:var(--teal);color:#fff;display:grid;place-items:center}
.dhero.off{background:var(--surface2);border-color:var(--line)}
.dhero.off .ico{background:var(--sky-300)}
.dfields.off{opacity:.45;pointer-events:none;filter:grayscale(.6)}
.legs{display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--sky-300);border-radius:12px;padding:8px 14px;font-weight:500}

/* payments */
.bal{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.bal .n{font-size:38px;font-weight:700;letter-spacing:-1px;line-height:1.1}
.pbar{height:12px;border-radius:12px;background:var(--sky-200);overflow:hidden;margin-top:14px}
.pbar i{display:block;height:100%;background:linear-gradient(to left,var(--green),var(--sky-400));border-radius:12px;transition:.5s}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line2)}
.li:last-child{border-bottom:0}
.li .ic-b{width:40px;height:40px;border-radius:12px;background:var(--sky-100);color:var(--ink2);display:grid;place-items:center;flex:none}
.li .t{flex:1;min-width:0}
.li .t b{font-weight:500;display:block}
.li .t small{color:var(--ink3);font-size:14px}
.li .a{font-weight:600;font-size:17px}
.li .a.cr{color:var(--green)}
.li.pend{background:repeating-linear-gradient(-45deg,var(--sky-50),var(--sky-50) 10px,var(--sky-50) 10px,var(--sky-50) 20px);border-radius:14px;padding-inline:12px;margin:4px 0;border:1px dashed var(--sky-400)}
.creditile{display:flex;gap:14px;align-items:center;background:var(--green-t);border:1px solid var(--sky-300);border-radius:var(--r);padding:16px 20px;color:var(--navy-700)}

/* timeline history */
.tl{display:flex;flex-direction:column;gap:0;position:relative}
.tl .e{display:flex;gap:14px;padding-bottom:18px;position:relative}
.tl .e::before{content:"";position:absolute;top:34px;bottom:0;inset-inline-start:15px;width:2px;background:var(--line)}
.tl .e:last-child::before{display:none}
.tl .e .p{width:32px;height:32px;border-radius:50%;background:var(--gold-t);color:var(--gold);display:grid;place-items:center;flex:none}
.tl .e b{font-weight:500}.tl .e small{display:block;color:var(--ink3);font-size:14px}

/* rail */
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.rsum h3{margin:0 0 2px;font-size:20px}
.brk{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.brk div{display:flex;justify-content:space-between;color:var(--ink2)}
.brk .tot{border-top:1px dashed var(--line);padding-top:11px;margin-top:2px;color:var(--ink);font-weight:700;font-size:19px}
.status{border-radius:18px;padding:16px 18px;display:flex;align-items:center;gap:14px}
.status.ok{background:var(--green-t);color:var(--navy-700)}
.status.debt{background:var(--red-t);color:var(--gold-700)}
.status.cred{background:var(--blue-t);color:var(--navy-700)}
.status .n{font-size:26px;font-weight:700;line-height:1.1}
.status small{font-size:14px;opacity:.85;display:block}
.pendbox{margin-top:12px;border-radius:14px;padding:12px 14px;background:var(--sky-50);border:1.5px dashed var(--sky-400);color:var(--navy-700);display:flex;gap:10px;align-items:center;font-weight:500}
.pendbox b{font-weight:700}
.tline{display:flex;flex-direction:column;position:relative;margin-top:6px}
.tn{display:flex;gap:14px;position:relative;padding-bottom:16px}
.tn:last-child{padding-bottom:0}
.tn::before{content:"";position:absolute;top:36px;bottom:-2px;inset-inline-start:17px;width:2px;background:repeating-linear-gradient(to bottom,var(--line) 0 4px,transparent 4px 8px)}
.tn:last-child::before{display:none}
.tn .p{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.tn b{display:block;font-weight:600;line-height:1.3}
.tn small{color:var(--ink2);font-size:14px;display:block}
.tn .dl{display:inline-flex;gap:5px;align-items:center;color:var(--teal);font-size:14px;margin-top:3px}
.ract{display:flex;flex-direction:column;gap:10px}
.saved-note{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--green);font-weight:500;font-size:14px}
.mbar{display:none}

/* toast */
#toast{position:fixed;left:24px;bottom:24px;z-index:120;display:flex;align-items:center;gap:14px;background:var(--navy);color:#fff;border-radius:18px;padding:14px 18px 14px 14px;box-shadow:var(--sh-lg);transform:translateX(-140%);opacity:0;transition:transform .5s cubic-bezier(.2,1.2,.3,1),opacity .3s;max-width:calc(100vw - 32px)}
#toast.on{transform:none;opacity:1}
#toast .tb{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
#toast.charge .tb{background:var(--gold-300);color:var(--gold-700)}
#toast.credit .tb{background:var(--sky-200);color:var(--navy-700)}
#toast.info .tb{background:var(--sky-200);color:var(--navy-700)}
#toast b{font-size:20px;display:block;line-height:1.2}
#toast small{color:var(--sky-200);font-size:14px}
#toast button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:11px;padding:8px 13px;font-size:14px;margin-inline-start:6px}
#toast button:hover{background:rgba(255,255,255,.26)}
#toast.pulse .tb{animation:pulse .6s}
@keyframes pulse{50%{transform:scale(1.18)}}

/* dialog */
.scrim{position:fixed;inset:0;background:rgba(10,34,66,.55);backdrop-filter:blur(3px);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.scrim.on{display:flex;animation:fade .2s}
.dlg{background:var(--surface);border-radius:26px;box-shadow:var(--sh-lg);width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;padding:28px;animation:pop .35s cubic-bezier(.2,1.2,.3,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.dlg h2{margin:0 0 4px;font-size:24px}
.dlg .sub{color:var(--ink2);margin-bottom:18px}
.chg{display:flex;flex-direction:column;gap:8px;margin:16px 0}
.chg .c{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface2)}
.chg .c .t{flex:1;min-width:0}
.chg .c b{font-weight:700}
.chg .amt{font-weight:700;font-size:18px;white-space:nowrap}
.chg .amt.p{color:var(--red)}.chg .amt.m{color:var(--green)}.chg .amt.z{color:var(--ink3);font-weight:500;font-size:14px}
.net{display:flex;justify-content:space-between;align-items:center;border-radius:18px;padding:16px 20px;margin-bottom:20px}
.net.charge{background:var(--red-t);color:var(--gold-700)}
.net.credit{background:var(--green-t);color:var(--navy-700)}
.net.zero{background:var(--sky-200)}
.net .v{font-size:32px;font-weight:700;line-height:1}
.dbtns{display:flex;flex-direction:column;gap:10px}
.dbtns .r2{display:flex;gap:10px}.dbtns .r2>*{flex:1}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.methods button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:500}
.methods button.on{border-color:var(--brand);background:var(--brand-t);color:var(--brand)}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:start;padding:16px;border:2px solid var(--line);border-radius:16px;background:var(--surface);width:100%}
.opt.on{border-color:var(--green);background:var(--green-t)}
.opt small{color:var(--ink2);display:block}
.amtin{direction:ltr;display:flex;align-items:center;gap:8px;font-size:34px;font-weight:700;border:2px solid var(--line);border-radius:18px;padding:8px 18px;justify-content:center}
.amtin input{border:0;outline:0;width:150px;font-size:34px;font-weight:700;text-align:center;background:transparent}
.success{text-align:center}
.success .big-ck{width:92px;height:92px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;margin:4px auto 16px;animation:pop .6s cubic-bezier(.2,1.4,.3,1)}
.success .big-ck svg{width:48px;height:48px;stroke-width:2.6;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.success .sc{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 22px}

/* responsive */
@media (max-width:1020px){
  .layout{grid-template-columns:1fr}
  .rail{position:static;order:-1}
  .rail .ract,.rail .rtimeline-full{display:none}
  .rail .tline{flex-direction:row;gap:8px}
  .rail .tn{flex-direction:column;align-items:center;text-align:center;flex:1;padding:0;gap:6px}
  .rail .tn::before{display:none}
  .rail .tn small,.rail .tn b{font-size:14px}
  .mbar{display:flex;position:fixed;bottom:0;inset-inline:0;background:rgba(243,249,254,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));gap:10px;z-index:60}
  .mbar .btn{flex:1}
  .app{padding-bottom:110px}
}
@media (max-width:640px){
  .demo{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none}
  .demo button{white-space:nowrap;flex:none}
  .topbar{gap:10px}
  .ttl{display:contents}
  .ttl h1{flex:1;order:1}
  .back{order:0;width:42px;height:42px}
  .tools{order:2}
  .tools .ibtn{width:40px;height:40px;border-radius:12px}
  #hdrChips{order:3;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  #hdrChips .chip{flex:none}
  .brk div:not(.tot){display:none}
  .brk{margin-top:10px}
  .rail{gap:12px}
  .rcard{padding:16px}
  .app{padding:14px 12px 110px}
  .ttl h1{font-size:23px}
  .stepper{padding:14px 8px 12px}
  .step .c{width:34px;height:34px}
  .step:not(:last-child)::after{top:15px;inset-inline-start:calc(50% + 24px);width:calc(100% - 48px)}
  .step b{font-size:15px}.step span{font-size:14px}
  .grid2{grid-template-columns:1fr}
  .card{padding:16px}
  .card-h .ico{width:40px;height:40px}
  .card-h h2{font-size:18px}
  .itm .top{flex-wrap:wrap;gap:12px}
  .itm .price{order:2}
  .thumb{width:54px;height:66px}
  .tab{padding:10px 13px}
  .dlg{padding:22px;border-radius:24px}
  .scrim{align-items:flex-end;padding:8px}
  #toast{left:12px;bottom:88px}
  .demo{font-size:14px;padding:8px}
  .bal .n{font-size:32px}
  .dhero{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== ORDER / CLARITY PASS: 8px scale, stacked rows, navy+sky structure, rose+gold accents ===== */
:root{--s1:8px;--s2:16px;--s3:24px;--s4:32px}
body{line-height:1.6;font-size:16px}
.app{padding:24px 24px 64px}
.layout{gap:24px;margin-top:24px}
.panel{gap:24px;margin-top:24px}
.rail{gap:16px}
/* cards: hairline, calm */
.card{padding:24px;border:1px solid var(--sky-200);box-shadow:0 1px 2px rgba(15,44,82,.04);border-radius:var(--r)}
.stepper{border:1px solid var(--sky-200);box-shadow:0 1px 2px rgba(15,44,82,.04);border-radius:var(--r);padding:24px}
.itm,.scan{border:1px solid var(--sky-200);box-shadow:0 1px 2px rgba(15,44,82,.04);border-radius:var(--r)}
.card-h{gap:16px;margin-bottom:16px;min-height:44px}
.card-h h2{font-size:18px;font-weight:600}
.card-h .ico{width:44px;height:44px;border-radius:12px;background:var(--sky-100);color:var(--navy)}
.card-h .ico.rose,.card-h .ico.plum{background:var(--rose-100);color:var(--rose-700)}
.card-h .ico.gold,.card-h .ico.green,.card-h .ico.blue,.card-h .ico.teal,.card-h .ico.gray{background:var(--sky-100);color:var(--navy)}
.ttl h1{font-size:28px;font-weight:600}
.big{font-size:20px;font-weight:600}
/* stacked label-above-value rows with hairlines */
.kv{grid-template-columns:1fr;gap:0}
.kv .f{background:none;border-radius:0;padding:16px 0;border-bottom:1px solid var(--sky-100);align-items:flex-start;gap:16px}
.kv .f:first-child{padding-top:0}
.kv .f:last-child{border-bottom:0;padding-bottom:0}
.kv .f small{font-size:14px;color:var(--ink3);line-height:1.4;margin-bottom:2px}
.kv .f b{font-size:17px;font-weight:500;color:var(--ink)}
.kv .f .ic{margin-top:4px;color:var(--navy-500)}
.kv .f .chip{margin-top:8px}
.grid2{grid-template-columns:1fr;gap:24px}
.stackl{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-top:16px}
.legs{flex-direction:column;align-items:flex-start;gap:8px;margin-top:16px}
.leg{background:var(--sky-50);border:1px solid var(--sky-200)}
.bal{flex-direction:column;align-items:stretch;gap:16px}
.bal .n{font-size:36px}
.bal>div{width:100%}
.pbar{margin-top:8px;height:8px}
lbl.lbl,label.lbl{margin-bottom:8px;color:var(--ink2);font-weight:500;font-size:15px}
.field{gap:0}
/* item card */
.itm .top{align-items:flex-start;padding:24px 24px 16px;gap:16px}
.itm .info{gap:4px}
.itm .model{font-size:20px;font-weight:600}
.itm .meta{color:var(--ink3);font-size:15px}
.itm .stat{margin-top:4px}
.itm .price{order:0;text-align:start;font-size:20px;font-weight:600;margin-top:8px;min-width:0}
.itm .acts{padding:0 24px 24px;justify-content:flex-start;gap:8px}
.itm .det{padding:24px;gap:16px;background:var(--sky-50)}
.det .dts{display:flex;flex-direction:column;gap:12px}
.det .dts small{font-size:14px;color:var(--ink3)}
.itm.pending,.li.pend{background:var(--rose-50);border:1.5px dashed var(--rose-300)}
.li.pend{background:var(--rose-50)}
.thumb{width:64px;height:80px;border-radius:12px}
/* list rows: stacked, hairline separated */
.li{align-items:flex-start;padding:16px 0;gap:16px;border-bottom:1px solid var(--sky-100)}
.li .ic-b{background:var(--sky-100);color:var(--navy);width:40px;height:40px;border-radius:12px}
.li .t small{display:block;margin-bottom:4px}
.li .a{font-size:17px;font-weight:600;margin-top:0;color:var(--ink)}
.li .a.cr{color:var(--navy)}
.li.pend{padding:16px;margin:8px 0;border-radius:12px}
.li.pend .ic-b{background:var(--rose-200);color:var(--rose-700)}
/* timeline history */
.tl .e .p{background:var(--sky-100);color:var(--navy)}
/* tabs */
.tabs{background:var(--sky-100);padding:4px;border-radius:14px;gap:4px}
.tab{min-height:44px;border-radius:12px;padding:8px 16px;transition:150ms}
.tab.on{background:#fff;box-shadow:0 1px 3px rgba(15,44,82,.12);color:var(--navy);font-weight:600}
.tab .cnt{background:var(--sky-200);color:var(--navy)}
.tab.on .cnt{background:var(--rose-100);color:var(--rose-700)}
.tab .pip{background:var(--gold)}
.seg{background:var(--sky-100);border-radius:12px}
.seg button{min-height:40px;border-radius:9px;transition:150ms}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(15,44,82,.12)}
/* chips */
.chip{padding:4px 12px;font-weight:500}
.chip.rose,.chip.amber{background:var(--rose-100);color:var(--rose-700)}
.chip.gold{background:var(--gold-100);color:var(--gold-700)}
.chip.blue,.chip.teal{background:var(--sky-200);color:var(--navy)}
.chip.gray{background:var(--sky-100);color:var(--ink2)}
/* buttons: gold = primary only; everything else quiet */
.btn{min-height:44px;background:#fff;color:var(--navy);border:1px solid var(--sky-300);box-shadow:none;border-radius:12px;font-weight:500;padding:8px 16px;transition:background-color 150ms,color 150ms,border-color 150ms}
.btn:hover{background:var(--navy);color:#fff;border-color:var(--navy);transform:none}
.btn.sm{min-height:44px;padding:8px 16px;font-size:15px}
.btn.lg{min-height:52px;font-size:17px}
.btn.primary,.btn.green{background:var(--gbtn);color:#000;border:1px solid var(--gold-d);font-weight:600;box-shadow:none}
.btn.primary:hover,.btn.green:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.navy{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.navy:hover{background:var(--navy-500);border-color:var(--navy-500)}
.btn.danger{color:var(--navy);background:#fff}
.btn.danger:hover{background:var(--rose-100);color:var(--rose-700);border-color:var(--rose-300)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--navy)}
.btn.ghost:hover{background:var(--sky-100);color:var(--navy);border-color:transparent}
.btn:disabled,.btn:disabled:hover{background:var(--sky-100);color:var(--ink3);border-color:var(--sky-200);cursor:not-allowed}
.ibtn,.back{width:44px;height:44px;border-radius:12px;background:#fff;color:var(--navy);border:1px solid var(--sky-300);box-shadow:none;transition:background-color 150ms,color 150ms,border-color 150ms}
.back{border-radius:50%}
.ibtn:hover,.back:hover,.ibtn.danger:hover{background:var(--navy);color:#fff;border-color:var(--navy);transform:none}
.ibtn.danger{color:var(--navy)}
.demo button{background:var(--navy-700);color:#fff;border:1px solid var(--navy-500);min-height:36px}
.demo button:hover{background:#fff;color:var(--navy);border-color:#fff}
.btn:focus-visible,.ibtn:focus-visible,.back:focus-visible,.demo button:focus-visible,.tab:focus-visible,.seg button:focus-visible,.sizes button:focus-visible,.methods button:focus-visible,.opt:focus-visible,.chip.btnlike:focus-visible,#toast button:focus-visible,.tip:focus-visible{outline:3px solid var(--gold);outline-offset:2px;box-shadow:none}
.sizes button{width:48px;height:44px}
.menu button{min-height:44px}
/* rail: navy, quiet secondaries, gold primary */
.rcard{padding:24px;border:0;box-shadow:none;background:var(--navy);border-radius:var(--r)}
.rail .rsum h3{font-size:20px;font-weight:600;margin:0}
.rsum .row.wrap{flex-direction:column;align-items:flex-start;gap:8px;margin-top:16px}
.brk{margin-top:16px;gap:16px}
.brk div{flex-direction:column;align-items:flex-start;gap:0;color:#c9daee;font-size:15px}
.brk div span:last-child{color:#fff;font-size:17px;font-weight:500}
.brk .tot{border-top:1px solid rgba(255,255,255,.2);padding-top:16px;margin-top:0}
.brk .tot span:first-child{color:#c9daee;font-size:15px;font-weight:400}
.brk .tot span:last-child{font-size:22px;font-weight:600;color:#fff}
.status{padding:16px 24px;border-radius:12px;border:0}
.status.ok{background:var(--navy-700)}
.status.ok .ic{color:var(--gold-300)}
.status.debt{background:var(--gbtn);color:#000}
.status.cred{background:var(--rose-200);color:var(--navy-900)}
.status .n{font-size:24px;font-weight:600}
.pendbox{background:rgba(244,166,192,.18);border:1.5px dashed var(--rose-300);color:#fff;border-radius:12px;padding:16px;margin-top:16px}
.pendbox .ic{color:var(--rose-300)}
.tline{margin-top:16px}
.tn{padding-bottom:24px}
.tn .p{width:40px;height:40px;border-radius:12px}
.tline .tn .p{background:rgba(255,255,255,.1)!important;color:var(--gold-300)!important}
.tn b{font-size:16px}
.tn small{font-size:14px;line-height:1.5}
.rcard .ract,.ract{gap:16px}
.rcard .btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}
.rcard .btn:hover{background:#fff;color:var(--navy);border-color:#fff}
.rcard .btn.primary{background:var(--gbtn);color:#000;border-color:var(--gold-d)}
.rcard .btn.primary:hover{background:#fff;color:#000}
.rcard .btn.ghost{background:transparent;border-color:transparent;color:#fff}
.rcard .btn.ghost:hover{background:rgba(255,255,255,.14);color:#fff}
.rcard .btn:disabled,.rcard .btn:disabled:hover{background:rgba(255,255,255,.08);color:#9fb7d3;border-color:transparent}
.rcard .btn:focus-visible{outline-color:var(--gold-300)}
.saved-note{color:var(--gold-300)}
.mbar .btn{background:#fff;color:var(--navy);border:1px solid var(--sky-300)}
.mbar .btn.primary{background:var(--gbtn);color:#000;border-color:var(--gold-d)}
/* dialogs / toast */
.dlg{padding:32px;border-radius:20px}
.dlg h2{font-size:24px;font-weight:600}
.chg{gap:8px;margin:24px 0}
.chg .c{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;padding:16px;background:var(--sky-50);border-radius:12px;align-items:start}
.chg .c .amt{grid-column:2}
.chg .c .ico.rose,.chg .c .ico.green,.chg .c .ico.gray{background:var(--sky-100)!important;color:var(--navy)!important}
.net{padding:16px 24px;border-radius:12px;margin-bottom:24px}
.net.charge{background:var(--gold-100);border:1px solid var(--gold-b);color:var(--navy-900)}
.net.credit{background:var(--rose-100);border:1px solid var(--rose-300);color:var(--navy-900)}
.net.zero{background:var(--sky-100)}
.opt.on{border-color:var(--navy);background:var(--sky-50)}
.methods button.on{border-color:var(--navy);background:var(--sky-100);color:var(--navy)}
.sizes button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.success .sc{flex-direction:column;align-items:center;gap:8px}
#toast.credit .tb{background:var(--rose-300);color:var(--navy-900)}
#toast.charge .tb{background:var(--gbtn);color:#000}
#toast button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;min-height:44px;border-radius:12px;padding:8px 16px}
#toast button:hover{background:#fff;color:var(--navy)}
.creditile{background:var(--rose-100);border:1px solid var(--rose-300);color:var(--navy-900);border-radius:var(--r)}
.addpanel{background:var(--rose-50);border:1.5px dashed var(--rose-300);padding:24px;gap:24px}
.scan{padding:8px 8px 8px 16px}
.dhero{padding:24px;border-radius:var(--r);border:1px solid var(--sky-200);background:var(--sky-50)}
.dhero .ico{background:var(--navy);width:56px;height:56px;border-radius:16px}
.dhero.off .ico{background:var(--sky-300)}
.coll{border:1px dashed var(--sky-300);border-radius:var(--r)}
.coll[open]{border:1px solid var(--sky-200)}
.coll>summary{min-height:56px;padding:8px 24px}
.coll .in{padding:8px 24px 24px;gap:24px}
.step .c{transition:150ms}
.chip.btnlike{min-height:32px}
.mbar{padding:8px 16px calc(8px + env(safe-area-inset-bottom));gap:8px}
@media (max-width:1020px){.rail .tn{padding-bottom:0}.layout{gap:16px}.brk div:not(.tot){display:none}.brk .tot{border-top:0;padding-top:0}.brk{margin-top:8px}.rsum .row.wrap{flex-direction:row;flex-wrap:wrap}}
@media (max-width:640px){.app{padding:16px 16px 112px}.card{padding:16px}.rcard{padding:16px}.itm .top{padding:16px 16px 8px}.itm .acts{padding:0 16px 16px}.dlg{padding:24px}.stepper{padding:16px 8px}.panel{gap:16px;margin-top:16px}}

.kv .f .chip{display:flex;width:max-content;max-width:100%}
.rcard:has(>.status){padding:8px}
.rcard:has(>.status) .pendbox{margin:8px}
#p-items .seg{min-width:0!important;max-width:none!important;flex:1 1 100%}
.seg button{min-width:0;padding:8px 6px;gap:6px}
.seg button .chip{padding:0 8px;min-width:24px;justify-content:center}
@media (max-width:640px){.seg button{font-size:15px}.seg button .ic{display:none}}
.kv .f .chip.green{background:var(--sky-100);color:var(--navy)}
#evType{min-width:0!important;flex:1 1 200px}

/* ALL buttons: gold family, black text */
.btn,.btn.danger,.btn.navy,.ibtn,.back,.demo button,.mbar .btn,#toast button,.rcard .btn,.rcard .btn.ghost,.btn.ghost{background:var(--gold-100);color:#000;border:1.5px solid var(--gold-d)}
.btn.primary,.btn.green,.rcard .btn.primary,.mbar .btn.primary,.btn.navy{background:var(--gbtn);color:#000;border:1.5px solid var(--gold-d)}
.btn:hover,.btn.danger:hover,.btn.navy:hover,.ibtn:hover,.back:hover,.demo button:hover,.mbar .btn:hover,#toast button:hover,.btn.ghost:hover,.ibtn.danger:hover,.btn.primary:hover,.btn.green:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.rcard .btn:hover,.rcard .btn.ghost:hover,.rcard .btn.primary:hover{background:#fff;color:#000;border-color:#fff}
.btn:disabled,.btn:disabled:hover{background:var(--gold-50);color:var(--gold-700);border-color:var(--gold-300)}
.rcard .btn:disabled,.rcard .btn:disabled:hover{background:var(--navy-700);color:var(--sky-300);border-color:var(--navy-500)}
.demo button{background:var(--gold-100)}
@media (max-width:420px){#p-items .seg button{font-size:14px;padding:8px 2px;gap:4px;white-space:nowrap}#p-items .seg button .chip{padding:0 6px;min-width:20px;font-size:13px}}
</style>
</head>

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const ic = (n, c='') => `<svg class="ic ${c}"><use href="#i-${n}"/></svg>`;
const money = n => `<bdi dir="ltr">₪${Math.abs(n).toLocaleString('he-IL')}</bdi>`;
const smoney = n => `<bdi dir="ltr">${n<0?'−':'+'}₪${Math.abs(n).toLocaleString('he-IL')}</bdi>`;
const tip = t => `<button type="button" class="tip" data-tip="${t}" aria-label="עזרה">${ic('info','sm')}</button>`;
const clone = o => JSON.parse(JSON.stringify(o));
const CITY = {'ירושלים':40,'בית שמש':60,'בני ברק':50,'מודיעין עילית':60};
const FEE = 40, ADD_PRICE = 120;
const TABS = [
  ['details','פרטים','user'],['items','פריטים','dress'],['delivery','משלוח','truck'],['payments','תשלומים','card'],['history','היסטוריה','clock']
];
const THUMBS = ['linear-gradient(160deg,#2b5a94,#0f2c52)','linear-gradient(160deg,#d9b84a,#9a7a1f)','linear-gradient(160deg,#7fb8e6,#2b5a94)','linear-gradient(160deg,#173c6b,#0a2242)','linear-gradient(160deg,#e0c56e,#b8912f)'];

/* ---------- data ---------- */
function baseState(){
  return {
    eventDate:'2026-10-08', notes:'הלקוחה מבקשת ניילון הגנה לשמלות. לבדוק מידה 38 לפני המשלוח.',
    eventType:'regular', spacing:'default', extraDay:'none',
    items:[

/* ---------- toast ---------- */
let toastT;
function toast(kind,big,small,btn){
  const t=$('#toast');
  const icn = kind==='charge'?'plus':kind==='credit'?'undo':'info';
  t.className=''; void t.offsetWidth;
  t.innerHTML=`<div class="tb">${ic(icn,'lg')}</div><div><b>${big}</b><small>${small||''}</small></div>${btn?`<button data-act="save">${btn}</button>`:''}`;
  t.className=kind+' on pulse';
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),kind==='info'?2600:6500);
}
function notify(){
  const n=netDelta(); if(!dirty()){ $('#toast').classList.remove('on'); return; }
  if(n>0) toast('charge',`חיוב ממתין ${money(n)}`,'יתעדכן בשמירה','לשמירה');
  else if(n<0) toast('credit',`זיכוי ממתין ${money(n)}`,'יתעדכן בשמירה','לשמירה');
  else toast('info','שינויים ממתינים לשמירה','אין השפעה על התשלום','לשמירה');
}

/* ---------- save ---------- */
function commit(payAmt,method){
  const ch=changes(); const n=netDelta();
  ch.forEach(c=>logs.unshift({t:c.text.replace(/<[^>]+>/g,''),d:nowStr(),w:'אתם'}));
  if(payAmt>0){ payments.push({id:Date.now(),method,icon:method==='מזומן'?'cash':method==='אשראי'?'card':method==='העברה'?'bank':'cheque',amt:payAmt,date:'24.9.2026',note:'שינוי הזמנה'}); logs.unshift({t:`שולם ₪${payAmt} ב${method}`,d:nowStr(),w:'אתם'}); }
  // items: drop ones that were new & deleted, keep saved flag
  cur.items = cur.items.filter(i=>!(i.deleted && !saved.items.find(s=>s.id===i.id)));
  saved = clone(cur);
  UI.savedAt = new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
  return n;
}
const nowStr = ()=>'24.9.2026 · '+new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});

/* ---------- credit timer ---------- */
let credInt;
function tickCredit(){
  const el=$('#cdown'); if(!el||!UI.creditUntil) return;
  const left=Math.max(0,UI.creditUntil-Date.now()); const m=Math.floor(left/60000), s=Math.floor(left%60000/1000);
  el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

/* ---------- tooltip ---------- */
const tt=$('#tt');
function showTip(el){ tt.textContent=el.dataset.tip; tt.classList.add('on'); const r=el.getBoundingClientRect(), w=tt.offsetWidth, h=tt.offsetHeight;
  let x=r.left+r.width/2-w/2; x=Math.max(10,Math.min(innerWidth-w-10,x)); let y=r.top-h-10; if(y<8) y=r.bottom+10; tt.style.left=x+'px'; tt.style.top=y+'px'; }
document.addEventListener('mouseover',e=>{const t=e.target.closest('.tip'); if(t) showTip(t);});
document.addEventListener('mouseout',e=>{if(e.target.closest('.tip')) tt.classList.remove('on');});
document.addEventListener('focusin',e=>{const t=e.target.closest('.tip'); if(t) showTip(t);});
document.addEventListener('focusout',e=>{if(e.target.closest('.tip')) tt.classList.remove('on');});

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const tp=e.target.closest('.tip'); if(tp){ showTip(tp); setTimeout(()=>tt.classList.remove('on'),3500); return; }
  if(!e.target.closest('.tools')&&!e.target.closest('[data-act=menu]')) $('#pmenu').classList.remove('open');
  const tabB=e.target.closest('[data-tab]'); if(tabB){ UI.tab=tabB.dataset.tab; renderTabs(); return; }
  const go=e.target.closest('[data-tab-go]'); if(go){ UI.tab=go.dataset.tabGo; renderTabs(); scrollTo({top:0,behavior:'smooth'}); return; }
  const sub=e.target.closest('[data-sub]'); if(sub){ UI.itemsSub=sub.dataset.sub; $('#p-items').innerHTML=pItems(); return; }
  const sz=e.target.closest('[data-size]'); if(sz){ UI.addSize=sz.dataset.size; const v=$('#addModel').value; $('#p-items').innerHTML=pItems(); $('#addModel').value=v; return; }
  const dr=e.target.closest('[data-dir]'); if(dr){ cur.delivery.dir=dr.dataset.dir; afterEdit(true); return; }
  const sp=e.target.closest('[data-sp]'); if(sp){ const v=sp.dataset.sp; cur.spacing=v==='default'?'default':+v; UI.openItem.adv=true; renderPanels(); return; }
  const xd=e.target.closest('[data-xd]'); if(xd){ cur.extraDay=xd.dataset.xd; UI.openItem.adv=true; renderPanels(); return; }
  const et=e.target.closest('[data-evt]'); if(et){ cur.eventType=et.dataset.evt; $('#p-details').innerHTML=pDetails(); return; }
  const me=e.target.closest('[data-method]'); if(me){ UI.payMethod=me.dataset.method; const amt=$('#payAmt').value; payDlg(); $('#payAmt').value=amt; return; }
  const co=e.target.closest('[data-copt]'); if(co){ UI.creditOpt=co.dataset.copt; payDlg(); return; }
  if(e.target===$('#scrim')){ closeDlg(); return; }
  const b=e.target.closest('[data-act]'); if(!b) return;
  act(b.dataset.act,b);
});
document.addEventListener('toggle',e=>{ if(e.target.id==='adv') UI.openItem.adv=e.target.open; },true);

function afterEdit(money=true){ renderHead(); renderTabs(); renderPanels(); renderRail(); if(money) notify(); }

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='delOn'){ cur.delivery.on=t.checked; afterEdit(); }
  else if(t.id==='delOne'){ cur.delivery.oneDay=t.checked; afterEdit(false); }
  else if(t.id==='delCity'){ cur.delivery.city=t.value; afterEdit(); }
  else if(t.id==='evDate'){ if(t.value){cur.eventDate=t.value; afterEdit(false); notify();} }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='notes'){ cur.notes=t.value; renderRail(); }
  else if(t.id==='delAddr'){ cur.delivery.addr=t.value; renderRail(); }
  else if(t.id==='logQ'){ UI.logQ=t.value; const pos=t.selectionStart; $('#p-history').innerHTML=pHistory(); const n=$('#logQ'); n.focus(); n.setSelectionRange(pos,pos); }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='scanIn'){ e.preventDefault(); scan(); }
  if(e.key==='Escape') closeDlg();
});

function scan(){
  const v=$('#scanIn').value.trim(); if(!v) return;
  const it=cur.items.find(i=>!i.deleted&&i.model===v&&saved.items.find(s=>s.id===i.id&&!s.deleted));
  const msg=$('#scanMsg');
  if(it){ const sv=saved.items.find(s=>s.id===it.id); const next=it.st==='ordered'?'taken':it.st==='taken'?'returned':it.st; it.st=next; sv.st=next; msg.textContent=(next==='taken'?'הושכרה · ':'הוחזרה · ')+'דגם '+v; msg.className='chip '+(next==='taken'?'blue':'green'); }
  else { msg.textContent='לא נמצא בהזמנה'; msg.className='chip red'; }
  const keep=UI.itemsSub; renderHead(); $('#p-items').innerHTML=pItems(); renderRail();
  const m2=$('#scanMsg'); m2.textContent=msg.textContent; m2.className=msg.className; m2.style.display='inline-flex'; $('#scanIn').focus();
  setTimeout(()=>{const x=$('#scanMsg'); if(x) x.style.display='none'},2200);
}

function act(a,b){
  const id = b && b.dataset.id ? +b.dataset.id : null; const it = id?cur.items.find(i=>i.id===id):null;
  switch(a){
    case 'menu': $('#pmenu').classList.toggle('open'); scrollTo({top:0,behavior:'smooth'}); break;
    case 'toast-info': $('#pmenu').classList.remove('open'); toast('info',b.dataset.msg,'(הדגמה)'); break;
    case 'lock': toast('info','ההזמנה נעולה לעריכת תאריכים','לחצו שוב לשחרור באישור מנהל'); break;
    case 'delete': openDlg(`<h2>מחיקת הזמנה</h2><div class="sub">ההזמנה תועבר לפריטים מחוקים ותוכלו לשחזר אותה.</div><div class="dbtns"><button class="btn danger lg block" data-act="close">מחק הזמנה</button><button class="btn block" data-act="close">ביטול</button></div>`); break;
    case 'sig': cur.signed=!cur.signed; afterEdit(false); break;
    case 'editdate': UI.editDate=!UI.editDate; $('#p-details').innerHTML=pDetails(); break;
    case 'opitem': UI.openItem['i'+id]=!UI.openItem['i'+id]; b.closest('.itm').classList.toggle('open',UI.openItem['i'+id]); break;
    case 'take': case 'giveback': { const s=saved.items.find(x=>x.id===id); const nx=a==='take'?'taken':'returned'; it.st=nx; s.st=nx; afterEdit(false); break; }
    case 'edititem': toast('info','בחירת מידה פנויה','(הדגמה)'); break;
    case 'altdone': { it.alt.done=!it.alt.done; const s=saved.items.find(x=>x.id===id); if(s) s.alt.done=it.alt.done; $('#p-items').innerHTML=pItems(); break; }
    case 'rmitem': if(saved.items.find(x=>x.id===id)){ it.deleted=true; } else cur.items=cur.items.filter(x=>x.id!==id); afterEdit(); break;
    case 'restore': it.deleted=false; afterEdit(); break;
    case 'addtoggle': UI.addOpen=!UI.addOpen; $('#p-items').innerHTML=pItems(); break;
    case 'additem': { const m=$('#addModel').value.trim()||'4519'; cur.items.push({id:Date.now(),model:m,size:UI.addSize,price:ADD_PRICE,st:'ordered',alt:{},deleted:false,added:'היום'}); UI.addOpen=false; UI.itemsSub='active'; afterEdit(); break; }
    case 'scango': scan(); break;
    case 'sim-add': { cur=clone(saved); UI.tab='items'; if(!cur.items.find(i=>i.model==='4519'&&!i.deleted)) cur.items.push({id:Date.now(),model:'4519',size:'38',price:ADD_PRICE,st:'ordered',alt:{},deleted:false,added:'היום'}); afterEdit(); break; }
    case 'sim-rm': { cur=clone(saved); const x=cur.items.find(i=>i.id===2); if(x) x.deleted=true; UI.tab='items'; UI.itemsSub='active'; afterEdit(); break; }
    case 'reset': cur=clone(saved); UI.savedAt=null; closeDlg(); $('#toast').classList.remove('on'); afterEdit(false); break;
    case 'discard': case 'discard-close': cur=clone(saved); closeDlg(); $('#toast').classList.remove('on'); afterEdit(false); break;
    case 'close': closeDlg(); break;
    case 'exit': $('#pmenu').classList.remove('open'); dirty()?summaryDlg('exit'):toast('info','חזרה לרשימת ההזמנות','(הדגמה – אין שינויים)'); break;
    case 'leave-nosave': cur=clone(saved); closeDlg(); afterEdit(false); toast('info','יצאתם בלי לשמור','השינויים בוטלו (הדגמה)'); break;
    case 'save': if(dirty()) summaryDlg('save'); break;
    case 'do-save': { const n=netDelta(); if(n!==0){ payDlg(); } else { commit(0); finish('ההזמנה נשמרה',[`<span class="chip green">${ic('check')}נשמר</span>`]); } break; }
    case 'pay-now': { openDlg(''); const amt=+b.dataset.amt; const M=[['מזומן','cash'],['אשראי','card'],['העברה','bank'],['צ׳ק','cheque']];
      openDlg(`<h2>קבלת תשלום</h2><div class="sub">יתרת חוב בהזמנה</div><div class="amtin"><span>₪</span><input id="payAmt" type="number" value="${amt}" inputmode="numeric"></div><div class="methods">${M.map(([m,i])=>`<button data-method="${m}" class="${UI.payMethod===m?'on':''}">${ic(i,'lg')}${m}</button>`).join('')}</div><div class="dbtns"><button class="btn green lg block" data-act="confirm-pay-only">${ic('check')}אישור תשלום</button><button class="btn" data-act="close">חזרה</button></div>`); break; }
    case 'confirm-pay-only': { const amt=Math.max(0,+$('#payAmt').value||0); payments.push({id:Date.now(),method:UI.payMethod,icon:UI.payMethod==='מזומן'?'cash':UI.payMethod==='אשראי'?'card':UI.payMethod==='העברה'?'bank':'cheque',amt,date:'24.9.2026',note:'קבלת תשלום'}); logs.unshift({t:`שולם ₪${amt} ב${UI.payMethod}`,d:nowStr(),w:'אתם'}); closeDlg(); afterEdit(false); toast('info',`התקבל תשלום ${money(amt)}`,''); break; }
    case 'confirm-pay': { const amt=Math.max(0,+$('#payAmt').value||0); commit(amt,UI.payMethod); finish('ההזמנה נשמרה והתשלום התקבל',[`<span class="chip green">${ic('check')}נשמר</span>`,`<span class="chip blue">${ic('card')}שולם ${money(amt)} · ${UI.payMethod}</span>`]); break; }
    case 'pay-later': commit(0); finish('ההזמנה נשמרה עם יתרת חוב',[`<span class="chip green">${ic('check')}נשמר</span>`,`<span class="chip red">${ic('alert')}חוב ${money(balance())}</span>`]); break;
    case 'confirm-credit': { const n=Math.abs(netDelta()); commit(0); if(UI.creditOpt==='bank'){ payments.push({id:Date.now(),method:'החזר כספי',icon:'bank',amt:-n,date:'24.9.2026',note:'זיכוי בגין הסרת פריט'}); } if(UI.creditOpt==='credit'){ UI.creditUntil=Date.now()+15*60000-1000; UI.creditAmt=n; } finish('ההזמנה נשמרה והזיכוי נרשם',[`<span class="chip green">${ic('check')}נשמר</span>`,`<span class="chip rose">${ic('undo')}זיכוי ${money(n)}</span>`]); break; }
    case 'new-order': closeDlg(); toast('info','נפתחה הזמנה חדשה','(הדגמה)'); break;
    case 'to-list': closeDlg(); toast('info','חזרה לרשימת ההזמנות','(הדגמה)'); break;
    case 'print-done': closeDlg(); toast('info','דף ההזמנה נשלח להדפסה','(הדגמה)'); break;
  }
}
function finish(head,chips){
  successDlg(head,'הזמנה <bdi>#53375</bdi> · '+CUSTOMER.name,chips);
  $('#toast').classList.remove('on');
  renderAll();
}
renderAll();
</script>
</body>
</html>
